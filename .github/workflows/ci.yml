# Verifies every push to main and every pull request: lint, generated code in
# sync, and the full unit + envtest suite -- the same gate a change must pass
# locally (`make generate manifests build lint test`, plus `go vet -tags e2e`).
#
# make test runs with CLUSTARR_REQUIRE_TOOLS=1, so a missing tool (FFmpeg's
# libraries and the shims from `make native-assets`, helm and kustomize for
# the installer guards, KUBEBUILDER_ASSETS) fails rather than skips. The
# native test assets are the image's own pins (hack/native-assets.sh reads
# images/Dockerfile.native), not static executables. The images job builds
# the clustarr and native images and checks them through hack/image-checks.sh,
# the one definition of the image checks. The e2e suite is only compiled
# here; it needs a kind cluster. A go.mod that replaces a module with a local
# directory (the ffgo fork, until its tag is published) cannot build here,
# and the generated job says so first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTROLLER_GEN_VERSION: v0.22.0
  SETUP_ENVTEST_VERSION: v0.25.1
  KUSTOMIZE_VERSION: v5.8.1
  HELM_VERSION: v4.2.2
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=15m

  generated:
    name: generated code is current
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen
        run: go install "sigs.k8s.io/controller-tools/cmd/controller-gen@${CONTROLLER_GEN_VERSION}"

      - name: go.mod carries no local replace
        run: |
          if grep -nE '^replace .* => \.{1,2}/' go.mod; then
            echo "::error::go.mod replaces a module with a local directory; push that module's tag and replace with the tagged version"
            exit 1
          fi

      - name: Regenerate
        run: |
          make generate manifests templ
          go mod tidy

      - name: Nothing changed
        run: |
          # --porcelain also catches new untracked files a generator wrote.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff --stat
            echo "::error::generated code, CRDs, RBAC, templ output or go.mod/go.sum are stale; run make generate manifests templ && go mod tidy and commit"
            exit 1
          fi

      - name: e2e suite compiles
        run: go vet -tags e2e ./test/...

  test:
    name: unit + envtest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Go tools
        run: |
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
          go install "sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}"

      - name: Native test assets cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/native-assets
          key: native-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('images/Dockerfile.native', 'hack/native-assets.sh', 'hack/par2go/SHA256SUMS', 'Makefile') }}

      - name: Native test assets
        run: make native-assets

      - name: Chart dependencies
        run: make chart-deps

      - name: Media root
        # RootFolder.spec.path must start with /data/media/ (a CEL rule), so the
        # library-scan suites need that exact prefix to be writable.
        run: |
          sudo mkdir -p /data/media
          sudo chown "$(id -u):$(id -g)" /data/media

      - name: make test
        env:
          CLUSTARR_REQUIRE_TOOLS: "1"
        run: make test

  images:
    name: image ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: clustarr, file: images/Dockerfile.clustarr, target: clustarr, arch: amd64, runner: ubuntu-24.04,
              checks: "version:manager version:ui no-shell" }
          # native serves every pool, cpu, nvidia and intel (ADR 0015): on
          # amd64 it carries the Intel runtime and is checked for all three.
          - { image: native, file: images/Dockerfile.native, target: native, arch: amd64, runner: ubuntu-24.04,
              checks: "self-check:transcode:cpu self-check:transcode:cuda self-check:transcode:intel self-check:agent self-check:markers self-check:par2-child version:agent version:markers version:transcode no-shell" }
          - { image: native, file: images/Dockerfile.native, target: native, arch: arm64, runner: ubuntu-24.04-arm,
              checks: "self-check:transcode:cpu self-check:agent self-check:markers self-check:par2-child version:agent version:markers version:transcode no-shell" }
          - { image: native-debug, file: images/Dockerfile.native, target: native-debug, arch: amd64, runner: ubuntu-24.04,
              checks: "notices no-media-executables ffmpeg-libraries" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: selfcheck/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The one definition of the image checks (hack/image-checks.sh); GPU
      # encodes need hardware (--trial, run on hosts that have it).
      - name: Check ${{ matrix.image }}
        env:
          IMAGE: selfcheck/${{ matrix.image }}:ci
          CHECKS: ${{ matrix.checks }}
        # CHECKS is a space-separated list, split on purpose.
        run: hack/image-checks.sh "$IMAGE" $CHECKS
