version: "2"
run:
  # test/e2e is behind the `e2e` build tag, so without this every file in it
  # is invisible to the linter -- `./...` does not mean "every file", it means
  # "every file the default build constraints select". Running the linter over
  # the tag by hand found real issues the plain `make lint` had passed. Adding
  # a tag only ADDS files; the untagged tree is linted exactly as before.
  build-tags:
    - e2e
linters:
  default: standard
  enable:
    - forbidigo
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    forbidigo:
      # With analyze-types the text forbidigo matches is the RESOLVED name of
      # the method -- `client.SubResourceWriter.Update` -- not the source
      # `c.Status().Update(`. A source-shaped pattern matches nothing and the
      # rule silently passes everything, so these are anchored on the resolved
      # name and cmd/clustarr's guard test keeps them honest (§3, §14).
      #
      # Status() and SubResource("status") both return a SubResourceWriter, so
      # one pair of patterns covers every status write. pkg/k8s is excluded
      # below: PatchStatus is the one place allowed to make the call.
      forbid:
        - pattern: '^client\.(SubResourceWriter|StatusWriter)\.Update$'
          msg: "status writes must go through pkg/k8s.PatchStatus (server-side apply)"
        - pattern: '^client\.(SubResourceWriter|StatusWriter)\.Patch$'
          msg: "status writes must go through pkg/k8s.PatchStatus (server-side apply)"
      analyze-types: true
  exclusions:
    paths:
      - pkg/k8s
      - zz_generated
      # shadcn-templ's vendored components (button, icon, pagination and
      # the utils package they share), written by `shadcn-templ add` and
      # overwritten by the next one, so a style fix here would not survive.
      # ui/guard_test.go's never-writes guard still walks them.
      - ui/components
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mediactl/clustarr
