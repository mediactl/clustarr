# An IPTVProvider with a custom lineup: argon-tv on talos, 2026-11-10.
apiVersion: clustarr.io/v1alpha1
kind: IPTVProvider
metadata:
  name: argon-tv
  namespace: clustarr-system
spec:
  type: Xtream
  server: tvload.win
  credentialsRef:
    name: argon-tv-credentials
  guideURL: https://iptv-epg.org/files/epg-us.xml
  device:
    friendlyName: Clustarr Argon TV
  stream:
    buffer: 64Mi
  tuners: 1
  # The argon-tv lineup for talos (clustarr IPTVProvider spec.lineup and
  # spec.guideSources), drafted 2026-11-10 from the playlist cached 05:45Z.
  # Rules are tried in order; the first category whose groups and names match
  # and whose exclude does not takes the entry. A rule whose name repeats an
  # earlier one joins that category (the first carries the base).
  lineup:
    enabled: false            # the dry run; true at the cutover
    trim:
      - '\s*\[(1080p|720p|480p|4K[^\]]*|H265)\]'
      - '^(USA|US|TV|VIS):\s*'
      - '\s*\((E|EAST)\)$'
      - '\s+EAST$'
      - '\s*\(bk\)$'
      - '\s*\(BK\)$'
      - '\s+$'
    exclude:                  # a trimmed name or its group matching any is left out everywhere
      - '✶'
      - '\bWEST\b'
      - '\(W\)'
      - '\bINFO$'
      - '\[480p\]'
      - 'EVENT ONLY'
      - 'OVERFLOW'
      - 'ALTERNATE'
      - '\bALT[-. ]'
      - 'ESPAÑOL'
      - 'ESPANOL'
      - 'LATINO'
      - 'DEPORTES'
      - '\(ES\)'
      - 'TELEMUNDO'
      - 'UNIVISION'
      - 'UNIMAS'
      - 'GALAVISION'
      - 'UNIVERSO'
      - 'TUDN'
      - '\bVIX\b'
      - 'ESTRELLA'
      - 'SOMOS'
      - 'NOTICIAS'
      - '^MEGA TV'
      - '^AMERICA TV'
      - 'ARIRANG'
      - '^RT '
      - 'SCIENTOLOGY'
      - 'BIG BROTHER'
      - '\(VIRTUAL\)'
      - '^A3 '
      - '^ABC7 '
      - '^[A-Z .\-]+, [A-Z]{2} '        # "ATLANTA, GA WSB ABC 2 A3 ..." out-of-market locals in the TV group
      - '^(QVC|HSN|SHOP LC|JEWELRY|GEM SHOPPING|HOME SHOPPING|DEAL ZONE)'
      - '^WNYC$'
      - '^AFN '
      - 'GINX'
    categories:
      - name: Premium
        base: 10500
        groups: ['USA: MOVIES NETWORK [1080p]', 'USA: TV   [1080p]', 'USA: ENTERTAINMENT [1080p]']
