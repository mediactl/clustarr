# Default values for the clustarr umbrella chart.
# Every workload is one Deployment; see the topology table in §10.2.1 of
# docs/superpowers/specs/2026-10-06-manager-agent-split-design.md.

nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------------------------------
# Placement (docs/superpowers/specs/2026-10-21-control-plane-placement-design.md)
# --------------------------------------------------------------------------
# Two named profiles; each workload names one (its placement key). With
# enabled, a profile's nodeAffinity expressions join every required
# node-affinity term of the pod, its tolerations are added, and a onePerNode
# profile runs `replicas` pods, one per node (required hostname anti-affinity,
# maxSurge 0, a PodDisruptionBudget). The manager hands the workers profile to
# every pod it builds (--worker-placement). Off by default: a kind or
# single-node install schedules as before. The nats and cluster-plex
# subcharts take their placement literally under their own values, checked at
# render time.
placement:
  enabled: false
  profiles:
    controlPlane:
      replicas: 3
      onePerNode: true
      nodeAffinity:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    workers:
      onePerNode: false
      nodeAffinity:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      - key: kubernetes.io/arch
        operator: In
        values: [amd64]
      tolerations: []

# --------------------------------------------------------------------------
# Images
# --------------------------------------------------------------------------
# Two images (spec 2026-10-06 §10.1, R1):
#   clustarr -- distroless static: the manager and ui binaries.
#   native   -- FROM scratch: the agent, markers and transcode binaries on
#               FFmpeg 9's libraries and ONNX Runtime. Every agent, markers,
#               and everything the manager renders at runtime (the download
#               engines, the transcode pools, graft Jobs) run it, nvidia
#               pools included: the NVIDIA container runtime injects the
#               driver's libraries from the host, so there is no CUDA image
#               (docs/adr/0015-no-cuda-image.md).
# An empty tag falls back to .Chart.AppVersion.
image:
  registry: ghcr.io
  pullPolicy: IfNotPresent
  clustarr:
    repository: mediactl/clustarr
    tag: ""
  native:
    repository: mediactl/clustarr/native
    tag: ""
imagePullSecrets: []

# --------------------------------------------------------------------------
# Messaging
# --------------------------------------------------------------------------
# Leave natsUrl empty to use the bundled nats subchart. Set it to point at a
# NATS you already run (and set nats.enabled=false).
natsUrl: ""

# Collapse the JetStream topology to one replica -- R1 streams and KV buckets
# instead of §12's R3. Leave it null to derive it from the bundled subchart:
# R1 when that NATS is not clustered three ways (kind), R3 when it is. Set it
# explicitly when natsUrl points at a NATS you run yourself, because R3 streams
# simply cannot be created on a server that has no two peers.
natsSingleNode: null

nats:
  enabled: true
  config:
    cluster:
      enabled: true
      # R3 in a real cluster; drop to 1 on kind (§12).
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        # The default topology reserves 18.5 GiB per server at R3 (streams
        # 9.8, KV buckets 1.7, object stores 7.0 -- pkg/events.Default);
        # JetStream refuses a stream whose MaxBytes the file store cannot
        # reserve, so the store is sized above that. Changing the claim size
        # of a running release needs the StatefulSet recreated with
        # --cascade=orphan and the existing claims expanded.
        maxSize: 30Gi
        pvc:
          size: 30Gi
      memoryStore:
        enabled: true
        maxSize: 256Mi
    # Homelab-friendly limits (design spec §12), the same values
    # config/nats/configmap.yaml sets for kustomize. max_payload matters:
    # the nats subchart's default is the server's 1 MiB, and the index
    # agent answers its download RPC with the .nzb inline (base64 in JSON,
    # so 4/3 of its size), which a 1080p movie's ~1.3 MB .nzb already
    # exceeds -- every such grab then waited out its deadline with "context
    # deadline exceeded" (2026-09-24). The << >> markers are the
    # subchart's syntax for an unquoted value with a unit.
    merge:
      max_payload: "<< 8Mi >>"
      write_deadline: "10s"
      lame_duck_grace_period: "10s"
      lame_duck_duration: "30s"
  # One server per node: an R3 stream whose replicas share a node loses
  # quorum with that node (JetStream clustering docs, "placement"). A
  # single-node cluster runs one replica, which the constraint admits.
  podTemplate:
    topologySpreadConstraints:
      kubernetes.io/hostname:
        maxSkew: 1
        whenUnsatisfiable: DoNotSchedule
  # The NATS dashboards' exporter (prometheus-nats-exporter).
  promExporter:
    enabled: false
  # Sized for a reconnect storm, not the steady state: with 1Gi the server
  # was OOM-killed when every client reconnected at once during the first
  # upgrade of a library of 15,000 episodes and 12,000 files (smoke finding
  # O10), each reconnect re-sending its subscriptions and consumer pulls
  # while JetStream recovered its streams. GOMEMLIMIT is the server's soft
  # limit under the cgroup's, so its collector works hard before the kernel
  # kills it. config/nats/statefulset.yaml sets the same.
  container:
    # The server by version only (nats:2.15 is the scratch-based image;
    # the chart's default tag names an -alpine variant of an older server).
    # config/nats/statefulset.yaml names the same.
    image:
      tag: "2.15"
    env:
      GOMEMLIMIT: 1800MiB
    # Requests equal limits: Guaranteed QoS, so a quorum member is never
    # evicted under node memory pressure and its CPU share is predictable
    # (the NATS chart's production guidance). config/nats sets the same.
    merge:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi

# --------------------------------------------------------------------------
# Release index on Postgres (optional, design spec 2026-09-24 §A; ADR-0010)
# --------------------------------------------------------------------------
# The index agent's release index is SQLite FTS5 on the RWO storage.index PVC
# below by default (ADR-0003). Set postgres.enabled=true to run it on a
# CloudNativePG Cluster instead: the agent then reads CLUSTARR_INDEX_DSN and
# the index PVC is not rendered. agent-index still runs exactly one replica:
# its RPC responders, Torznab facade and per-host rate limiter are one
# process (spec 2026-10-06, R4 amendment).
postgres:
  enabled: false
  cluster:
    # CNPG Cluster.spec.instances -- the number of Postgres replicas CNPG
    # itself runs (streaming replication).
    instances: 1
    # Placement profile (placement.profiles), used only with placement.enabled.
    placement: workers
    storage:
      size: 5Gi
      # Empty binds against the cluster's default StorageClass, same as
      # storage.data.storageClass and storage.index.storageClass below.
      storageClass: ""
  # An existing Secret carrying the DSN under key "uri", instead of the
  # "<release>-postgres-app" Secret CNPG's bootstrap.initdb creates
  # automatically for the "clustarr" database's "clustarr" owner role. Set
  # this to point the index agent at a Postgres CNPG did not create.
  existingSecret: ""

# Plex's library database, for cluster-plex below: a CloudNativePG Cluster
# named <release>-plex-db (database and owner "plex"), rendered when
# cluster-plex.enabled. Like postgres.enabled, it needs CloudNativePG Ready
# first. Postgres 15: the shim's schema is dumped from 15, and a dump does not
# necessarily restore into a newer server. max_connections covers the shim's
# poolMax (100) times Plex's replicas (3), with room left. jit is off: Plex
# runs thousands of short queries a page, and compiling one past
# jit_above_cost costs more than running it (an arm64 node most of all).
plexDatabase:
  # instances: unset is 1, or with placement.enabled the profile's (one per
  # control-plane node); set it lower to run fewer.
  # Placement profile (placement.profiles), used only with placement.enabled.
  placement: controlPlane
  # Replication once there is more than one instance (control-plane placement
  # design §5.1, CNPG's guidance for three): a commit waits for either
  # standby (quorum any 1), preferred durability keeps Plex writing with both
  # standbys down, and no failoverQuorum -- with two standbys it would refuse
  # a failover while the primary and one standby are down.
  synchronous:
    method: any
    number: 1
    dataDurability: preferred
  # max_slot_wal_keep_size with more than one instance: the WAL a standby's
  # slot may hold. local-path enforces no claim size, so unbounded slot WAL
  # would fill the node's filesystem, which etcd shares.
  maxSlotWalKeepSize: 2GB
  # A rolling update moves the primary to an updated standby first.
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie
  storage:
    size: 5Gi
    storageClass: ""
  parameters:
    max_connections: "400"
    shared_buffers: 256MB
    work_mem: 16MB
    maintenance_work_mem: 128MB
    jit: "off"

# Plex (cluster-plex's chart, a dependency; its own values.yaml documents
# every key). Each value below that names one of this release's resources is
# rendered as a template, and assumes the default fullname, which is the
# release name when it contains "clustarr": set them yourself under a
# fullnameOverride. Plex reads the library from storage.data's claim,
# read-only, at /media; clustarr's /data/media is Plex's /media.
cluster-plex:
  enabled: false
  fullnameOverride: plex
  postgres:
    host: '{{ .Release.Name }}-plex-db-rw'
    passwordSecret:
      name: '{{ .Release.Name }}-plex-db-app'
      key: password
  storage:
    media:
      # storage.data.existingClaim when you bring your own.
      existingClaim: '{{ .Release.Name }}-data'
      subPath: media
      readOnly: true
  plex:
    metadataProviders:
      - uri: 'http://{{ .Release.Name }}-ui.{{ .Release.Namespace }}.svc.cluster.local:8080/plex/movies'
      - uri: 'http://{{ .Release.Name }}-ui.{{ .Release.Namespace }}.svc.cluster.local:8080/plex/tv'
    libraries:
      - name: Clustarr Movies
        type: movie
        provider: tv.plex.agents.custom.clustarr.movies
        language: en-US
        locations: [/media/movies]
      - name: Clustarr TV
        type: show
        provider: tv.plex.agents.custom.clustarr.tv
        language: en-US
        locations: [/media/tv]
    clustarr:
      enabled: true
      namespace: '{{ .Release.Namespace }}'
      # The server's plex.tv account, kept by cluster-plex; clustarr's Plex
      # watchlist ImportList reads its token.
      tokenSecret: plex-token
      pathMappings:
        - {clustarr: /data/media, plex: /media}
    # Live TV (cluster-plex 0.4.0): the lease holder adds this release's
    # IPTVProviders to Plex as DVRs, one per block, and every Plex pod serves
    # each block's port on a link-local address to the livetv Service. On
    # with livetv.enabled above, which it follows; set both false together.
    liveTV:
      enabled: true

# CloudNativePG: the Postgres operator itself. A separate toggle from
# postgres.enabled on purpose -- most clusters install an operator like this
# one once, cluster-wide, rather than per Clustarr release; enable this only
# when this chart should install it too. See Chart.yaml for the pinned
# version. CNPG's admission webhook fails closed until its own Deployment is
# Ready, so setting this AND postgres.enabled together on a first install is
# refused by clustarr.validate -- install this operator alone first, then
# add postgres.enabled=true in a second `helm upgrade` (see README.md's
# "Postgres release index" section for the exact commands).
cloudnative-pg:
  enabled: false

# --------------------------------------------------------------------------
# Autoscaling (spec 2026-10-06 §9)
# --------------------------------------------------------------------------
# true: the manager owns one HorizontalPodAutoscaler per queue-driven
# Deployment (agent-catalog, agent-events, agent-import, agent-caption,
# markers) and scales each on JetStream consumer lag -- to zero while its
# queues are empty (agent-events keeps one) and up to the number of nodes its
# pods can schedule on -- through the External Metrics API it serves itself
# (templates/autoscaling.yaml renders the APIService). The chart never renders
# an HPA: the manager's reconciler owns them.
# false: fixed replicas from agents.<domain>.replicas and markers.replicas,
# and no APIService. Use it where KEDA or prometheus-adapter already holds
# v1beta1.external.metrics.k8s.io: only one APIService may hold the group.
autoscaling:
  enabled: true

# --------------------------------------------------------------------------
# Monitoring
# --------------------------------------------------------------------------
# Needs the Prometheus Operator CRDs. Metrics are https on :8443 behind the
# authn/authz filter, so Prometheus's ServiceAccount needs the
# clustarr-metrics-reader ClusterRole (see config/prometheus/README.md).
metrics:
  # false serves the manager's and every agent's :8443 as plain HTTP
  # (--metrics-secure=false), for a scraper that cannot speak TLS to a pod --
  # one that scrapes every declared port over http, as Grafana Alloy's
  # discovery.kubelet does -- and the ServiceMonitors below follow it. Anyone
  # who can reach a pod can then read its metrics, so restrict that with a
  # NetworkPolicy where it matters. markers serves plain HTTP on :8080 either
  # way; ui serves no metrics.
  secure: true
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}
  # A PrometheusRule alerting on any NATS slow-consumer drop
  # (clustarr_nats_async_errors_total{kind="slow_consumer"}, ADR-0020 §3).
  # Needs the Prometheus Operator CRDs, as the ServiceMonitors do.
  prometheusRule:
    enabled: false
    additionalLabels: {}

# --------------------------------------------------------------------------
# Storage (§11)
# --------------------------------------------------------------------------
storage:
  # The single RWX volume mounted at /data by every media-touching pod.
  # Import is a hardlink or rename inside this one filesystem, so it must be
  # ONE volume shared by all of them, not one per workload. CephFS preferred;
  # NFS or Longhorn RWX acceptable; never exFAT or SMB. The chart refuses any
  # accessMode other than ReadWriteMany -- see templates/_helpers.tpl.
  data:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteMany
    size: 100Gi
  # The index agent's SQLite release index. RWO on purpose, which is one
  # reason agent-index runs one replica with strategy Recreate. Unused, and
  # not rendered, when postgres.enabled selects a Postgres-backed index.
  index:
    existingClaim: ""
    storageClass: ""
    size: 5Gi

# fsGroup on every pod that mounts a PVC; UMASK 002 so workloads can rewrite
# each other's files (§11).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# --------------------------------------------------------------------------
# Workloads (spec 2026-10-06 §10.2.1)
# --------------------------------------------------------------------------
# The parts that are not knobs -- image, command, domain, volumes, update
# strategy, grace period -- live in the templates, because getting them wrong
# is a correctness bug rather than a preference. GOMEMLIMIT is a share of
# resources.limits.memory: 80%, except agent-import and agent-caption (60%)
# and markers (50%), whose FFmpeg, par2 and ONNX Runtime allocations live
# outside the Go heap.

# Every controller in one process, one replica under the lease
# manager.clustarr.io (no replica knob). It renders the download engines, the
# transcode pools and graft Jobs, runs the MediaFile remediation loop
# (ADR-0016), writes every status (ADR-0019) and serves the External Metrics
# API.
manager:
  # Transcode admission per hardware class (--slots): class=count pairs.
  slots: cpu=2,nvidia=1,intel=1
  # GIDs of the host group owning /dev/dri/renderD* on the Intel GPU nodes
  # (--intel-render-groups), added to every Intel transcode pod as
  # supplementalGroups. Host-specific, so no default; leave empty with a
  # runtime that has device_ownership_from_security_context.
  intelRenderGroups: []
  # Override the node labels that mark NVIDIA and Intel GPU nodes
  # (--gpu-node-label-nvidia/-intel). Empty uses the binary's defaults,
  # nvidia.com/gpu.present and intel.feature.node.kubernetes.io/gpu.
  gpuNodeLabelNvidia: ""
  gpuNodeLabelIntel: ""
  # The Cardigann definitions the manager's bundle loader applies as
  # IndexerDefinitions at startup. See the README's "Cardigann definitions".
  cardigann:
    # --cardigann-bundled: load the corpus compiled into the binary
    # (Prowlarr's Cardigann definitions). false renders
    # CLUSTARR_CARDIGANN_BUNDLED=false; true renders nothing, on being the
    # binary's own default.
    bundled: true
    # A ConfigMap or claim of definition files (<id>.yml, what
    # hack/sync-cardigann writes), mounted read-only and passed as
    # --cardigann-definitions-dir. It REPLACES the corpus rather than adding
    # to it; to add or override one definition, create an IndexerDefinition
    # instead. Set at most one (clustarr.validate refuses both).
    definitions:
      # An existing ConfigMap in the release namespace, one key per file. A
      # ConfigMap holds at most 1 MiB: use a claim for the whole corpus.
      configMap: ""
      # An existing PersistentVolumeClaim holding the files.
      existingClaim: ""
      # Directory inside the ConfigMap or claim that holds the files.
      subPath: ""
  # Audio grafts running at once in the namespace (--graft-concurrency): the
  # admission ledger's graft slots, each a CPU pod of a cpu pool's size.
  graftConcurrency: 2
  # The memory limit a download engine pod gets when its DownloadClient's
  # spec.resources sets none (--engine-memory-limit-torrent/-usenet); the
  # engine's GOMEMLIMIT is 80% of it, and it requests 512Mi (or the limit,
  # if lower). A DownloadClient's own memory limit always wins. Without a
  # limit an engine had no GOMEMLIMIT and kept its garbage: a usenet engine
  # grew to 20.7 GiB, and with 8Gi it plateaued near 5.5 GB.
  engineMemoryLimits:
    # Ten concurrent transfers over up to 160 NNTP connections, each
    # pipelining yEnc articles, plus assembly and unpack buffers.
    usenet: 8Gi
    # Piece bitmaps and per-peer request state for a few hundred torrents;
    # piece data goes to files, not the heap.
    torrent: 2Gi
  # The MediaFile remediation loop (ADR-0016; loop spec §3.7, §3.17).
  remediation:
    # MediaFiles and items reconciled at once (--remediation-concurrency, 1-64).
    concurrency: 16
    # MediaFile status applies per second that no grant, answer, intent or
    # first probe caused (--remediation-bulk-writes-per-second; 0 disables
    # the pacing): a ProbeVersion or standard.Version raise stays off etcd.
    bulkWritesPerSecond: 25
    # Goroutines for the loop's /data calls (--remediation-io-workers, 1-64).
    ioWorkers: 8
  # The memory includes 128Mi for the Live TV tuner's stream buffers (at
  # most tuners x 8 MiB per provider; Live TV spec 2026-10-07 §5.0.1),
  # which run in this process.
  resources:
    requests:
      cpu: 200m
      memory: 640Mi
    limits:
      cpu: "2"
      memory: 1664Mi
  # Placement profile (placement.profiles), used only with placement.enabled.
  placement: controlPlane
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Live TV (spec 2026-10-07): the manager runs the IPTVProvider and IPTVChannel
# controllers and an HDHomeRun tuner that cluster-plex adds to Plex as DVRs.
livetv:
  # false renders --livetv-bind-address=0: no tuner, Service or policy.
  enabled: true
  # The tuner's port in the manager pod; the <release>-livetv Service maps
  # port 80 to it.
  port: 5004
  # Ports the blocks get (--livetv-port-range). cluster-plex serves each on a
  # link-local address inside its Plex pods (spec §5.0), never on a node.
  portRange: "47000-47999"
  networkPolicy:
    # A NetworkPolicy on the manager pod that admits the tuner port only from
    # allowFrom, and keeps every other manager port open. false for a CNI
    # that enforces no policies.
    enabled: true
    # Peers allowed to reach the tuner port (NetworkPolicyPeer list).
    # Default: cluster-plex's Plex pods, in whichever namespace Plex runs.
    # Narrow it with a namespaceSelector naming that namespace, e.g.
    # kubernetes.io/metadata.name: media.
    allowFrom:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            app.kubernetes.io/component: plex

# One Deployment per agent domain (agent --domain=<domain>). Agents are
# read-only against Kubernetes: they answer in NATS records, and the manager
# writes every status (ADR-0019). replicas applies only with
# autoscaling.enabled=false. consumerSlots overrides a consumer's per-pod
# handler count (CLUSTARR_CONSUMER_SLOTS), which is also the HPA's per-pod
# target, e.g. {catalog-artwork-render: 2}.
agents:
  # Searches and artwork renders. Autoscaled 0..1: its searches end in the
  # index agent's per-host limiter, which more replicas cannot feed.
  catalog:
    enabled: true
    replicas: 1
    consumerSlots: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # The RSS matcher. Its stream is memory-backed on single-node NATS, so it
  # never scales below one.
  events:
    enabled: true
    replicas: 1
    consumerSlots: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # The metadata gateway, TheIntroDB markers and artwork fetches. Always one
  # replica, Recreate: its provider rate limiters live in process memory
  # (ADR-0007), so a second replica doubles the request rate.
  metadata:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 512Mi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Library scans, file imports, import-list syncs, recycle sweeps and probes.
  # Mounts /data read-write.
  import:
    enabled: true
    replicas: 1
    consumerSlots: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # The release index, the search/download/query RPC, RSS polls and the
  # Torznab facade. Always one replica, Recreate: a SQLite index on a
  # ReadWriteOnce PVC, and under postgres.enabled still one process holding
  # the RPC responders, the facade and the per-host limiter.
  index:
    enabled: true
    # Torznab facade: /{indexer}/api, /{indexer}/download, /search/api.
    facade:
      service:
        type: ClusterIP
        port: 8080
      # The Secret holding the facade's API keys, in the release namespace;
      # the facade serves only requests carrying an apikey that is a value
      # in it. Empty means "<release fullname>-index-facade". The manager
      # creates it with one random key under "apikey" when it does not exist
      # and never modifies one that does, so pre-create it to choose the key.
      apiKeySecret: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Subtitle fetches. Autoscaled 0..1: fetches wait on the shared provider
  # token bucket. Mounts /data read-write for sidecars.
  caption:
    enabled: true
    replicas: 1
    consumerSlots: {}
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: "1"
        memory: 1Gi
    placement: workers
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Skip-segment detection (cmd/markers): FFmpeg decodes in-process, Go
# analyzes, with PaddleOCR's text detector on ONNX Runtime when cheaper
# signals are weak. Reads /data read-only and holds no ServiceAccount token.
# Autoscaled 0..N on markers-analyze's backlog, at most one pod per matching
# node (nodeSelector, affinity and tolerations decide which nodes match).
#
# A pod's slots -- the analyses it runs at once -- take one of two forms:
#   consumerSlots: {}                     automatic, the default: each pod runs
#                                         one slot per coresPerSlot of the CPUs
#                                         it can use (GOMAXPROCS: its node's,
#                                         with no CPU limit), from 1 to 8 -- at
#                                         2, a 4-CPU node runs 2 and a 16-CPU
#                                         node 8.
#   consumerSlots: {markers-analyze: 3}   fixed: every pod runs 3, whatever its
#                                         node (CLUSTARR_CONSUMER_SLOTS), and
#                                         coresPerSlot is unused.
# Each slot's FFmpeg decoders share the pod's CPUs: GOMAXPROCS / slots
# threads each, at least one.
#
# coresPerSlot (--cores-per-slot) is the CPUs each automatic slot takes. 2
# suits an analysis's decode plus Go work; 1 suits a cluster whose reads from
# /data bind before its CPUs do (a single 1 GbE NFS link a node).
#
# resources: no CPU limit, so GOMAXPROCS -- and with it the automatic slots
# and the decode threads -- follows the node; a CPU limit caps all three (a
# limit of 6 runs 3 slots at coresPerSlot 2). The memory limit holds the most
# slots a pod may run, 8: 256 MiB a pod plus 448 MiB a slot, 3.75 GiB. The
# slot's is measured (2026-10-15, FFmpeg 9 at two decode threads, 16 to 48
# rounds of a season's decodes a slot): 4K HEVC Main 10, the heaviest stream
# a library commonly holds, peaked at 350-390 MB a slot, 1080p HEVC Main 10
# at 95 MB and 1080p H.264 at 40 MB. That holds only with the 128 KiB mmap
# threshold the pod sets (GLIBC_TUNABLES): under glibc's default, freed frame
# buffers stay in its arenas, and eight 4K slots held 7.3 GB, two 2.2-3.4 GB.
# FFmpeg's frames live outside the Go heap, so GOMEMLIMIT is 50% of the
# limit. Lowering the limit, size it for the slots your nodes give:
# 256Mi + 448Mi x slots.
markers:
  enabled: true
  replicas: 1
  consumerSlots: {}
  coresPerSlot: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi
  # Placement profile (placement.profiles), used only with placement.enabled.
  placement: workers
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Server-rendered web UI (templ + htmx + SSE). Design spec amendment §A3. No
# controller-runtime manager, no CRD, no status writes -- see the note in
# templates/deployments.yaml for why it does not use clustarr.workload.
ui:
  enabled: true
  # replicas: unset is 1, or with placement.enabled the profile's (one per
  # control-plane node); set it lower to run fewer.
  # The authentication mode (--auth-mode), chosen explicitly: the binary
  # refuses to serve without one, and this default is what makes a Helm
  # install choose. The only mode is anonymous, which serves every request
  # without a login, so the Service MUST sit behind ingress authentication
  # and never be exposed directly (amendment §A3.5).
  auth:
    mode: anonymous
  # How many results the pipeline page keeps beside its in-flight entries
  # (--pipeline-history), newest first: two pages at the default page size.
  # 0 shows in-flight entries only. Nothing in the cluster is deleted.
  pipelineHistory: 100
  # The Plex Custom Metadata Provider (design spec §D;
  # docs/research/plex-metadata-provider.md): served read-only by this ui
  # process at /plex/movies and /plex/tv. It is unauthenticated by the Plex
  # protocol itself -- there is no token, header or query parameter for
  # auth, so it reveals the whole catalog to anyone who can reach it. Read
  # this chart's README "Plex provider" section before setting externalURL
  # to anything but a private, cluster-internal address, and NEVER put this
  # Service, or a path routing to it, behind a public ingress (see the
  # ingress note under ui.auth above: the same rule that keeps the UI
  # itself off a public ingress applies here, more strictly, since this
  # path has no login at all).
  #
  # enabled maps to --plex-provider: false unmounts /plex entirely (a plain
  # 404, not the 503 below) and silences the startup warning that empty
  # externalURL would otherwise log. externalURL maps to --external-url
  # (env CLUSTARR_EXTERNAL_URL), the absolute base every thumb, art and
  # Image[].url this provider hands Plex is built on -- e.g. the ui
  # Service's own in-cluster DNS name,
  # "http://<release>-ui.<namespace>.svc.cluster.local:8080", for a PMS
  # reachable from inside the cluster, or a private ingress hostname if PMS
  # runs elsewhere. Empty (the default) means no shipped value can guess an
  # operator's own reachable hostname, so the provider roots answer 503
  # naming the flag, exactly as `ui --external-url=""` does.
  #
  # plexGuids maps to --plex-guids: items a plex MetadataProvider found in
  # Plex's own metadata service are answered with their plex:// GUIDs, which
  # Plex Web needs to offer Watchlist (docs/superpowers/specs/
  # 2026-10-06-plex-native-guids-design.md). false answers clustarr's own
  # GUIDs for new matches; items PMS already holds by plex:// keep resolving.
  #
  # The provider's extras route (Plex's own trailers) needs no token here:
  # the metadata gateway fetches them with the plex MetadataProvider's token
  # and keeps them in the clustarr-plex-extras bucket.
  plex:
    enabled: true
    externalURL: ""
    plexGuids: true
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Placement profile (placement.profiles), used only with placement.enabled.
  placement: controlPlane
  nodeSelector: {}
  tolerations: []
  affinity: {}
