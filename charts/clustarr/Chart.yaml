apiVersion: v2
name: clustarr
description: Kubernetes-native, event-driven media automation -- catalog, indexers, downloads, transcoding and subtitles as CRDs and controllers.
type: application
home: https://clustarr.io
sources:
- https://github.com/mediactl/clustarr
keywords:
- media
- automation
- nats
- jetstream
maintainers:
- name: mediactl
  url: https://github.com/mediactl
# Chart version; bumped on every chart change.
version: 0.4.0
# Version of Clustarr itself. Also the default image tag -- see values.yaml.
appVersion: "0.1.0"
# CEL validation rules in the CRDs and podFailurePolicy on the transcode Jobs
# both need 1.31+.
kubeVersion: ">=1.31.0-0"

# Umbrella chart. Both dependencies are conditional, so `helm dependency
# update` must run before install/lint/template even if you enable none of
# them -- Helm checks that every declared dependency is present in charts/.
dependencies:
# JetStream is required: it carries the work queues, the release firehose, the
# history log and the KV buckets (design spec §3). Disable this subchart only
# to point natsUrl at a NATS you already run.
- name: nats
  version: 2.14.6
  repository: https://nats-io.github.io/k8s/helm/charts/
  condition: nats.enabled
# CloudNativePG: the Postgres operator, needed only when postgres.enabled
# selects a Postgres-backed release index for indexarr instead of its default
# local SQLite FTS5 database (design spec 2026-09-24 §A.3-A.4; ADR-0010).
# Off by default and independent of postgres.enabled: most clusters install
# an operator like this one once, cluster-wide, rather than per release --
# set cloudnative-pg.enabled=true only when this chart should install it too.
#
# Pinned to 0.29.1 (operator 1.30.1), the latest stable release as of
# 2026-09-24 (github.com/cloudnative-pg/charts, `helm search repo
# cloudnative-pg/cloudnative-pg`).
- name: cloudnative-pg
  version: 0.29.1
  repository: https://cloudnative-pg.github.io/charts
  condition: cloudnative-pg.enabled
