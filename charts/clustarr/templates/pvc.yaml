{{/*
§11. One RWX volume at /data shared by every media-touching pod, plus
the index agent's RWO SQLite volume. Skipped when you bring your own claim, or (the
index volume only) when postgres.enabled selects a Postgres-backed release
index instead (design spec 2026-09-24 §A; ADR-0010) -- see
templates/postgres-cluster.yaml.
*/}}
{{- if not .Values.storage.data.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clustarr.fullname" . }}-data
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
  annotations:
    # Keep the library when the release goes away. Deleting a media library
    # should take more than `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - {{ .Values.storage.data.accessMode }}
  {{- with .Values.storage.data.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
{{- end }}
{{- if and .Values.agents.index.enabled (not .Values.postgres.enabled) (not .Values.storage.index.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clustarr.fullname" . }}-index
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
  annotations:
    # Keep the release index when the release goes away: its PV reclaims with
    # Delete, and every RSS-collected release lives in it (OD39).
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  {{- with .Values.storage.index.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.index.size }}
{{- end }}
