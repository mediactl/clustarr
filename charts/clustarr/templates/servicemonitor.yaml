{{- if .Values.metrics.serviceMonitor.enabled }}
{{/*
§13: metrics are https on :8443 behind controller-runtime's authn/authz
filter, so scrapes need a bearer token AND Prometheus's ServiceAccount needs
the clustarr-metrics-reader ClusterRole below bound to it. Without that
binding every target reports 401 and the ServiceMonitors look broken.
The manager's certificate is self-signed at startup, hence insecureSkipVerify.
With metrics.secure=false the pods serve plain HTTP, and the scrape sends no
token: nothing reads one there, and it would cross the network in the clear.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clustarr.fullname" . }}-metrics-reader
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
{{- $components := list "manager" }}
{{- range $d := list "catalog" "events" "metadata" "import" "index" "caption" }}
{{- if (index $.Values.agents $d).enabled }}{{ $components = append $components (printf "agent-%s" $d) }}{{ end }}
{{- end }}
{{/* ui has no metrics port -- no controller-runtime manager standing one
     up -- so it gets no ServiceMonitor. */}}
{{- range $components }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
    {{- with $.Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "clustarr.selectorLabels" (dict "root" $ "component" .) | nindent 6 }}
  endpoints:
  - port: metrics
    path: /metrics
    {{- if $.Values.metrics.secure }}
    scheme: https
    interval: {{ $.Values.metrics.serviceMonitor.interval }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      insecureSkipVerify: true
    {{- else }}
    scheme: http
    interval: {{ $.Values.metrics.serviceMonitor.interval }}
    {{- end }}
{{- end }}
{{- if .Values.markers.enabled }}
---
{{/* markers serves /metrics over plain http on 8080 (no controller-runtime
     manager, no authn filter): no bearer token, no TLS. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "clustarr.fullname" . }}-markers
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: markers
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "clustarr.selectorLabels" (dict "root" $ "component" "markers") | nindent 6 }}
  endpoints:
  - port: metrics
    path: /metrics
    scheme: http
    interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
