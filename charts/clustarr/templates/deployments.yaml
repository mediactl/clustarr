{{- include "clustarr.validate" . -}}
{{/*
One Deployment per row of the process topology (spec 2026-10-06 §10.2.1):
the manager, one agent per domain, and ui; markers is templates/markers.yaml.
This mirrors config/manager; test/guards holds the two to each other
(TestInstallersRenderTheTopology, TestChartAndKustomizeAgreePerComponent).

The download engines (<downloadclient>-engine StatefulSets and Deployments)
and the transcode pool and graft Jobs are absent on purpose: the manager
creates those at runtime, owned by the object that asked for them.
*/}}
{{- $fullname := include "clustarr.fullname" . }}
{{- $dataClaim := default (printf "%s-data" $fullname) .Values.storage.data.existingClaim }}
{{- $facadeSecret := include "clustarr.facadeAPIKeySecret" . }}
{{- /* The fold's flags (loop spec §3.7, §3.17, §5.13) and the engines'
       default memory limits, as config/manager/manager.yaml passes them. */}}
{{- $managerArgs := list (printf "--slots=%s" .Values.manager.slots)
      (printf "--graft-concurrency=%d" (int .Values.manager.graftConcurrency))
      (printf "--engine-memory-limit-torrent=%s" .Values.manager.engineMemoryLimits.torrent)
      (printf "--engine-memory-limit-usenet=%s" .Values.manager.engineMemoryLimits.usenet)
      (printf "--remediation-concurrency=%d" (int .Values.manager.remediation.concurrency))
      (printf "--remediation-bulk-writes-per-second=%d" (int .Values.manager.remediation.bulkWritesPerSecond))
      (printf "--remediation-io-workers=%d" (int .Values.manager.remediation.ioWorkers)) }}
{{- /* Transcode admission yields intel to cluster-plex's video conversions. */}}
{{- with .Values.manager.videoTranscodeLease }}
{{- $managerArgs = append $managerArgs (printf "--video-transcode-lease=%s" .) }}
{{- end }}
{{- /* The facade's API-key Secret: the manager creates it when absent, the
       index agent only reads it, so both name the same one. */}}
{{- $managerEnv := list
      (dict "name" "CLUSTARR_NATIVE_IMAGE" "value" (include "clustarr.image" (dict "root" $ "which" "native")))
      (dict "name" "CLUSTARR_ENGINE_SERVICE_ACCOUNT" "value" (printf "%s-grab-engine" $fullname))
      (dict "name" "CLUSTARR_DATA_CLAIM" "value" $dataClaim)
      (dict "name" "CLUSTARR_FACADE_API_KEY_SECRET" "value" $facadeSecret) }}
{{- $managerPorts := include "clustarr.managerPorts" . | fromJsonArray }}
{{- if .Values.autoscaling.enabled }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_EXTERNAL_METRICS_SECRET" "value" (printf "%s-external-metrics-tls" $fullname)) }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_EXTERNAL_METRICS_SERVICE" "value" (printf "%s-external-metrics" $fullname)) }}
{{- else }}
{{- /* No HPA reconciler, External Metrics server or CA injection; the
       manager deletes the HPAs it labelled, once, at start (spec §9.4). */}}
{{- $managerArgs = append $managerArgs "--autoscale=false" }}
{{- end }}
{{- /* Live TV (spec 2026-10-07 §5.0): the tuner on livetv.port and the one
       livetv Service (templates/livetv-service.yaml), on which Plex is given
       each block's path (the direct-tuners design 2026-10-27). */}}
{{- if .Values.livetv.enabled }}
{{- $managerArgs = concat $managerArgs (list
      (printf "--livetv-bind-address=:%d" (int .Values.livetv.port))
      (printf "--livetv-service=%s-livetv" $fullname)) }}
{{- else }}
{{- $managerArgs = append $managerArgs "--livetv-bind-address=0" }}
{{- end }}
{{- /* The workers profile every pod the manager builds carries: the engines,
       the transcode pools and graft Jobs (control-plane placement design
       §5.6). */}}
{{- if .Values.placement.enabled }}
{{- $workers := .Values.placement.profiles.workers }}
{{- $managerArgs = append $managerArgs (printf "--worker-placement=%s" (toJson (dict "nodeAffinity" ($workers.nodeAffinity | default list) "tolerations" ($workers.tolerations | default list)))) }}
{{- end }}
{{- /* Memory (control-plane placement design §5.4.1): pprof to profile it,
       and the cache scoped to the release's namespace. */}}
{{- with .Values.manager.pprofBindAddress }}
{{- $managerArgs = append $managerArgs (printf "--pprof-bind-address=%s" .) }}
{{- end }}
{{- if .Values.manager.watchReleaseNamespace }}
{{- $managerArgs = append $managerArgs (printf "--watch-namespace=%s" .Release.Namespace) }}
{{- end }}
{{- /* Host-specific, so set only when given. */}}
{{- with .Values.manager.intelRenderGroups }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_INTEL_RENDER_GROUPS" "value" (join "," .)) }}
{{- end }}
{{- /* The binary's defaults match the NVIDIA GPU Operator and Intel NFD. */}}
{{- with .Values.manager.gpuNodeLabelNvidia }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_GPU_NODE_LABEL_NVIDIA" "value" .) }}
{{- end }}
{{- with .Values.manager.gpuNodeLabelIntel }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_GPU_NODE_LABEL_INTEL" "value" .) }}
{{- end }}
{{- /* --cardigann-bundled defaults on in the binary, so only "off" is
       rendered. The bundle loader is the manager's (R8, R9). */}}
{{- if not .Values.manager.cardigann.bundled }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_CARDIGANN_BUNDLED" "value" "false") }}
{{- end }}
{{- $managerVolumes := list }}
{{- $managerMounts := list }}
{{- /* A definitions directory replaces the embedded corpus entirely
       (--cardigann-definitions-dir); read-only. clustarr.validate refuses
       configMap and existingClaim together. */}}
{{- with .Values.manager.cardigann.definitions }}
{{- if or .configMap .existingClaim }}
{{- $dir := "/etc/clustarr/cardigann" }}
{{- $managerEnv = append $managerEnv (dict "name" "CLUSTARR_CARDIGANN_DEFINITIONS_DIR" "value" $dir) }}
{{- $mount := dict "name" "cardigann" "mountPath" $dir "readOnly" true }}
{{- with .subPath }}
{{- $_ := set $mount "subPath" . }}
{{- end }}
{{- $managerMounts = append $managerMounts $mount }}
{{- if .configMap }}
{{- $managerVolumes = append $managerVolumes (dict "name" "cardigann" "configMap" (dict "name" .configMap)) }}
{{- else }}
{{- $managerVolumes = append $managerVolumes (dict "name" "cardigann" "persistentVolumeClaim" (dict "claimName" .existingClaim "readOnly" true)) }}
{{- end }}
{{- end }}
{{- end }}
{{- include "clustarr.workload" (dict
      "root" $ "component" "manager" "values" .Values.manager
      "image" "clustarr" "command" "/usr/bin/manager" "args" $managerArgs
      "replicas" (include "clustarr.placementReplicas" (dict "root" $ "values" .Values.manager "component" "manager" "default" 1) | int)
      "leaderElect" true "natsSingleNodeFlag" true
      "data" true "index" false
      "strategy" (dict "type" "RollingUpdate" "rollingUpdate" (ternary (dict "maxSurge" 0 "maxUnavailable" 1) (dict "maxSurge" 1 "maxUnavailable" 0) (eq (include "clustarr.onePerNode" (dict "root" $ "values" .Values.manager)) "true")))
      "grace" 85 "gomemPercent" 80
      "extraPorts" $managerPorts "extraEnv" $managerEnv
      "extraVolumeMounts" $managerMounts "extraVolumes" $managerVolumes) }}
{{- /* Every agent: grace is the longest AckWait it drains plus 25 s
       (spec §3.5.6); NODE_NAME feeds its presence report. */}}
{{- with .Values.agents.catalog }}{{ if .enabled }}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-catalog" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=catalog")
      "replicas" .replicas "autoscaled" true "domain" "catalog" "nodeName" true
      "data" false "index" false "strategy" "" "grace" 145 "gomemPercent" 80) }}
{{- end }}{{ end }}
{{- with .Values.agents.events }}{{ if .enabled }}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-events" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=events")
      "replicas" .replicas "autoscaled" true "domain" "events" "nodeName" true
      "data" false "index" false "strategy" "" "grace" 55 "gomemPercent" 80) }}
{{- end }}{{ end }}
{{- with .Values.agents.metadata }}{{ if .enabled }}
{{- /* Exactly one, Recreate: in-process provider limiters (ADR-0007). */}}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-metadata" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=metadata")
      "replicas" 1 "nodeName" true "data" false "index" false
      "strategy" (dict "type" "Recreate") "grace" 85 "gomemPercent" 80) }}
{{- end }}{{ end }}
{{- with .Values.agents.import }}{{ if .enabled }}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-import" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=import")
      "replicas" .replicas "autoscaled" true "domain" "import" "nodeName" true
      "data" true "index" false "strategy" "" "grace" 85 "gomemPercent" 60) }}
{{- end }}{{ end }}
{{- with .Values.agents.index }}{{ if .enabled }}
{{- $indexEnv := list
      (dict "name" "CLUSTARR_INDEX_PATH" "value" "/var/lib/clustarr/index/releases.db")
      (dict "name" "CLUSTARR_FACADE_API_KEY_SECRET" "value" $facadeSecret) }}
{{- /* Postgres-backed release index (ADR-0010): CLUSTARR_INDEX_DSN points the
       agent at the CNPG Cluster's app Secret and no PVC is mounted;
       CLUSTARR_INDEX_PATH is then logged and ignored. */}}
{{- if $.Values.postgres.enabled }}
{{- $indexEnv = append $indexEnv (dict "name" "CLUSTARR_INDEX_DSN" "valueFrom" (dict "secretKeyRef" (dict
      "name" (default (printf "%s-postgres-app" $fullname) $.Values.postgres.existingSecret)
      "key" "uri"))) }}
{{- end }}
{{- /* Exactly one, Recreate under both engines: the RPC responders, the
       facade and the per-host limiter are one process (R4 amendment), and
       under SQLite the RWO PVC has one holder. */}}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-index" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=index")
      "replicas" 1 "nodeName" true "data" false "index" (not $.Values.postgres.enabled)
      "strategy" (dict "type" "Recreate") "grace" 85 "gomemPercent" 80
      "serviceType" .facade.service.type
      "extraPorts" (list (dict "name" "http" "containerPort" 8080))
      "extraServicePorts" (list (dict "name" "http" "port" .facade.service.port "targetPort" "http"))
      "extraEnv" $indexEnv) }}
{{- end }}{{ end }}
{{- with .Values.agents.caption }}{{ if .enabled }}
{{- include "clustarr.workload" (dict
      "root" $ "component" "agent-caption" "values" .
      "image" "native" "command" "/usr/bin/agent" "args" (list "--domain=caption")
      "replicas" .replicas "autoscaled" true "domain" "caption" "nodeName" true
      "data" true "index" false "strategy" "" "grace" 115 "gomemPercent" 60) }}
{{- end }}{{ end }}
{{- if .Values.ui.enabled }}
{{/* ui does not fit clustarr.workload: it runs no controller-runtime
     manager, so it has no --leader-elect/--nats-single-node and no
     separate metrics/health ports -- /healthz is served on the same port
     as everything else (design spec amendment §A3). It does take NATS_URL,
     from the same clustarr.natsUrl helper every other Deployment uses: it
     holds a read-only bus connection to serve /art and every Plex image
     from the clustarr-artwork object store (M7 design §B.8, ADR-0011).
     test/guards' TestEveryClustarrContainerCarriesNATSURL fails if it is
     dropped. */}}
{{- $name := printf "%s-%s" (include "clustarr.fullname" $) "ui" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
{{- with $.Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "clustarr.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.ui.service.port }}
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
{{- /* Whenever the ui may run more than one pod -- ui.autoscaling, or
       ui.replicas above 1 -- the pods spread one per node: a required
       anti-affinity on kubernetes.io/hostname over the ui's own pods, unless
       the placement profile already adds one (onePerNode). Every replica
       holds the same cache of the whole library, so two on one node buy
       nothing and lose the node's share of the availability. The rollout
       then surges one and takes one down at a time, since with every
       eligible node taken the surge pod has no node until an old pod frees
       one. With ui.autoscaling the HPA owns the count (no spec.replicas, so
       an upgrade never resets it). A single fixed replica takes no
       anti-affinity: on a one-node cluster its surge pod would never
       schedule. */}}
{{- $uiValues := .Values.ui }}
{{- $onePerNode := eq (include "clustarr.onePerNode" (dict "root" $ "values" .Values.ui)) "true" }}
{{- $spread := or .Values.ui.autoscaling.enabled (gt (int (.Values.ui.replicas | default 1)) 1) }}
{{- if and $spread (not $onePerNode) }}
{{- $uiValues = deepCopy .Values.ui }}
{{- $affinity := $uiValues.affinity | default dict }}
{{- $paa := $affinity.podAntiAffinity | default dict }}
{{- $sel := include "clustarr.selectorLabels" (dict "root" $ "component" "ui") | fromYaml }}
{{- $required := append ($paa.requiredDuringSchedulingIgnoredDuringExecution | default list) (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" $sel)) }}
{{- $_ := set $paa "requiredDuringSchedulingIgnoredDuringExecution" $required }}
{{- $_ := set $affinity "podAntiAffinity" $paa }}
{{- $_ := set $uiValues "affinity" $affinity }}
{{- end }}
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ include "clustarr.placementReplicas" (dict "root" $ "values" .Values.ui "component" "ui" "default" 1) }}
  {{- end }}
  {{- if $onePerNode }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- else if $spread }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "clustarr.selectorLabels" (dict "root" $ "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clustarr.labels" $ | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- omit $.Values.podSecurityContext "fsGroup" "fsGroupChangePolicy" | toYaml | nindent 8 }}
      containers:
      - name: ui
        image: {{ include "clustarr.image" (dict "root" $ "which" "clustarr") }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        command:
        - /usr/bin/ui
        {{- $uiArgs := list (printf "--auth-mode=%s" .Values.ui.auth.mode) (printf "--plex-provider=%t" .Values.ui.plex.enabled) (printf "--plex-guids=%t" .Values.ui.plex.plexGuids) (printf "--pipeline-history=%d" (int .Values.ui.pipelineHistory)) }}
        {{- with .Values.ui.plex.externalURL }}
        {{- $uiArgs = append $uiArgs (printf "--external-url=%s" .) }}
        {{- end }}
        {{- with .Values.ui.metrics.url }}
        {{- $uiArgs = append $uiArgs (printf "--metrics-url=%s" .) }}
        {{- end }}
        args:
          {{- toYaml $uiArgs | nindent 8 }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NATS_URL
          value: {{ include "clustarr.natsUrl" $ | quote }}
        # Signs the /art/search URLs the Plex provider hands Plex, which
        # stores them: the key outlives the pod and is shared by every
        # replica (templates/ui-art-signing-key.yaml).
        - name: CLUSTARR_ART_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "clustarr.fullname" $ }}-ui-art-signing-key
              key: key
        {{- with dig "resources" "limits" "memory" "" .Values.ui }}
        - name: GOMEMLIMIT
          value: {{ include "clustarr.gomemlimit" (list . 80) | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          # ui reads the cluster through an informer-backed cache
          # (ui.NewClusterReader); readiness gates on that cache's initial
          # sync rather than doubling up on /healthz.
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      {{- with (include "clustarr.placement" (dict "root" $ "values" $uiValues "component" "ui") | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
