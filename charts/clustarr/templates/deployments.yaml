{{- include "clustarr.validate" . -}}
{{/*
One Deployment per row of the process-topology table (design spec §3), each
with its own ServiceAccount and Service. This mirrors config/manager; the
kustomize tree is the reference and this is the parameterised form of it.

The engine workloads (<downloadclient>-engine StatefulSets and Deployments)
and the transcode batch/v1 Jobs are deliberately absent: those are created at
runtime by the grabarr and squasharr controllers and owned by the CR that
asked for them, so they can never be chart templates.
*/}}
{{- if .Values.catalogarr.enabled }}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "catalogarr"
      "values" .Values.catalogarr
      "image" "media"
      "args" (list "catalogarr" "--role" "controller,worker,history")
      "leaderElect" true
      "data" true
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false) }}
{{- end }}
{{- if .Values.catalogarrMetadata.enabled }}
{{/* Recreate: never two metadata gateways at once, not even mid-rollout. */}}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "catalogarr-metadata"
      "values" .Values.catalogarrMetadata
      "image" "media"
      "args" (list "catalogarr" "--role" "metadata")
      "data" false
      "index" false
      "strategy" "Recreate"
      "grace" 60
      "httpPort" false) }}
{{- end }}
{{- if .Values.importarr.enabled }}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "importarr"
      "values" .Values.importarr
      "image" "media"
      "args" (list "importarr" "--role" "controller")
      "leaderElect" true
      "data" false
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false) }}
{{- end }}
{{- if .Values.importarrWorker.enabled }}
{{/* Every replica needs a writable /data: a worker that cannot write the
     library must not accept work (amendment §A1.6). */}}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "importarr-worker"
      "values" .Values.importarrWorker
      "image" "media"
      "args" (list "importarr" "--role" "worker")
      "data" true
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false) }}
{{- end }}
{{- if .Values.indexarr.enabled }}
{{- $indexEnv := list
      (dict "name" "CLUSTARR_INDEX_PATH" "value" "/var/lib/clustarr/index/releases.db")
      (dict "name" "CLUSTARR_FACADE_API_KEY_SECRET" "value" (include "clustarr.facadeAPIKeySecret" $)) }}
{{- $indexVolumes := list }}
{{- $indexMounts := list }}
{{- /* Postgres-backed release index (design spec 2026-09-24 §A.3-A.4;
     ADR-0010): CLUSTARR_INDEX_DSN points indexarr at the CNPG Cluster's app
     Secret instead of the local SQLite file, and no PVC is mounted at all --
     the index lives in the Cluster templates/postgres-cluster.yaml renders.
     CLUSTARR_INDEX_PATH above is harmless: indexarr logs and ignores it once
     a DSN is set (spec §A.3). */}}
{{- if .Values.postgres.enabled }}
{{- $indexEnv = append $indexEnv (dict "name" "CLUSTARR_INDEX_DSN" "valueFrom" (dict "secretKeyRef" (dict
      "name" (default (printf "%s-postgres-app" (include "clustarr.fullname" $)) .Values.postgres.existingSecret)
      "key" "uri"))) }}
{{- end }}
{{- /* --cardigann-bundled defaults on in the binary, so only "off" is
     rendered: the default render stays byte-identical to config/manager. */}}
{{- if not .Values.indexarr.cardigann.bundled }}
{{- $indexEnv = append $indexEnv (dict "name" "CLUSTARR_CARDIGANN_BUNDLED" "value" "false") }}
{{- end }}
{{- /* A definitions directory replaces the embedded corpus entirely
     (--cardigann-definitions-dir). Read-only: indexarr only reads it, and
     the root filesystem is read-only anyway. clustarr.validate refuses
     configMap and existingClaim together. */}}
{{- with .Values.indexarr.cardigann.definitions }}
{{- if or .configMap .existingClaim }}
{{- $dir := "/etc/clustarr/cardigann" }}
{{- $indexEnv = append $indexEnv (dict "name" "CLUSTARR_CARDIGANN_DEFINITIONS_DIR" "value" $dir) }}
{{- $mount := dict "name" "cardigann" "mountPath" $dir "readOnly" true }}
{{- with .subPath }}
{{- $_ := set $mount "subPath" . }}
{{- end }}
{{- $indexMounts = append $indexMounts $mount }}
{{- if .configMap }}
{{- $indexVolumes = append $indexVolumes (dict "name" "cardigann" "configMap" (dict "name" .configMap)) }}
{{- else }}
{{- $indexVolumes = append $indexVolumes (dict "name" "cardigann" "persistentVolumeClaim" (dict "claimName" .existingClaim "readOnly" true)) }}
{{- end }}
{{- end }}
{{- end }}
{{/* Recreate + RWO index PVC under SQLite: one writer, one PVC holder. Under
     postgres.enabled there is no volume and no pinned strategy -- indexarr's
     leader election (keyed on CLUSTARR_INDEX_DSN, unconditional once it is
     set) makes indexarr.replicas > 1 safe there. */}}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "indexarr"
      "values" .Values.indexarr
      "image" "controller"
      "args" (list "indexarr" "--role" "all")
      "data" false
      "index" (not .Values.postgres.enabled)
      "strategy" (ternary "" "Recreate" .Values.postgres.enabled)
      "grace" 60
      "httpPort" true
      "extraEnv" $indexEnv
      "extraVolumeMounts" $indexMounts
      "extraVolumes" $indexVolumes) }}
{{- end }}
{{- if .Values.grabarr.enabled }}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "grabarr"
      "values" .Values.grabarr
      "image" "media"
      "args" (list "grabarr" "--role" "controller")
      "leaderElect" true
      "data" true
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false
      "extraEnv" (list
        (dict "name" "CLUSTARR_ENGINE_IMAGE" "value" (include "clustarr.image" (dict "root" $ "which" "media")))
        (dict "name" "CLUSTARR_ENGINE_SERVICE_ACCOUNT" "value" (printf "%s-grabarr-engine" (include "clustarr.fullname" $)))
        (dict "name" "CLUSTARR_DATA_CLAIM" "value" (default (printf "%s-data" (include "clustarr.fullname" $)) $.Values.storage.data.existingClaim)))) }}
{{- end }}
{{- if .Values.squasharr.enabled }}
{{- $squashEnv := list
      (dict "name" "CLUSTARR_WORKER_IMAGE" "value" (include "clustarr.image" (dict "root" $ "which" "transcoder")))
      (dict "name" "CLUSTARR_WORKER_IMAGE_CUDA" "value" (include "clustarr.image" (dict "root" $ "which" "transcoderCuda")))
      (dict "name" "CLUSTARR_DATA_CLAIM" "value" (default (printf "%s-data" (include "clustarr.fullname" $)) $.Values.storage.data.existingClaim)) }}
{{- /* --intel-render-groups: host-specific, so set only when given. */}}
{{- with .Values.squasharr.intelRenderGroups }}
{{- $squashEnv = append $squashEnv (dict "name" "CLUSTARR_INTEL_RENDER_GROUPS" "value" (join "," .)) }}
{{- end }}
{{- /* GPU node labels: the binary's own defaults already match the NVIDIA
       GPU Operator and Intel's Node Feature Discovery, so set only when
       overridden. */}}
{{- with .Values.squasharr.gpuNodeLabelNvidia }}
{{- $squashEnv = append $squashEnv (dict "name" "CLUSTARR_GPU_NODE_LABEL_NVIDIA" "value" .) }}
{{- end }}
{{- with .Values.squasharr.gpuNodeLabelIntel }}
{{- $squashEnv = append $squashEnv (dict "name" "CLUSTARR_GPU_NODE_LABEL_INTEL" "value" .) }}
{{- end }}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "squasharr"
      "values" .Values.squasharr
      "image" "media"
      "args" (list "squasharr" "--role" "controller" "--slots" .Values.squasharr.slots)
      "leaderElect" true
      "data" true
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false
      "extraEnv" $squashEnv) }}
{{- end }}
{{- if .Values.captionarr.enabled }}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "captionarr"
      "values" .Values.captionarr
      "image" "media"
      "args" (list "captionarr" "--role" "controller")
      "leaderElect" true
      "data" true
      "index" false
      "strategy" ""
      "grace" 60
      "httpPort" false) }}
{{- end }}
{{- if .Values.captionarrWorker.enabled }}
{{/* grace = the consumer AckWait: workers drain their in-flight fetch on
     SIGTERM rather than letting it be redelivered to a dying pod (§12). */}}
{{- include "clustarr.workload" (dict
      "root" $
      "component" "captionarr-worker"
      "values" .Values.captionarrWorker
      "image" "media"
      "args" (list "captionarr" "--role" "worker")
      "data" true
      "index" false
      "strategy" ""
      "grace" .Values.captionarrWorker.ackWaitSeconds
      "httpPort" false) }}
{{- end }}
{{- if .Values.ui.enabled }}
{{/* ui does not fit clustarr.workload: it runs no controller-runtime
     manager, so it has no NATS_URL, no --leader-elect/--nats-single-node,
     and no separate metrics/health ports -- /healthz is served on the same
     port as everything else (design spec amendment §A3). */}}
{{- $name := printf "%s-%s" (include "clustarr.fullname" $) "ui" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
{{- with $.Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "clustarr.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.ui.service.port }}
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "clustarr.selectorLabels" (dict "root" $ "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clustarr.labels" $ | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- omit $.Values.podSecurityContext "fsGroup" "fsGroupChangePolicy" | toYaml | nindent 8 }}
      containers:
      - name: ui
        image: {{ include "clustarr.image" (dict "root" $ "which" "controller") }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        args: ["ui", {{ printf "--auth-mode=%s" .Values.ui.auth.mode | quote }}]
        {{- with dig "resources" "limits" "memory" "" .Values.ui }}
        env:
        - name: GOMEMLIMIT
          value: {{ include "clustarr.gomemlimit" . | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          # ui reads the cluster through an informer-backed cache
          # (ui.NewClusterReader); readiness gates on that cache's initial
          # sync rather than doubling up on /healthz.
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
