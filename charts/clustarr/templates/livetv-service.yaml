{{- if .Values.livetv.enabled }}
{{- /* The one livetv Service (Live TV spec 2026-10-07 §5.0): every
       IPTVProvider's status.address, where cluster-plex's per-block proxies
       send. ClusterIP only, and no Ingress: the tuner has no authentication
       (§5.3). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clustarr.fullname" . }}-livetv
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: livetv
spec:
  type: ClusterIP
  selector:
    {{- include "clustarr.selectorLabels" (dict "root" . "component" "manager") | nindent 4 }}
  ports:
  - name: http
    port: 80
    targetPort: livetv
    protocol: TCP
{{- end }}
