{{/*
A Gateway API HTTPRoute to the ui's Service, with ui.httpRoute.enabled: every
hostname named, every path, to the Service's port. The ui has no login of its
own (ui.auth) and the Plex provider under /plex none by protocol, so the
listener this attaches to must be behind authentication, or internal (the
chart README, "Web UI"). parentRefs are rendered as given.
*/}}
{{- if and .Values.ui.enabled .Values.ui.httpRoute.enabled }}
{{- $name := printf "%s-ui" (include "clustarr.fullname" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ui.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.ui.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.ui.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $name }}
      port: {{ .Values.ui.service.port }}
{{- end }}
