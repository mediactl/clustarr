{{/*
RBAC for every Clustarr identity: one ClusterRole per identity (spec
2026-10-06 §10.2.4) -- the manager, each agent domain and the engine pods --
bound to that identity's ServiceAccount only. Every agent role and the engine
role hold get, list and watch only (secrets get only); the manager's alone
writes (ADR-0019).

Each generated ClusterRole's rules below are a VERBATIM copy of the `rules:`
list in config/rbac/<role>_role.yaml, which `make manifests` generates from
exactly that identity's +kubebuilder:rbac markers (RBAC_ROLES and
RBAC_PATHS_* in the Makefile). Helm cannot read a file outside its own chart
directory, so a copy is unavoidable; what closes the loop is
test/guards.TestChartRBACMatchesTheGeneratedRoles, which fails the build the
moment any copy disagrees with its file. Regenerate with `make manifests`,
then paste each file's rules between its BEGIN/END markers -- do not
hand-edit them.
*/}}
