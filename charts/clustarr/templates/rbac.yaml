---
{{/* The engine pods' identity. Every StatefulSet/Deployment the manager's
     DownloadClient controller creates runs its pod as this ServiceAccount
     (the manager's --engine-service-account, $CLUSTARR_ENGINE_SERVICE_ACCOUNT
     in deployments.yaml). Its ClusterRole is generated from app/grab/engine's
     markers alone. The manager is always rendered, so these are too. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-grab-engine
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: grab-engine
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-grab-engine
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: grab-engine
rules:
# BEGIN generated from config/rbac/grab_engine_role.yaml -- do not edit by hand.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - download.clustarr.io
  resources:
  - downloadclients
  verbs:
  - get
  - list
  - watch
# END generated from config/rbac/grab_engine_role.yaml.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-grab-engine
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: grab-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-grab-engine
subjects:
- kind: ServiceAccount
  name: {{ $fullname }}-grab-engine
  namespace: {{ .Release.Namespace }}
{{- if .Values.ui.enabled }}
---
{{/* ui's ClusterRole is hand-written and stays hand-written (design plan
     ruling R3): get/list/watch over the catalog, download, index, transcode
     and subtitle groups, plus exactly the writes ui/actions' actions make
     (Phase G ruling R2) -- create on searches, libraryscans and the four Add
     New kinds (movies, series, artists, authors), patch on searches
     (an interactive search's grab), patch on the
     ten catalog kinds with a spec.monitored, and patch on the eight
     Settings-page kinds (Task G3-4) -- and no update, no delete and no
     resource whose name ends in "status" anywhere in it. This is a
     byte-for-byte copy of config/rbac/ui_role.yaml's rules -- see the note
     at the top of that file for why it is hand-written. */}}
