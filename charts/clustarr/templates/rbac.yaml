{{/*
RBAC for every Clustarr identity: one ClusterRole per service (design §10),
bound to that service's ServiceAccounts only.

Each generated ClusterRole's rules below are a VERBATIM copy of the `rules:`
list in config/rbac/<role>_role.yaml, which `make manifests` generates from
exactly that identity's +kubebuilder:rbac markers (RBAC_ROLES and
RBAC_PATHS_* in the Makefile). Helm cannot read a file outside its own chart
directory, so a copy is unavoidable; what closes the loop is
cmd/clustarr.TestChartRBACMatchesTheGeneratedRoles, which fails the build the
moment any copy disagrees with its file. Regenerate with `make manifests`,
then paste each file's rules between its BEGIN/END markers -- do not
hand-edit them.

Until task X14 there was one union manager ClusterRole, bound to every
service, so each held every other service's grants. It also carried a
chart-only customresourcedefinitions read that nothing in the tree used and
config/ never granted; it went with it.
*/}}
{{- $components := list }}
{{- if .Values.catalogarr.enabled }}{{ $components = append $components "catalogarr" }}{{ end }}
{{- if .Values.catalogarrMetadata.enabled }}{{ $components = append $components "catalogarr-metadata" }}{{ end }}
{{- if .Values.importarr.enabled }}{{ $components = append $components "importarr" }}{{ end }}
{{- if .Values.importarrWorker.enabled }}{{ $components = append $components "importarr-worker" }}{{ end }}
{{- if .Values.indexarr.enabled }}{{ $components = append $components "indexarr" }}{{ end }}
{{- if .Values.grabarr.enabled }}{{ $components = append $components "grabarr" }}{{ end }}
{{- if .Values.squasharr.enabled }}{{ $components = append $components "squasharr" }}{{ end }}
{{- if .Values.captionarr.enabled }}{{ $components = append $components "captionarr" }}{{ end }}
{{- if .Values.captionarrWorker.enabled }}{{ $components = append $components "captionarr-worker" }}{{ end }}
{{/* ui is deliberately absent from $components: it has no
     controller-runtime manager and never leader-elects, so it needs no
     entry in the ClusterRoleBinding loop below and no leader-election
     RoleBinding. It gets its own, narrower ClusterRole and
     ClusterRoleBinding -- see the .Values.ui.enabled block below. */}}
{{/* The service whose generated role each component runs under: a
     service's second Deployment runs the same packages in another role. */}}
{{- $roleOf := dict
      "catalogarr" "catalogarr" "catalogarr-metadata" "catalogarr"
      "importarr" "importarr" "importarr-worker" "importarr"
      "indexarr" "indexarr"
      "grabarr" "grabarr"
      "squasharr" "squasharr"
      "captionarr" "captionarr" "captionarr-worker" "captionarr" }}
{{- $roles := dict }}
{{- range $components }}{{ $_ := set $roles (get $roleOf .) true }}{{ end }}
