{{/*
RBAC for every Clustarr manager.

The manager ClusterRole's rules below are a VERBATIM copy of the `rules:` list
in config/rbac/role.yaml, which `make manifests` generates from the
+kubebuilder:rbac markers. Helm cannot read a file outside its own chart
directory, so the chart cannot template it from that file at render time and a
copy is unavoidable; what closes the loop is
cmd/clustarr.TestChartRBACMatchesTheGeneratedRole, which fails the build the
moment the two disagree. Regenerate with `make manifests`, then paste the new
rules between the BEGIN/END markers -- do not hand-edit them.

The rules AFTER the END marker are the ones controller-gen cannot emit,
because no Go marker describes them.
*/}}
{{- $components := list }}
{{- if .Values.catalogarr.enabled }}{{ $components = append $components "catalogarr" }}{{ end }}
{{- if .Values.catalogarrMetadata.enabled }}{{ $components = append $components "catalogarr-metadata" }}{{ end }}
{{- if .Values.importarr.enabled }}{{ $components = append $components "importarr" }}{{ end }}
{{- if .Values.importarrWorker.enabled }}{{ $components = append $components "importarr-worker" }}{{ end }}
{{- if .Values.indexarr.enabled }}{{ $components = append $components "indexarr" }}{{ end }}
{{- if .Values.grabarr.enabled }}{{ $components = append $components "grabarr" }}{{ end }}
{{- if .Values.squasharr.enabled }}{{ $components = append $components "squasharr" }}{{ end }}
{{- if .Values.captionarr.enabled }}{{ $components = append $components "captionarr" }}{{ end }}
{{- if .Values.captionarrWorker.enabled }}{{ $components = append $components "captionarr-worker" }}{{ end }}
{{/* ui is deliberately absent: it has no controller-runtime manager, reads
     no cluster state yet, and so needs no ClusterRole/RoleBinding. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clustarr.fullname" . }}-manager
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
rules:
# BEGIN generated from config/rbac/role.yaml -- do not edit by hand.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - delayprofiles
  - metadataproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - delayprofiles/status
  - episodes/status
  - importexclusions/status
  - libraryscans/status
  - mediafiles/status
  - metadataproviders/status
  - movies/status
  - qualityprofiles/status
  - rootfolders/status
  - searches/status
  - series/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - catalog.clustarr.io
  resources:
  - episodes
  - mediafiles
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - episodes/finalizers
  - importexclusions/finalizers
  - movies/finalizers
  - series/finalizers
  verbs:
  - update
- apiGroups:
  - catalog.clustarr.io
  resources:
  - importexclusions
  - rootfolders
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - libraryscans
  - movies
  - searches
  - series
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - qualityprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - download.clustarr.io
  resources:
  - downloadclients
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - download.clustarr.io
  resources:
  - downloads
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - index.clustarr.io
  resources:
  - indexerdefinitions
  - indexerproxies
  - indexers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - index.clustarr.io
  resources:
  - indexerdefinitions/status
  - indexerproxies/status
  - indexers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - subtitle.clustarr.io
  resources:
  - subtitlerequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - transcode.clustarr.io
  resources:
  - transcodejobs
  - transcodeprofiles
  verbs:
  - get
  - list
  - watch
# END generated from config/rbac/role.yaml.
#
# Chart-only rules: controller-gen emits no marker for these.
# The CRD read is what lets a manager discover its own kinds and what
# pkg/crdcheck-style startup validation reads.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
{{/* Leader election: LeaderElectionID is <service>.clustarr.io (§2), so one
     namespaced Role covers every manager. Hand-written; controller-gen does
     not emit these. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "clustarr.fullname" . }}-leader-election
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- range $components }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clustarr.fullname" $ }}-{{ . }}-manager
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clustarr.fullname" $ }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clustarr.fullname" $ }}-{{ . }}-leader-election
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clustarr.fullname" $ }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
