apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clustarr.fullname" $ }}-{{ get $roleOf . }}
subjects:
- kind: ServiceAccount
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clustarr.fullname" $ }}-{{ . }}-leader-election
  labels:
    {{- include "clustarr.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clustarr.fullname" $ }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "clustarr.fullname" $ }}-{{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
