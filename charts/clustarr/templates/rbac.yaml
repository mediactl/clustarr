{{- $components := list "manager" }}
{{- range $d := list "catalog" "events" "metadata" "import" "index" "caption" }}
{{- if (index $.Values.agents $d).enabled }}{{ $components = append $components (printf "agent-%s" $d) }}{{ end }}
{{- end }}
{{/* Each component is its own identity: ServiceAccount, ClusterRole and
     binding share its name. markers is absent (no token, nothing bound,
     templates/markers.yaml); ui has its own role below. */}}
