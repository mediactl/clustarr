{{/*
Plex's library database (cluster-plex's shim), a CloudNativePG Cluster. Rendered
when cluster-plex.enabled. Named after the release, not clustarr.fullname: the
cluster-plex subchart's values reach it as "{{ .Release.Name }}-plex-db-rw" and
"{{ .Release.Name }}-plex-db-app", and a subchart's templates see only .Release.

Kept on uninstall, like the release index's Cluster (postgres-cluster.yaml) and
/data: it is the whole Plex library. A normal resource, never a hook (CLAUDE.md,
the Helm hook gotcha). CNPG's bootstrap.initdb creates database and owner
"plex" and Secret <name>-app, whose key "password" the subchart reads; the shim
creates its schema on first start.
*/}}
{{- if index .Values "cluster-plex" "enabled" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-plex-db
  labels:
    {{- include "clustarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: plex-db
  annotations:
    helm.sh/resource-policy: keep
{{- $sizing := dict "placement" .Values.plexDatabase.placement }}
{{- if hasKey .Values.plexDatabase "instances" }}{{ $_ := set $sizing "replicas" .Values.plexDatabase.instances }}{{ end }}
{{- $instances := include "clustarr.placementReplicas" (dict "root" $ "values" $sizing "component" "plexDatabase" "default" 1) | int }}
{{- /* Replication settings once there is more than one instance
       (control-plane placement design §5.1). */}}
{{- $replicated := gt $instances 1 }}
{{- $parameters := deepCopy (.Values.plexDatabase.parameters | default dict) }}
{{- if and $replicated .Values.plexDatabase.maxSlotWalKeepSize (not (hasKey $parameters "max_slot_wal_keep_size")) }}
{{- $_ := set $parameters "max_slot_wal_keep_size" .Values.plexDatabase.maxSlotWalKeepSize }}
{{- end }}
spec:
  instances: {{ $instances }}
  imageName: {{ .Values.plexDatabase.imageName }}
  {{- if $replicated }}
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: {{ .Values.plexDatabase.primaryUpdateMethod | default "switchover" }}
  {{- end }}
  {{- with (include "clustarr.cnpgAffinity" (dict "root" $ "values" .Values.plexDatabase) | trim) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if or $parameters (and $replicated .Values.plexDatabase.synchronous) }}
  postgresql:
    {{- if and $replicated .Values.plexDatabase.synchronous }}
    synchronous:
      {{- toYaml .Values.plexDatabase.synchronous | nindent 6 }}
    {{- end }}
    {{- with $parameters }}
    parameters:
      {{- range $k, $v := . }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.plexDatabase.storage.size | quote }}
    {{- with .Values.plexDatabase.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: plex
      owner: plex
{{- end }}
