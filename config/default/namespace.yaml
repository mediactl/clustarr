apiVersion: v1
kind: Namespace
metadata:
  name: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    # Every Clustarr pod is runAsNonRoot with a dropped capability set and a
    # RuntimeDefault seccomp profile, so the namespace can run at `restricted`.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
