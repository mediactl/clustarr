# kustomize build config/samples | kubectl apply --server-side -f -
# Ordered as README.md asks: references before the kinds that resolve them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - catalog_v1alpha1_overlayprofile.yaml
  # Plex collections, reconciled by cluster-plex (plex.clustarr.enabled).
  - catalog_v1alpha1_plexcollection_anime_dubbed.yaml
  - catalog_v1alpha1_plexcollection_netflix.yaml
  - catalog_v1alpha1_plexcollection_up.yaml
