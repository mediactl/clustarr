# Every Clustarr CustomResourceDefinition, one file per Kind, regenerated by
# `make manifests` (controller-gen crd -> config/crd/bases). Applied with
# `make install`, and included by config/default.
#
# Keep this list in sync when a Kind is added or removed: controller-gen
# writes the YAML under bases/ but does not touch this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr

resources:
# catalog.clustarr.io
- bases/catalog.clustarr.io_albums.yaml
- bases/catalog.clustarr.io_artists.yaml
- bases/catalog.clustarr.io_audiobooks.yaml
- bases/catalog.clustarr.io_authors.yaml
- bases/catalog.clustarr.io_books.yaml
- bases/catalog.clustarr.io_comics.yaml
- bases/catalog.clustarr.io_delayprofiles.yaml
- bases/catalog.clustarr.io_episodes.yaml
- bases/catalog.clustarr.io_importexclusions.yaml
- bases/catalog.clustarr.io_importlists.yaml
- bases/catalog.clustarr.io_issues.yaml
- bases/catalog.clustarr.io_mediafiles.yaml
- bases/catalog.clustarr.io_metadataproviders.yaml
- bases/catalog.clustarr.io_movies.yaml
- bases/catalog.clustarr.io_qualityprofiles.yaml
- bases/catalog.clustarr.io_rootfolders.yaml
- bases/catalog.clustarr.io_searches.yaml
- bases/catalog.clustarr.io_series.yaml

# download.clustarr.io
- bases/download.clustarr.io_downloadclients.yaml
- bases/download.clustarr.io_downloads.yaml

# index.clustarr.io
- bases/index.clustarr.io_indexerdefinitions.yaml
- bases/index.clustarr.io_indexerproxies.yaml
- bases/index.clustarr.io_indexers.yaml

# subtitle.clustarr.io
- bases/subtitle.clustarr.io_subtitleprofiles.yaml
- bases/subtitle.clustarr.io_subtitleproviders.yaml
- bases/subtitle.clustarr.io_subtitlerequests.yaml

# transcode.clustarr.io
- bases/transcode.clustarr.io_transcodejobs.yaml
- bases/transcode.clustarr.io_transcodeprofiles.yaml

