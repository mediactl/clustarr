---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mediafiles.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    kind: MediaFile
    listKind: MediaFileList
    plural: mediafiles
    shortNames:
    - mf
    singular: mediafile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mediaRef.name
      name: Media
      type: string
    - jsonPath: .spec.mediaRef.kind
      name: Kind
      type: string
    - jsonPath: .spec.quality.name
      name: Quality
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.transcode.phase
      name: Transcode
      type: string
    - jsonPath: .status.subtitles.phase
      name: Subtitles
      type: string
    - jsonPath: .status.graft.phase
      name: Graft
      priority: 1
      type: string
    - jsonPath: .status.transcode.class
      name: Class
      priority: 1
      type: string
    - jsonPath: .status.transcode.workerPod
      name: Worker
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Probed")].status
      name: Probed
      priority: 1
      type: string
    - jsonPath: .spec.formatScore
      name: Score
      priority: 1
      type: integer
    - jsonPath: .spec.sizeBytes
      name: Size
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MediaFile is one file on disk backing a catalog item. It is the pivot every
          other service hangs off: downloadarr creates it at import, transcodarr and
          subtitlarr read its probe and write back through status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MediaFileSpec defines the desired state of MediaFile.

              MediaFile is the one exception to the single-writer rule, and the split is
              spec versus status: importarr creates the resource and owns this spec --
              the observed path, size and fingerprint, plus the quality, revision,
              formatScore, matchedFormats and releaseType frozen at import -- while
              catalogarr owns all of MediaFileStatus, plus metadata.labels, and takes
              over sizeBytes, modTime and original once it incorporates a transcode
              swap -- and path as well when the transcode landed under a new name and
              the source is gone (a container change or an explicit outputPath). Both
              write under their own field manager, so the apiserver enforces the split
              rather than convention.
            properties:
              edition:
                description: Edition is the edition parsed from the source release.
                maxLength: 256
                type: string
              formatScore:
                description: FormatScore is the custom-format score of the source
                  release at import.
                format: int32
                type: integer
              importedFrom:
                description: ImportedFrom records where the file came from.
                properties:
                  downloadRef:
                    description: DownloadRef is the name of the Download the file
                      was imported from.
                    maxLength: 253
                    type: string
                  importedAt:
                    description: ImportedAt is when the file was imported.
                    format: date-time
                    type: string
                  indexerName:
                    description: IndexerName is the display name of the indexer the
                      release came from.
                    maxLength: 253
                    type: string
                  infoHash:
                    description: |-
                      InfoHash is the release's info hash, frozen at import; the search's
                      current-file check reads it instead of the Download downloadRef named
                      (ADR-0019 §6.2). Release N backfills it from live Downloads (§10.2).
                    maxLength: 64
                    type: string
                  manual:
                    description: Manual is true when a user imported the file by hand.
                    type: boolean
                  protocol:
                    description: Protocol is the transfer protocol the release was
                      fetched over.
                    enum:
                    - torrent
                    - usenet
                    type: string
                  releaseTitle:
                    description: ReleaseTitle is the raw title of the release the
                      file came from.
                    maxLength: 512
                    type: string
                type: object
              languages:
                description: Languages lists the languages parsed from the source
                  release.
                items:
                  maxLength: 35
                  type: string
                maxItems: 64
                type: array
              matchedFormats:
                description: MatchedFormats lists the custom-format slugs that matched
                  at import.
                items:
                  maxLength: 128
                  type: string
                maxItems: 200
                type: array
              mediaRef:
                description: MediaRef points at the catalog item this file backs.
                properties:
                  keys:
                    description: Keys lists the Episode or Issue names covered by
                      a pack release.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 200
                    type: array
                  kind:
                    description: Kind is the media kind of the referenced object.
                    enum:
                    - movie
                    - series
                    - episode
                    - artist
                    - album
                    - author
                    - book
                    - audiobook
                    - comic
                    - issue
                    type: string
                  name:
                    description: |-
                      Name is the name of the referenced object; it lives in the same
                      namespace as the object holding the reference.
                    maxLength: 253
                    type: string
                  track:
                    description: |-
                      Track narrows an album reference to one Track of that Album: the
                      MusicBrainz recording MBID that keys the Album's status.tracks. A
                      MediaFile holding a single track sets it, so the Album can attribute
                      the file to that Track (status.tracks[].fileRef) rather than only to
                      the Album as a whole. Valid only with kind album.
                    maxLength: 36
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: mediaRef is immutable
                  rule: self == oldSelf
                - message: track addresses a Track within an Album, so it needs kind
                    album
                  rule: '!has(self.track) || self.kind == ''album'''
              modTime:
                description: ModTime is the file's modification time.
                format: date-time
                type: string
              original:
                default: true
                description: |-
                  Original is true while this is the file as imported; it goes false once a
                  transcode replaces it.
                type: boolean
              path:
                description: |-
                  Path is the file's absolute path. importarr sets it at import; it
                  changes only when catalogarr swaps in a transcode written under a new
                  name, and catalogarr then owns it.
                maxLength: 4096
                type: string
              profileHash:
                description: ProfileHash is the QualityProfile status.hash the file
                  was scored against.
                maxLength: 64
                type: string
              quality:
                description: Quality is the quality frozen at import; transcoding
                  never rewrites it.
                properties:
                  modifier:
                    description: Modifier refines the quality (remux, screener, ...).
                    enum:
                    - none
                    - regional
                    - screener
                    - rawhd
                    - brdisk
                    - remux
                    type: string
                  name:
                    description: Name is the canonical quality definition name.
                    maxLength: 64
                    type: string
                  resolution:
                    description: Resolution is the vertical resolution in lines. Video
                      only.
                    enum:
                    - 0
                    - 360
                    - 480
                    - 540
                    - 576
                    - 720
                    - 1080
                    - 2160
                    format: int32
                    type: integer
                  source:
                    description: Source is the release source. Video only.
                    enum:
                    - unknown
                    - cam
                    - telesync
                    - telecine
                    - workprint
                    - dvd
                    - tv
                    - webdl
                    - webrip
                    - bluray
                    type: string
                required:
                - name
                type: object
              releaseGroup:
                description: ReleaseGroup is the release group parsed from the source
                  release.
                maxLength: 256
                type: string
              releaseType:
                description: ReleaseType classifies how many catalog items the source
                  release covered.
                enum:
                - single
                - multi
                - seasonPack
                - album
                - book
                - issue
                type: string
              revision:
                description: Revision is the proper/repack revision frozen at import.
                properties:
                  real:
                    default: 0
                    description: Real counts REAL re-releases that fix a broken proper.
                    format: int32
                    type: integer
                  repack:
                    default: false
                    description: Repack is true when the release is flagged as a repack.
                    type: boolean
                  version:
                    default: 1
                    description: |-
                      Version is the release version; 1 is the original, 2+ are propers.
                      It has no omitempty, so a Go client always sends it and the default
                      never applies; 0 has no meaning, and every comparison (pkg/quality,
                      pkg/decision) floors it to 1, so an unparsed revision reads as the
                      original rather than as older than one.
                    format: int32
                    type: integer
                type: object
              sizeBytes:
                description: SizeBytes is the file size in bytes.
                format: int64
                minimum: 0
                type: integer
            required:
            - mediaRef
            - path
            type: object
          status:
            description: |-
              MediaFileStatus is written by one remediation loop in the manager, under
              field manager catalogarr (ADR-0016). Until F3.1 the MediaFile reconciler
              still writes it through knownStatus.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the file's
                  state: a set closed at ten types (loop spec §2.8).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 12
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              graft:
                description: |-
                  Graft is the remediation loop's graft block (loop spec §2.6); it
                  replaces AudioGraft's per-file half.
                properties:
                  completedAt:
                    format: date-time
                    type: string
                  coveragePercent:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  dispatch:
                    description: |-
                      Dispatch fences one remediation's task and the record that answers it
                      (loop spec §2.3). A dispatch takes seq = records.NextSeq(record.Seq,
                      status.lastSeq, now), and the apply that moves its block in flight writes
                      status.lastSeq = seq beside it; records are also matched by their inputs.
                    properties:
                      answeredSeq:
                        description: |-
                          AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                          answer, a withdrawal or a timeout. A task is in flight while
                          Seq > AnsweredSeq.
                        format: int64
                        minimum: 0
                        type: integer
                      delivery:
                        description: |-
                          Delivery is what the manager knows about the task between publish
                          and answer. Written on transitions only (ADR-0019 §8.3), never per
                          nak.
                        properties:
                          attempts:
                            description: Attempts is the deliveries count of the last
                              nak the manager recorded.
                            format: int32
                            type: integer
                          deadLetteredAt:
                            format: date-time
                            type: string
                          lastNakAt:
                            format: date-time
                            type: string
                          message:
                            maxLength: 256
                            type: string
                          reason:
                            description: |-
                              Reason when waiting or retrying: Budget, Paced, NoAgent,
                              NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                            maxLength: 64
                            type: string
                          state:
                            description: |-
                              DeliveryPhase is where a dispatched task is between its publish and its
                              answer (ADR-0019 §8.3).
                            enum:
                            - waiting
                            - published
                            - claimed
                            - retrying
                            - deadLettered
                            type: string
                        required:
                        - state
                        type: object
                      destination:
                        description: |-
                          Destination is the durable, pool or engine instance the task went to
                          (ADR-0019 §8.3).
                        maxLength: 253
                        type: string
                      dispatchedAt:
                        description: |-
                          DispatchedAt is when Seq was issued; the republish window and the
                          request timeout run from it.
                        format: date-time
                        type: string
                      seq:
                        description: Seq is the sequence of the last task issued for
                          this remediation.
                        format: int64
                        minimum: 1
                        type: integer
                      withdrawn:
                        description: |-
                          Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                          not by an answer. For transcode and graft a fact (a change already
                          made on disk) can still land after that: the planner keeps reading
                          the record while Withdrawn is true and now < DispatchedAt +
                          records.FactWindow, and incorporates a fact at Seq whatever the phase
                          (§4.10, §5.9). Incorporating it clears Withdrawn.
                        type: boolean
                    required:
                    - dispatchedAt
                    - seq
                    type: object
                  donorFault:
                    description: |-
                      DonorFault marks a failure that rejects the donor's release
                      (AlignmentRejected, VerifyFailed, MuxFailed, DonorLacksLanguage).
                    type: boolean
                  donorImportedAt:
                    format: date-time
                    type: string
                  donorRelease:
                    description: |-
                      DonorRelease and DonorImportedAt identify the item's donor this graft
                      is for (status.audio.donor); a Failed graft is retried only for another
                      donor or another ProbeHash.
                    maxLength: 512
                    type: string
                  jobName:
                    description: JobName is the standalone graft Job of the in-flight
                      dispatch.
                    maxLength: 253
                    type: string
                  joinedTranscodeSeq:
                    description: JoinedTranscodeSeq is the transcode dispatch this
                      graft rides.
                    format: int64
                    minimum: 0
                    type: integer
                  languages:
                    items:
                      maxLength: 35
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: atomic
                  message:
                    maxLength: 1024
                    type: string
                  phase:
                    description: GraftPhase is status.graft's phase (loop spec §2.6).
                    enum:
                    - Waiting
                    - Queued
                    - Running
                    - Swapping
                    - Succeeded
                    - Failed
                    type: string
                  probeHash:
                    maxLength: 128
                    type: string
                  rateMarginMilli:
                    format: int32
                    minimum: 0
                    type: integer
                  rateMicros:
                    format: int64
                    minimum: 0
                    type: integer
                  rateName:
                    maxLength: 32
                    type: string
                  reason:
                    description: |-
                      Reason: Waiting -- FileUnprobed, TranscodeRunning, WaitingForTranscode,
                      WaitingForSlot, Backoff; Running -- JoinedTranscode; Succeeded --
                      Grafted, Present; Failed -- the grafttask reasons and JobLost.
                    maxLength: 64
                    type: string
                  residualMillis:
                    format: int32
                    type: integer
                  segments:
                    items:
                      description: |-
                        GraftSegment is one aligned span: the donor's start, the target's start
                        and its length, in milliseconds.
                      properties:
                        donorStartMillis:
                          format: int64
                          type: integer
                        lengthMillis:
                          format: int64
                          type: integer
                        targetStartMillis:
                          format: int64
                          type: integer
                      required:
                      - donorStartMillis
                      - lengthMillis
                      - targetStartMillis
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  startedAt:
                    format: date-time
                    type: string
                  tag:
                    description: |-
                      Tag is the CLUSTARR_GRAFT tag the worker wrote; status.graftTag takes
                      it when the grafted bytes' probe is incorporated.
                    maxLength: 64
                    type: string
                  within80Percent:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - phase
                type: object
              graftTag:
                description: |-
                  GraftTag is the CLUSTARR_GRAFT tag of the last audio graft catalogarr
                  incorporated into this file (anime dual-audio spec §7.2), and
                  GraftedAt when. A graft is not a transcode: spec.original stays as it
                  was, but from the first graft catalogarr owns spec.path, sizeBytes and
                  modTime, as after a transcode swap.
                maxLength: 64
                type: string
              graftedAt:
                format: date-time
                type: string
              handledNonces:
                description: |-
                  HandledNonces records the last one-shot intent nonce handled for each
                  one-shot intent annotation (loop spec §2.9).
                properties:
                  subtitleSearch:
                    maxLength: 63
                    type: string
                  transcodeCancel:
                    maxLength: 63
                    type: string
                  transcodeRetry:
                    maxLength: 63
                    type: string
                type: object
              lastSeq:
                description: |-
                  LastSeq is the last sequence the loop issued to any remediation task
                  for this file (subtitles, transcode, graft). It never decreases while
                  the MediaFile exists; the probe and markers keep their record-local
                  Seq (split §6.5.2).
                format: int64
                minimum: 0
                type: integer
              markers:
                description: |-
                  Markers are the skip segments TheIntroDB publishes for this file,
                  fetched by catalogarr's marker worker (field manager
                  catalogarr-markers) with the probe's duration, and seeded into Plex
                  by cluster-plex (spec 2026-09-30 plex-analyze-bypass).
                properties:
                  analysis:
                    description: |-
                      Analysis is clustarr's own analysis of the file; segments it found
                      are merged into Segments under TheIntroDB's and the chapters'.
                    properties:
                      analyzedAt:
                        description: AnalyzedAt is when the worker's result was recorded.
                        format: date-time
                        type: string
                      forProbeHash:
                        description: ForProbeHash is status.probeHash of the file
                          analyzed.
                        maxLength: 128
                        type: string
                      message:
                        description: Message says why the analysis ended NotFound
                          or Error.
                        maxLength: 512
                        type: string
                      result:
                        description: Result is Found, NotFound or Error.
                        enum:
                        - Found
                        - NotFound
                        - Error
                        type: string
                      version:
                        description: |-
                          Version is pkg/segments.AnalyzerVersion when analyzed; an older one
                          is analyzed again.
                        format: int32
                        type: integer
                    required:
                    - analyzedAt
                    - result
                    type: object
                  durationMs:
                    description: 'DurationMs is the duration_ms sent: the probe''s
                      runtime.'
                    format: int64
                    minimum: 0
                    type: integer
                  fetchedAt:
                    description: FetchedAt is when TheIntroDB was last asked.
                    format: date-time
                    type: string
                  forProbeHash:
                    description: |-
                      ForProbeHash is status.probeHash when these were fetched: a new file
                      at the same path fetches again.
                    maxLength: 128
                    type: string
                  message:
                    description: Message says why the fetch ended NotFound or Error.
                    maxLength: 512
                    type: string
                  notFoundSince:
                    description: |-
                      NotFoundSince is when TheIntroDB first had nothing for this probe,
                      on a NotFound result: the longer it has had nothing, the less often
                      it is asked again (markers.Due).
                    format: date-time
                    type: string
                  result:
                    description: |-
                      Result is TheIntroDB's: Found, NotFound or Error. Empty while only
                      clustarr's own analysis has a result (Analysis).
                    enum:
                    - Found
                    - NotFound
                    - Error
                    type: string
                  segments:
                    description: Segments are ordered by start.
                    items:
                      description: MarkerSegment is one skip segment, in milliseconds
                        from the file's start.
                      properties:
                        confidence:
                          description: |-
                            Confidence is a whole percent: 100 for TheIntroDB and chapters,
                            70-90 for local analysis (pkg/segments).
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        endMs:
                          format: int64
                          minimum: 0
                          type: integer
                        kind:
                          description: MarkerKind is a skip segment's kind, as TheIntroDB
                            names it.
                          enum:
                          - intro
                          - recap
                          - credits
                          - preview
                          type: string
                        source:
                          description: |-
                            Source is where the segment came from; empty is theintrodb, which
                            wrote segments before sources existed.
                          enum:
                          - theintrodb
                          - chapters
                          - analysis
                          type: string
                        startMs:
                          format: int64
                          minimum: 0
                          type: integer
                      required:
                      - endMs
                      - kind
                      - startMs
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              mediaInfo:
                description: |-
                  MediaInfo is the technical description produced by the probe. Its
                  transcodeProfile is the file's CLUSTARR_PROFILE tag: with it, or with
                  spec.original false, the file is transcoded and final
                  (app/catalog/controller/rollup.Transcoded) -- the tag is what recognises
                  a file an earlier install transcoded, found by a rescan.
                properties:
                  attachments:
                    description: Attachments is the number of attachment streams (fonts,
                      cover art).
                    format: int32
                    type: integer
                  audio:
                    description: Audio lists the audio tracks.
                    items:
                      description: AudioStream describes one audio track of a media
                        file.
                      properties:
                        bitrateKbps:
                          description: BitrateKbps is the track bitrate in kilobits
                            per second.
                          format: int32
                          type: integer
                        channelLayout:
                          description: |-
                            ChannelLayout is ffprobe's channel_layout string, e.g. "5.1(side)" or
                            "6.1". The bare Channels count cannot distinguish 2.1 from 3.0, or 6.1
                            from 7.0, so a renderer that needs the real layout reads this instead.
                          maxLength: 32
                          type: string
                        channels:
                          description: Channels is the channel count (2 = stereo,
                            6 = 5.1, 8 = 7.1).
                          format: int32
                          type: integer
                        codec:
                          description: Codec is the audio codec name, e.g. aac, eac3,
                            truehd, flac.
                          maxLength: 64
                          type: string
                        commentary:
                          description: Commentary is true when the track is a commentary
                            track.
                          type: boolean
                        default:
                          description: Default is true when the container flags this
                            as the default audio track.
                          type: boolean
                        index:
                          description: Index is the zero-based stream index inside
                            the container.
                          format: int32
                          type: integer
                        language:
                          description: Language is the ISO 639 language tag of the
                            track.
                          maxLength: 64
                          type: string
                        profile:
                          description: Profile is the codec profile, if any, e.g.
                            Atmos or DTS-HD MA.
                          maxLength: 64
                          type: string
                        title:
                          description: Title is the track title from the container
                            metadata.
                          maxLength: 256
                          type: string
                      type: object
                    maxItems: 64
                    type: array
                  chapterList:
                    description: |-
                      ChapterList is the file's chapters, at most the first 64, in file
                      order: segment detection reads their names (pkg/segments).
                    items:
                      description: |-
                        Chapter is one chapter of a media file, its times in milliseconds from the
                        file's start.
                      properties:
                        endMillis:
                          format: int64
                          minimum: 0
                          type: integer
                        startMillis:
                          format: int64
                          minimum: 0
                          type: integer
                        title:
                          description: Title is the chapter's name, cut to 128 bytes.
                          maxLength: 128
                          type: string
                      required:
                      - endMillis
                      - startMillis
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  chapters:
                    description: Chapters is the number of chapters.
                    format: int32
                    type: integer
                  container:
                    description: Container is the container format, e.g. mkv, mp4,
                      flac, epub.
                    maxLength: 64
                    type: string
                  doviBLCompatID:
                    description: DoviBLCompatID is the Dolby Vision base-layer compatibility
                      ID, when present.
                    format: int32
                    type: integer
                  doviProfile:
                    description: DoviProfile is the Dolby Vision profile number, when
                      present.
                    format: int32
                    type: integer
                  fpsMilli:
                    description: |-
                      FpsMilli is the video frame rate in thousandths of a frame per second,
                      so 23.976 fps is 23976. Scaled integers are used instead of floats because
                      CRD schemas discourage floating-point values.
                    format: int32
                    minimum: 0
                    type: integer
                  hdr:
                    description: Hdr is the HDR format of the video stream.
                    enum:
                    - none
                    - pq10
                    - hdr10
                    - hdr10plus
                    - hlg10
                    - dolbyVision
                    - dolbyVisionHdr10
                    - dolbyVisionSdr
                    - dolbyVisionHlg
                    - dolbyVisionHdr10Plus
                    type: string
                  height:
                    description: Height is the video frame height in pixels.
                    format: int32
                    type: integer
                  pixelFormat:
                    description: PixelFormat is the pixel format, e.g. yuv420p10le.
                    maxLength: 64
                    type: string
                  runtimeMillis:
                    description: RuntimeMillis is the total duration of the file in
                      milliseconds.
                    format: int64
                    minimum: 0
                    type: integer
                  subtitles:
                    description: Subtitles lists the embedded subtitle tracks.
                    items:
                      description: SubtitleStream describes one subtitle track of
                        a media file.
                      properties:
                        bitmap:
                          description: Bitmap is true for image-based subtitles (PGS,
                            VobSub) as opposed to text.
                          type: boolean
                        codec:
                          description: Codec is the subtitle codec name, e.g. subrip,
                            ass, hdmv_pgs_subtitle.
                          maxLength: 64
                          type: string
                        forced:
                          description: Forced is true when the track is flagged as
                            forced.
                          type: boolean
                        hearingImpaired:
                          description: HearingImpaired is true when the track is flagged
                            as SDH / hearing impaired.
                          type: boolean
                        index:
                          description: Index is the zero-based stream index inside
                            the container.
                          format: int32
                          type: integer
                        language:
                          description: Language is the ISO 639 language tag of the
                            track.
                          maxLength: 64
                          type: string
                        title:
                          description: Title is the track title from the container
                            metadata.
                          maxLength: 256
                          type: string
                      type: object
                    maxItems: 64
                    type: array
                  transcodeProfile:
                    description: |-
                      TranscodeProfile is the file's CLUSTARR_PROFILE container tag,
                      "<profile>@<hash>", which squasharr stamps into every file it writes
                      (pkg/transcode.Args). Empty when the file carries no such tag. Read
                      case-insensitively, because a container may change a tag key's case.
                      A file that carries it was transcoded -- by this install or an earlier
                      one -- and a transcoded file is final: its item reads Transcoded and is
                      never upgraded automatically (app/catalog/controller/rollup.Transcoded).
                      The bound is a TranscodeProfile name (253) plus "@" and a SHA-256 hex
                      hash (64); pkg/mediainfo drops a longer value, which no squasharr wrote.
                    maxLength: 320
                    type: string
                  videoBitDepth:
                    description: VideoBitDepth is the video bit depth (8, 10, 12).
                    format: int32
                    type: integer
                  videoBitrateKbps:
                    description: VideoBitrateKbps is the video bitrate in kilobits
                      per second.
                    format: int32
                    type: integer
                  videoCodec:
                    description: VideoCodec is the video codec name, e.g. h264, hevc,
                      av1.
                    maxLength: 64
                    type: string
                  videoEncoder:
                    description: |-
                      VideoEncoder is the video stream's ENCODER tag, which ffmpeg writes
                      when it encodes a stream ("Lavc61.3.100 hevc_qsv") and a release
                      muxed from its own encode seldom carries. A libavcodec HEVC or AV1
                      encoder here means the file was transcoded after release by some
                      other tool (TranscodedElsewhere), and a transcoded file is final.
                      pkg/mediainfo drops a value past the bound.
                    maxLength: 256
                    type: string
                  videoProfile:
                    description: VideoProfile is the video codec profile, e.g. Main
                      10.
                    maxLength: 64
                    type: string
                  width:
                    description: Width is the video frame width in pixels.
                    format: int32
                    type: integer
                type: object
              naming:
                description: |-
                  Naming is the file's canonical path under its RootFolder's naming
                  preset, rendered by catalogarr from the item's metadata, the
                  release-time spec and the probe; importarr performs the rename.
                properties:
                  current:
                    description: Current is true when spec.path equals expectedPath.
                    type: boolean
                  expectedPath:
                    description: |-
                      ExpectedPath is the absolute path the preset renders; empty until
                      the item's metadata and the probe are both present.
                    maxLength: 4096
                    type: string
                  quality:
                    description: |-
                      Quality is the probe-corrected quality importarr re-applies into
                      spec.quality when it renames.
                    properties:
                      modifier:
                        description: Modifier refines the quality (remux, screener,
                          ...).
                        enum:
                        - none
                        - regional
                        - screener
                        - rawhd
                        - brdisk
                        - remux
                        type: string
                      name:
                        description: Name is the canonical quality definition name.
                        maxLength: 64
                        type: string
                      resolution:
                        description: Resolution is the vertical resolution in lines.
                          Video only.
                        enum:
                        - 0
                        - 360
                        - 480
                        - 540
                        - 576
                        - 720
                        - 1080
                        - 2160
                        format: int32
                        type: integer
                      source:
                        description: Source is the release source. Video only.
                        enum:
                        - unknown
                        - cam
                        - telesync
                        - telecine
                        - workprint
                        - dvd
                        - tv
                        - webdl
                        - webrip
                        - bluray
                        type: string
                    required:
                    - name
                    type: object
                  reason:
                    description: Reason says why expectedPath is empty or the file
                      is not renameable.
                    enum:
                    - MetadataPending
                    - ProbePending
                    - TranscodePending
                    - Recycling
                    - Unrenderable
                    type: string
                required:
                - current
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              probeHash:
                description: ProbeHash is sha1(path|size|mtime); a change makes downstream
                  services replan.
                maxLength: 128
                type: string
              probeVersion:
                description: |-
                  ProbeVersion is the version of the probe that last described the
                  file (pkg/mediainfo.ProbeVersion). A file probed by an older version
                  is probed again, with probeHash unchanged: the hash is the file's
                  identity to captionarr and squasharr, and its bytes did not change.
                  Zero is a file probed before versions existed.
                format: int32
                minimum: 0
                type: integer
              probedAt:
                description: ProbedAt is when the file was last probed.
                format: date-time
                type: string
              sidecars:
                description: |-
                  Sidecars are the subtitle sidecars beside the file, found on disk by
                  the subtitles planner's directory read, sorted by name. Release N keeps
                  today's map list keyed by path (loop spec §2.16); N+1 makes it atomic.
                items:
                  description: |-
                    Sidecar is a subtitle sidecar beside the media file (loop spec §2.7):
                    every attributable one the subtitles planner's directory read finds,
                    downloaded, written by the MP4 standard or placed by hand.
                  properties:
                    forced:
                      description: Forced is true when the sidecar is a forced subtitle
                        track.
                      type: boolean
                    hi:
                      description: HI is true when the sidecar is a hearing-impaired
                        (SDH) subtitle track.
                      type: boolean
                    language:
                      description: Language is the sidecar's language tag.
                      maxLength: 35
                      type: string
                    name:
                      description: |-
                        Name is the sidecar's file name in the media file's directory.
                        rollback has none); +required with MinLength=1 from N+1.
                      maxLength: 255
                      type: string
                    path:
                      description: |-
                        Path is the sidecar's absolute path: today's field and the list's map
                        key, written by the loop on every entry in release N (dir(spec.path)
                        list after a rollback (§2.16). The loop fills each half from the
                        other on an entry it carries forward. Deleted in N+1.
                      maxLength: 4096
                      type: string
                  required:
                  - path
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              subtitles:
                description: |-
                  Subtitles is the remediation loop's subtitles block (loop spec §2.4);
                  it replaces SubtitleRequest.
                properties:
                  cutoffMet:
                    description: CutoffMet is sent false as well as true (no omitempty,
                      no default).
                    type: boolean
                  items:
                    description: Items is one entry per wanted language or language
                      on disk, sorted by langKey.
                    items:
                      description: SubtitleItemStatus is one language of a file's
                        subtitles.
                      properties:
                        attempts:
                          description: Attempts tracks repeated attempts at an operation
                            such as a search or grab.
                          properties:
                            count:
                              description: Count is the total number of attempts so
                                far.
                              format: int32
                              type: integer
                            initial:
                              description: Initial is when the first attempt was made.
                              format: date-time
                              type: string
                            latest:
                              description: Latest is when the most recent attempt
                                was made.
                              format: date-time
                              type: string
                          type: object
                        dispatch:
                          description: |-
                            Dispatch fences one remediation's task and the record that answers it
                            (loop spec §2.3). A dispatch takes seq = records.NextSeq(record.Seq,
                            status.lastSeq, now), and the apply that moves its block in flight writes
                            status.lastSeq = seq beside it; records are also matched by their inputs.
                          properties:
                            answeredSeq:
                              description: |-
                                AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                                answer, a withdrawal or a timeout. A task is in flight while
                                Seq > AnsweredSeq.
                              format: int64
                              minimum: 0
                              type: integer
                            delivery:
                              description: |-
                                Delivery is what the manager knows about the task between publish
                                and answer. Written on transitions only (ADR-0019 §8.3), never per
                                nak.
                              properties:
                                attempts:
                                  description: Attempts is the deliveries count of
                                    the last nak the manager recorded.
                                  format: int32
                                  type: integer
                                deadLetteredAt:
                                  format: date-time
                                  type: string
                                lastNakAt:
                                  format: date-time
                                  type: string
                                message:
                                  maxLength: 256
                                  type: string
                                reason:
                                  description: |-
                                    Reason when waiting or retrying: Budget, Paced, NoAgent,
                                    NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                                  maxLength: 64
                                  type: string
                                state:
                                  description: |-
                                    DeliveryPhase is where a dispatched task is between its publish and its
                                    answer (ADR-0019 §8.3).
                                  enum:
                                  - waiting
                                  - published
                                  - claimed
                                  - retrying
                                  - deadLettered
                                  type: string
                              required:
                              - state
                              type: object
                            destination:
                              description: |-
                                Destination is the durable, pool or engine instance the task went to
                                (ADR-0019 §8.3).
                              maxLength: 253
                              type: string
                            dispatchedAt:
                              description: |-
                                DispatchedAt is when Seq was issued; the republish window and the
                                request timeout run from it.
                              format: date-time
                              type: string
                            seq:
                              description: Seq is the sequence of the last task issued
                                for this remediation.
                              format: int64
                              minimum: 1
                              type: integer
                            withdrawn:
                              description: |-
                                Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                                not by an answer. For transcode and graft a fact (a change already
                                made on disk) can still land after that: the planner keeps reading
                                the record while Withdrawn is true and now < DispatchedAt +
                                records.FactWindow, and incorporates a fact at Seq whatever the phase
                                (§4.10, §5.9). Incorporating it clears Withdrawn.
                              type: boolean
                          required:
                          - dispatchedAt
                          - seq
                          type: object
                        downloadedAt:
                          format: date-time
                          type: string
                        langKey:
                          maxLength: 64
                          minLength: 1
                          type: string
                        lastError:
                          maxLength: 512
                          type: string
                        name:
                          description: |-
                            Name is the sidecar written for this language: a file name in the media
                            file's directory.
                          maxLength: 255
                          type: string
                        nextSearchAt:
                          format: date-time
                          type: string
                        provider:
                          description: Provider is the SubtitleProvider's name.
                          maxLength: 253
                          type: string
                        score:
                          format: int32
                          minimum: 0
                          type: integer
                        scoreOutOf:
                          format: int32
                          minimum: 0
                          type: integer
                        state:
                          description: |-
                            SubtitleState is one language's state, derived by the loop on every plan.
                            Its first value is pending; searching means dispatch.seq >
                            dispatch.answeredSeq.
                          enum:
                          - pending
                          - searching
                          - downloaded
                          - upgradable
                          - unavailable
                          - failed
                          type: string
                        subtitleID:
                          maxLength: 256
                          type: string
                      required:
                      - langKey
                      - state
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  message:
                    maxLength: 1024
                    type: string
                  phase:
                    description: SubtitlesPhase is the queue view of one file's subtitles
                      (loop spec §2.4).
                    enum:
                    - NotWanted
                    - Wanted
                    - Searching
                    - Satisfied
                    - Blocked
                    type: string
                  probeHash:
                    description: |-
                      ProbeHash is the status.probeHash the items describe; a new one resets
                      every language's attempts. Written only while items exist, so a
                      NotWanted block with no items does not change with the bytes.
                      (No profileGeneration: nothing reads it from status, and on a block
                      every probed video file carries it would make one SubtitleProfile
                      edit rewrite every MediaFile. The task and the record carry it, §6.6.)
                    maxLength: 128
                    type: string
                  profile:
                    description: Profile is the SubtitleProfile the plan used.
                    maxLength: 253
                    type: string
                  reason:
                    description: |-
                      Reason is why the phase is Blocked: ItemNotFound, NoProfile,
                      ProfileInvalid, MediaFileNotOnDataVolume, MediaDirUnreadable or
                      MediaFileNotOnDisk.
                    maxLength: 64
                    type: string
                  wanted:
                    description: Wanted is the langKeys still missing.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - cutoffMet
                - phase
                type: object
              transcode:
                description: |-
                  Transcode is the remediation loop's transcode block (loop spec §2.5);
                  it replaces TranscodeJob.
                properties:
                  attempts:
                    description: |-
                      Attempts counts dispatches in the current cycle; a retry, new bytes or
                      a new ProfileHash reset it. Dispatch.Seq never resets.
                    format: int32
                    minimum: 0
                    type: integer
                  blocked:
                    description: |-
                      Blocked is a Failed verdict that is not retried without
                      transcode.clustarr.io/retry, new bytes or a new ProfileHash.
                    type: boolean
                  class:
                    description: |-
                      TranscodeClass is the concrete class a task was dispatched to
                      (pkg/crdcheck.TestTranscodeClassIsConcreteHardware).
                    enum:
                    - cpu
                    - nvidia
                    - intel
                    type: string
                  compliant:
                    description: Compliant is true when the file already matches its
                      TranscodeProfile.
                    type: boolean
                  dispatch:
                    description: |-
                      Dispatch fences one remediation's task and the record that answers it
                      (loop spec §2.3). A dispatch takes seq = records.NextSeq(record.Seq,
                      status.lastSeq, now), and the apply that moves its block in flight writes
                      status.lastSeq = seq beside it; records are also matched by their inputs.
                    properties:
                      answeredSeq:
                        description: |-
                          AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                          answer, a withdrawal or a timeout. A task is in flight while
                          Seq > AnsweredSeq.
                        format: int64
                        minimum: 0
                        type: integer
                      delivery:
                        description: |-
                          Delivery is what the manager knows about the task between publish
                          and answer. Written on transitions only (ADR-0019 §8.3), never per
                          nak.
                        properties:
                          attempts:
                            description: Attempts is the deliveries count of the last
                              nak the manager recorded.
                            format: int32
                            type: integer
                          deadLetteredAt:
                            format: date-time
                            type: string
                          lastNakAt:
                            format: date-time
                            type: string
                          message:
                            maxLength: 256
                            type: string
                          reason:
                            description: |-
                              Reason when waiting or retrying: Budget, Paced, NoAgent,
                              NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                            maxLength: 64
                            type: string
                          state:
                            description: |-
                              DeliveryPhase is where a dispatched task is between its publish and its
                              answer (ADR-0019 §8.3).
                            enum:
                            - waiting
                            - published
                            - claimed
                            - retrying
                            - deadLettered
                            type: string
                        required:
                        - state
                        type: object
                      destination:
                        description: |-
                          Destination is the durable, pool or engine instance the task went to
                          (ADR-0019 §8.3).
                        maxLength: 253
                        type: string
                      dispatchedAt:
                        description: |-
                          DispatchedAt is when Seq was issued; the republish window and the
                          request timeout run from it.
                        format: date-time
                        type: string
                      seq:
                        description: Seq is the sequence of the last task issued for
                          this remediation.
                        format: int64
                        minimum: 1
                        type: integer
                      withdrawn:
                        description: |-
                          Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                          not by an answer. For transcode and graft a fact (a change already
                          made on disk) can still land after that: the planner keeps reading
                          the record while Withdrawn is true and now < DispatchedAt +
                          records.FactWindow, and incorporates a fact at Seq whatever the phase
                          (§4.10, §5.9). Incorporating it clears Withdrawn.
                        type: boolean
                    required:
                    - dispatchedAt
                    - seq
                    type: object
                  fallbackReason:
                    maxLength: 256
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  hardware:
                    description: |-
                      Hardware is the hardware in force: the transcode.clustarr.io/hardware
                      annotation when valid, else the profile's.
                    enum:
                    - cpu
                    - nvidia
                    - intel
                    - auto
                    - gpu
                    type: string
                  jobRef:
                    description: |-
                      JobRef and LastResult are today's fields, kept in release N's schema
                      only so the previous release's apply is still valid after a rollback
                      (§2.16). The loop never writes them; LastResult has no default. F9.2
                      deletes both.
                    maxLength: 253
                    type: string
                  joinedGraft:
                    description: |-
                      JoinedGraft is the graft the dispatch at Dispatch.Seq carries, written
                      by the transcode planner in the apply that dispatches and kept until
                      its next dispatch (§5.13).
                    properties:
                      donorImportedAt:
                        format: date-time
                        type: string
                      donorRelease:
                        maxLength: 512
                        type: string
                      languages:
                        items:
                          maxLength: 35
                          type: string
                        maxItems: 4
                        type: array
                        x-kubernetes-list-type: atomic
                      probeHash:
                        maxLength: 128
                        type: string
                    required:
                    - donorRelease
                    - probeHash
                    type: object
                  lastResult:
                    description: |-
                      TranscodeResult is the outcome of the most recent transcode of a file:
                      today's lastResult, kept in release N's schema only so the previous
                      release's apply stays valid after a rollback (loop spec §2.16). The loop
                      never writes it; F9.2 deletes it.
                    enum:
                    - none
                    - succeeded
                    - failed
                    - skipped
                    type: string
                  message:
                    maxLength: 1024
                    type: string
                  nextAttemptAt:
                    format: date-time
                    type: string
                  phase:
                    description: |-
                      Phase is always written by the loop. It is +optional, and omitted
                      when empty, in release N only: the previous release applies this
                      block with no phase under the same field manager, and a typed
                      phase-less block must not send phase:"" (§2.16). F9.2 makes it
                    enum:
                    - Pending
                    - Planned
                    - Queued
                    - Running
                    - Swapping
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  plan:
                    description: TranscodePlan is what the transcode planner decided
                      for the file.
                    properties:
                      decode:
                        enum:
                        - cpu
                        - nvdec
                        - upload
                        - vaapi
                        - qsv
                        type: string
                      dropped:
                        description: |-
                          Dropped names each source subtitle the output carries neither embedded
                          nor as a sidecar (standard.Result.Dropped: a codec the MP4 standard does
                          not carry, or a second track for a sidecar name already planned), each
                          clamped on a rune boundary; past 8, the eighth reads "and N more". It
                          replaces the "; dropped …" suffix main's c0fb39b7 adds to TranscodeJob's
                          Planned condition, which the fold removes (loop spec §2.5, D44).
                        items:
                          maxLength: 320
                          type: string
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: atomic
                      encoder:
                        maxLength: 64
                        type: string
                      hdrMode:
                        maxLength: 64
                        type: string
                      mode:
                        description: TranscodeMode is a plan's mode.
                        enum:
                        - transcode
                        - remuxOnly
                        type: string
                      planHash:
                        maxLength: 64
                        type: string
                      videoAction:
                        enum:
                        - copy
                        - encode
                        type: string
                    required:
                    - mode
                    - planHash
                    type: object
                  plannedAt:
                    description: |-
                      PlannedAt is when this (ProfileHash, ProbeHash) first reached Planned;
                      admission orders by priority, then PlannedAt, then name.
                    format: date-time
                    type: string
                  pool:
                    description: Pool is the pool Job of the in-flight or last dispatch.
                    maxLength: 253
                    type: string
                  priority:
                    description: |-
                      Priority is the priority admission used: the annotation's, else the
                      profile's spec.priority.
                    format: int32
                    type: integer
                  probeHash:
                    description: ProbeHash is the status.probeHash the plan or verdict
                      was made for.
                    maxLength: 128
                    type: string
                  profile:
                    description: |-
                      Profile is the TranscodeProfile that won the file, and ProfileHash the
                      hash the block is planned under (jobspec.ProfileHash over the
                      standard's inputs and standard.Version, the function the profile's
                      status.hash uses). Pending, Failed and Skipped are verdicts for this
                      (ProfileHash, ProbeHash) only.
                    maxLength: 253
                    type: string
                  profileHash:
                    maxLength: 64
                    type: string
                  profileTag:
                    description: |-
                      ProfileTag is <Profile>@<ProfileHash>, set when a swap is incorporated,
                      from this block, never from a TranscodeProfile Get.
                    maxLength: 320
                    type: string
                  reason:
                    maxLength: 64
                    type: string
                  result:
                    description: |-
                      Result stays until the swap is incorporated, and for good for a
                      replaceSource=false copy (the rescan protects result.outputPath).
                    properties:
                      outputPath:
                        maxLength: 4096
                        type: string
                      outputSizeBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      outputToSourcePercent:
                        format: int32
                        minimum: 0
                        type: integer
                      vmafCentis:
                        format: int32
                        maximum: 10000
                        minimum: 0
                        type: integer
                    required:
                    - outputPath
                    type: object
                  startedAt:
                    format: date-time
                    type: string
                  stderrTail:
                    description: |-
                      StderrTail is the last 1 KiB of the encoder's stderr on Failed; the
                      record keeps 4 KiB.
                    maxLength: 1024
                    type: string
                  suspended:
                    description: Suspended is the transcode.clustarr.io/suspend annotation
                      in force.
                    type: boolean
                  workerPod:
                    maxLength: 253
                    type: string
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.mediaRef.name
    - jsonPath: .spec.mediaRef.kind
    - jsonPath: .status.transcode.phase
    - jsonPath: .status.subtitles.phase
    - jsonPath: .status.graft.phase
    - jsonPath: .status.naming.current
    served: true
    storage: true
    subresources:
      status: {}
