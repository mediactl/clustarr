---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: issues.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Issue
    listKind: IssueList
    plural: issues
    shortNames:
    - iss
    singular: issue
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.comicRef
      name: Comic
      type: string
    - jsonPath: .spec.number
      name: Number
      type: string
    - jsonPath: .status.title
      name: Title
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.hasFile
      name: File
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Issue is one issue of a Comic. Issues are created and owned by the Comic
          controller and named <comic>-<calculatedNumber padded to 5.1>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IssueSpec defines the desired state of Issue. Issues are created and owned
              by their Comic; only Monitored is meant to be edited by users.
            properties:
              calculatedNumberCentis:
                description: |-
                  CalculatedNumberCentis is the sortable numeric form of Number in
                  hundredths, so issue 12 is 1200 and issue 12.5 is 1250. A scaled integer
                  is used instead of a float because CRD schemas do not allow floats.
                format: int32
                type: integer
                x-kubernetes-validations:
                - message: calculatedNumberCentis is immutable
                  rule: self == oldSelf
              comicRef:
                description: ComicRef is the name of the owning Comic in the same
                  namespace.
                type: string
                x-kubernetes-validations:
                - message: comicRef is immutable
                  rule: self == oldSelf
              monitored:
                default: true
                description: |-
                  Monitored enables automatic searching for this issue. The Comic
                  controller sets it at creation and per the comic's monitorNewIssues;
                  after that it belongs to the user.
                type: boolean
              number:
                description: |-
                  Number is the issue number exactly as the provider prints it, e.g. "12",
                  "12.HU" or "Annual 1".
                type: string
                x-kubernetes-validations:
                - message: number is immutable
                  rule: self == oldSelf
            required:
            - calculatedNumberCentis
            - comicRef
            - number
            type: object
          status:
            description: IssueStatus describes the observed state of Issue.
            properties:
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this issue.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the issue's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              date:
                description: Date is the issue's cover or store date.
                format: date-time
                type: string
              fileQuality:
                description: FileQuality is the quality of the imported file.
                properties:
                  modifier:
                    description: Modifier refines the quality (remux, screener, ...).
                    enum:
                    - none
                    - regional
                    - screener
                    - rawhd
                    - brdisk
                    - remux
                    type: string
                  name:
                    description: Name is the canonical quality definition name.
                    type: string
                  resolution:
                    description: Resolution is the vertical resolution in lines. Video
                      only.
                    enum:
                    - 0
                    - 360
                    - 480
                    - 540
                    - 576
                    - 720
                    - 1080
                    - 2160
                    format: int32
                    type: integer
                  source:
                    description: Source is the release source. Video only.
                    enum:
                    - unknown
                    - cam
                    - telesync
                    - telecine
                    - workprint
                    - dvd
                    - tv
                    - webdl
                    - webrip
                    - bluray
                    type: string
                required:
                - name
                type: object
              fileRef:
                description: FileRef is the name of the MediaFile backing the issue.
                type: string
              hasFile:
                description: HasFile is true while a MediaFile backs the issue.
                type: boolean
              lastSearchedAt:
                description: LastSearchedAt is when the issue was last searched for.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              searchAttempts:
                description: SearchAttempts counts the searches made for this issue.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
              sourceID:
                description: SourceID is the provider's ID for this issue.
                type: string
              state:
                description: State is the acquisition state of the issue.
                enum:
                - wanted
                - skipped
                - snatched
                - downloaded
                - archived
                - ignored
                - failed
                type: string
              title:
                description: Title is the issue title.
                type: string
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.comicRef
    served: true
    storage: true
    subresources:
      status: {}
