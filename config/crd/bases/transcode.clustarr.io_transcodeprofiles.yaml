---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: transcodeprofiles.transcode.clustarr.io
spec:
  group: transcode.clustarr.io
  names:
    categories:
    - clustarr
    kind: TranscodeProfile
    listKind: TranscodeProfileList
    plural: transcodeprofiles
    singular: transcodeprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.default
      name: Default
      type: boolean
    - jsonPath: .spec.hardware
      name: Hardware
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.matchingFiles
      name: Matching
      type: integer
    - jsonPath: .status.pendingJobs
      name: Pending
      type: integer
    - jsonPath: .status.runningJobs
      name: Running
      type: integer
    - jsonPath: .status.hash
      name: Hash
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TranscodeProfile describes how matching MediaFiles are transcoded.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TranscodeProfileSpec defines the desired state of TranscodeProfile.
            properties:
              activeDeadline:
                default: 48h
                description: |-
                  ActiveDeadline is each task's deadline, enforced by the worker; a task
                  past it is blocked as DeadlineExceeded. A Go client always sends a
                  Duration, so the controller floors a zero (or negative) one to the 48h
                  default when it builds the Job, rather than running the encode with no
                  deadline at all.
                type: string
              audio:
                default: {}
                description: Audio decides which audio languages are kept.
                properties:
                  languages:
                    description: |-
                      Languages keeps only audio in these languages (commentary always, and
                      every track when none matches); empty keeps all. The kept tracks are
                      copied when Apple TV plays them directly (AAC, AC-3, E-AC-3), else
                      encoded to AAC: the standard decides, not the profile.
                    items:
                      type: string
                    type: array
                type: object
              chunking:
                description: |-
                  Chunking configures chunked encoding. Deferred: accepted but
                  chunking.enabled must be false in v1alpha1.
                properties:
                  enabled:
                    description: Enabled turns on chunked encoding. Must be false
                      in v1alpha1.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: 'chunking is not supported in v1alpha1: chunking.enabled
                    must be false'
                  rule: '!has(self.enabled) || !self.enabled'
              container:
                default: mp4
                description: |-
                  Container is ignored since the MP4 standard (2026-10-06): every
                  transcode writes MP4. It is kept so existing profiles still apply.
                enum:
                - mkv
                - mp4
                type: string
              default:
                description: |-
                  Default marks this profile as the cluster default. Exactly one profile
                  may be the default; the controller sets Invalid on the newer one.
                type: boolean
              gpu:
                description: GPU schedules the encode pod onto a GPU.
                properties:
                  count:
                    default: 1
                    description: Count is the number of GPUs requested.
                    format: int32
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector is applied to the encode pod.
                    type: object
                  runtimeClassName:
                    default: nvidia
                    description: RuntimeClassName is the RuntimeClass used for the
                      encode pod.
                    type: string
                  tolerations:
                    description: Tolerations are applied to the encode pod.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                type: object
              hardware:
                default: auto
                description: |-
                  Hardware is the encoder backend: auto is chosen per task, with CPU
                  fallback; gpu is chosen per task among the GPU classes and waits for
                  a free one rather than encode on the CPU; cpu, nvidia and intel are
                  pinned and never fall back.
                enum:
                - cpu
                - nvidia
                - intel
                - auto
                - gpu
                type: string
              maxConcurrent:
                description: |-
                  MaxConcurrent caps how many TranscodeJobs created from this profile may
                  run at once, across every hardware class -- the "per-profile counts"
                  admission applies alongside the --slots budgets. Zero or absent means no
                  per-profile cap: only the hardware slot budget applies.
                format: int32
                minimum: 0
                type: integer
              policy:
                default: {}
                description: Policy decides which files are transcoded and what happens
                  afterwards.
                properties:
                  maxOutputToSourcePercent:
                    default: 100
                    description: |-
                      MaxOutputToSourcePercent fails a job whose output is larger than this
                      percentage of the source size: 100 (the default) refuses any output
                      bigger than the file it replaces, 150 allows half as large again. It is
                      the design spec's MaxOutputToSourceRatio 1.0 as a scaled integer, since
                      the API carries no floats. 0 disables the check. A pointer so a Go
                      client can send that 0: with omitempty it would be dropped and
                      defaulted back to 100. Unset means 100.
                    format: int32
                    minimum: 0
                    type: integer
                  minDuration:
                    default: 1m
                    description: |-
                      MinDuration is the shortest source runtime considered for transcoding;
                      "0s" considers every file. A pointer because zero is meaningful: a Go
                      client always sends a non-pointer Duration, so the 1m default would
                      never reach a profile created from Go. Unset means 1m.
                    type: string
                  neverTranscodeModifiers:
                    default:
                    - remux
                    - brdisk
                    description: |-
                      NeverTranscodeModifiers lists quality modifiers (see common Modifier)
                      whose files are never transcoded.
                    items:
                      type: string
                    type: array
                  recycleBin:
                    default: true
                    description: |-
                      RecycleBin keeps the replaced source in the root folder's recycle bin.
                      false lets the swap drop the library's link to it outright (a seeding
                      hard link elsewhere under /data keeps its own copy either way). A
                      pointer so a Go client can send an explicit false; unset means true.
                    type: boolean
                  replaceSource:
                    default: true
                    description: |-
                      ReplaceSource replaces the source file with the output on success;
                      false leaves the source file in place instead of renaming the output
                      over it. A pointer so a Go client can send an explicit false; unset
                      means true.
                    type: boolean
                type: object
              priority:
                default: 50
                description: Priority orders jobs created from this profile; higher
                  runs first.
                format: int32
                type: integer
              quality:
                description: |-
                  Quality is the standard's one quality setting (0 best, 51 smallest),
                  mapped to each encoder's own control by a code table: libx265 crf,
                  hevc_nvenc qp (quality - 1, under constqp), hevc_qsv global_quality,
                  hevc_vaapi qp. Unset means 24 (QualityOrDefault), and hashes as 24.
                  Everything else about the encode is the standard's (ffgo spec §1):
                  the video, HDR, subtitle and verification settings profiles had
                  until 2026-10-01 were removed, and the apiserver prunes them from a
                  stored profile.
                format: int32
                maximum: 51
                minimum: 0
                type: integer
              resources:
                default:
                  limits:
                    cpu: "8"
                    memory: 4Gi
                description: |-
                  Resources are the encode container's resource requirements. The default
                  limits (cpu 8, memory 4Gi) suit 1080p; the CPU limit is fed to the x265
                  thread pools. The kubebuilder default fills only an ABSENT field, and a
                  Go client always sends this struct, so the controller also floors an
                  entirely empty value (no limits, no requests) to the same default when
                  it builds the Job: an encode with no resources at all is never meant.
                  A GPU pool (nvidia, intel) keeps these limits but requests only cpu
                  500m and memory 512Mi (each capped at its limit), since its encode
                  runs on the GPU; the cpu pool requests these resources as they are.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              scratch:
                anyOf:
                - type: integer
                - type: string
                default: 20Gi
                description: |-
                  Scratch is the emptyDir sizeLimit for the encode pod's scratch space.
                  A Go client always sends a Quantity, so the controller floors a zero
                  (or negative) one to the 20Gi default when it builds the Job: a
                  zero-byte scratch volume has no coherent meaning.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              selector:
                description: |-
                  Selector matches MediaFile labels this profile applies to. Only video
                  kinds (movie, episode) are eligible; enforced by the controller.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              ttlSecondsAfterFinished:
                default: 86400
                description: |-
                  TTLSecondsAfterFinished: Deprecated: ignored. Transcode pools never
                  finish; this is removed at the next API version.
                format: int32
                type: integer
            type: object
          status:
            description: TranscodeProfileStatus defines the observed state of TranscodeProfile.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              encoderLimits:
                description: |-
                  Conditions holds Ready and Invalid.
                  EncoderLimits are the encoder device limits each GPU node measured by
                  trial encodes and published within the last ten minutes, per class and
                  node. Plans for a class render min(spec, the tightest limit here), and
                  each clamp is named in the job's Planned message. Empty while no GPU
                  pool of this cluster has published.
                items:
                  description: EncoderLimit is one GPU node's measured encoder device
                    limits.
                  properties:
                    class:
                      description: Class is the hardware class of the node's pool.
                      enum:
                      - cpu
                      - nvidia
                      - intel
                      - auto
                      - gpu
                      type: string
                    healthy:
                      description: |-
                        Healthy is whether the node's pool pod could use its device when it
                        last measured it (spec §4); false sends the class no work while every
                        node reports so. Absent is a report from a worker that predates it.
                      type: boolean
                    message:
                      description: Message is why the device could not be used, when
                        Healthy is false.
                      maxLength: 256
                      type: string
                    node:
                      description: Node is the node the limits were measured on.
                      maxLength: 253
                      minLength: 1
                      type: string
                    nvdec:
                      description: |-
                        NVDEC are the source formats, as codec:bitDepth ("h264:8",
                        "hevc:10"), the node's decoder was measured to decode; the nvidia tier
                        decodes those on the GPU. Absent is none measured or none decodable,
                        and squasharr decides an unmeasured format from a static list.
                      items:
                        maxLength: 32
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - class
                  - node
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - class
                - node
                x-kubernetes-list-type: map
              hash:
                description: |-
                  Hash is the sha256 of the standard's inputs -- quality, container,
                  audio.languages, policy.neverTranscodeModifiers, policy.minDuration,
                  policy.maxOutputToSourcePercent -- and the standard's version. Encode pods tag their output CLUSTARR_PROFILE=<name>@<hash>.
                  A new hash plans new jobs only for files not yet transcoded: a
                  transcoded file is final, whatever hash it carries.
                type: string
              matchingFiles:
                description: MatchingFiles is the number of MediaFiles selected by
                  this profile.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              pendingJobs:
                description: PendingJobs is the number of TranscodeJobs for this profile
                  not yet running.
                format: int32
                type: integer
              runningJobs:
                description: RunningJobs is the number of TranscodeJobs for this profile
                  currently running.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
