---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: audiobooks.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Audiobook
    listKind: AudiobookList
    plural: audiobooks
    shortNames:
    - abk
    singular: audiobook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.title
      name: Title
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.hasFile
      name: File
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Audiobook is a monitored Audible recording in the catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AudiobookSpec defines the desired state of Audiobook.
            properties:
              artwork:
                description: Artwork overrides the provider's image for a type. One
                  entry per type.
                items:
                  description: |-
                    ArtworkOverride pins a custom URL for one image type, replacing whatever
                    the metadata provider published for it. R3: a URL that fails to fetch
                    never falls back to the provider image -- the entry and object stay as
                    they were, and an Event says why.
                  properties:
                    type:
                      description: Type classifies the image being overridden.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the replacement image is fetched from.
                      maxLength: 2048
                      pattern: ^https?://
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              asin:
                description: ASIN is the Audible ASIN; it identifies the audiobook
                  and is immutable.
                type: string
                x-kubernetes-validations:
                - message: asin is immutable
                  rule: self == oldSelf
              bookRef:
                description: BookRef links the audiobook to the Book it is a recording
                  of.
                type: string
              delayProfileRef:
                description: DelayProfileRef pins a DelayProfile; unset falls back
                  to tag matching.
                type: string
              folder:
                description: Folder overrides the folder name under the root folder.
                type: string
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this audiobook.
                type: boolean
              qualityProfileRef:
                description: |-
                  QualityProfileRef is the QualityProfile this audiobook is ranked against;
                  it must be a profile whose mediaKind is audiobook.
                type: string
              region:
                default: us
                description: Region is the Audible marketplace the ASIN belongs to.
                enum:
                - us
                - uk
                - ca
                - au
                - de
                - fr
                - es
                - in
                - it
                - jp
                type: string
              rootFolderRef:
                description: RootFolderRef is the RootFolder the audiobook is stored
                  under.
                type: string
              source:
                description: Source records the ImportList that added the audiobook,
                  if any.
                properties:
                  importListRef:
                    description: |-
                      ImportListRef is the name of the ImportList that added the item. Empty
                      means the item was added manually.
                    type: string
                type: object
              tags:
                description: Tags select DelayProfiles and other tag-matched policy.
                items:
                  type: string
                maxItems: 64
                type: array
            required:
            - asin
            - qualityProfileRef
            - rootFolderRef
            type: object
          status:
            description: AudiobookStatus describes the observed state of Audiobook.
            properties:
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this audiobook.
                type: string
              artwork:
                description: |-
                  Artwork lists the images fetched into the artwork store, one per type.
                  Written by the metadata gateway.
                items:
                  description: |-
                    ArtworkEntry records one artwork image fetched into the artwork store,
                    whether from the provider or from a spec.artwork override. Written by the
                    metadata gateway under the manager that already writes status.metadata.
                  properties:
                    digest:
                      description: Digest is the hex SHA-256 of the stored original
                        image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size in bytes of the stored original
                        image.
                      format: int64
                      type: integer
                    source:
                      description: |-
                        Source is whether this image came from the provider or a spec.artwork
                        override.
                      enum:
                      - provider
                      - custom
                      type: string
                    sourceURL:
                      description: SourceURL is the URL the image was fetched from.
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    updatedAt:
                      description: UpdatedAt is when the image was last fetched.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - sizeBytes
                  - source
                  - sourceURL
                  - type
                  - updatedAt
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                  of the audiobook's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffMet:
                description: CutoffMet is true when the imported files meet the profile
                  cutoff.
                type: boolean
              fileRefs:
                description: FileRefs lists the MediaFiles holding the audio parts,
                  in play order.
                items:
                  type: string
                maxItems: 200
                type: array
              hasFile:
                description: HasFile is true while at least one MediaFile backs the
                  audiobook.
                type: boolean
              lastSearchedAt:
                description: LastSearchedAt is when the audiobook was last searched
                  for.
                format: date-time
                type: string
              metadata:
                description: Metadata is the cached provider metadata.
                properties:
                  abridged:
                    description: Abridged is true for an abridged recording.
                    type: boolean
                  authors:
                    description: Authors lists the credited authors.
                    items:
                      description: NamedRef is a display name paired with the provider
                        ID it resolved from.
                      properties:
                        asin:
                          description: ASIN is the Audible ASIN of the named entity,
                            when known.
                          type: string
                        name:
                          description: Name is the display name.
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 30
                    type: array
                  chapters:
                    description: Chapters lists the chapter markers.
                    items:
                      description: Chapter is one chapter marker of an audiobook.
                      properties:
                        startMs:
                          description: StartMs is the chapter start offset in milliseconds.
                          format: int64
                          minimum: 0
                          type: integer
                        title:
                          description: Title is the chapter title.
                          type: string
                      required:
                      - title
                      type: object
                    maxItems: 200
                    type: array
                  externalIDs:
                    additionalProperties:
                      type: string
                    description: ExternalIDs maps provider names (audnexus, asin,
                      isbn, ...) to their IDs.
                    type: object
                  genres:
                    description: Genres lists the genres.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                  images:
                    description: Images lists the cover art published by the provider.
                    items:
                      description: Image is one artwork URL published by a metadata
                        provider.
                      properties:
                        type:
                          description: Type classifies the image.
                          enum:
                          - poster
                          - fanart
                          - banner
                          - logo
                          - clearart
                          - thumb
                          - screenshot
                          - disc
                          - headshot
                          type: string
                        url:
                          description: URL is where the image can be fetched.
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 50
                    type: array
                  isbn:
                    description: ISBN is the ISBN of the recording, when published
                      with one.
                    type: string
                  language:
                    description: Language is the BCP-47 language tag of the recording.
                    type: string
                  narrators:
                    description: Narrators lists the credited narrators.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                  overview:
                    description: Overview is the synopsis.
                    type: string
                  publisher:
                    description: Publisher is the publishing house.
                    type: string
                  refreshedAt:
                    description: RefreshedAt is when the metadata was last fetched.
                    format: date-time
                    type: string
                  releaseDate:
                    description: ReleaseDate is the publication date.
                    format: date-time
                    type: string
                  runtimeMinutes:
                    description: RuntimeMinutes is the total runtime in minutes.
                    format: int32
                    type: integer
                  series:
                    description: Series places the audiobook inside a reading order.
                    properties:
                      position:
                        description: Position is the position within the series, e.g.
                          "3" or "2.5".
                        type: string
                      primary:
                        description: Primary is true for the series a work is chiefly
                          part of.
                        type: boolean
                      series:
                        description: Series is the name of the series.
                        type: string
                    required:
                    - series
                    type: object
                  subtitle:
                    description: Subtitle is the audiobook subtitle.
                    type: string
                  title:
                    description: Title is the audiobook title.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              path:
                description: Path is the resolved folder on disk.
                type: string
              pendingGrab:
                description: PendingGrab is a chosen release waiting out a DelayProfile
                  delay.
                properties:
                  grabAt:
                    description: GrabAt is when the delay expires and the grab will
                      be issued.
                    format: date-time
                    type: string
                  protocol:
                    description: Protocol is the transfer protocol of the pending
                      release.
                    enum:
                    - torrent
                    - usenet
                    type: string
                  releaseTitle:
                    description: ReleaseTitle is the raw title of the release that
                      will be grabbed.
                    type: string
                required:
                - grabAt
                - releaseTitle
                type: object
              phase:
                description: Phase is the coarse lifecycle state of the audiobook.
                enum:
                - Wanted
                - Delayed
                - Downloading
                - Imported
                - CutoffUnmet
                - Unmonitored
                type: string
              quality:
                description: Quality is the quality of the imported recording.
                properties:
                  modifier:
                    description: Modifier refines the quality (remux, screener, ...).
                    enum:
                    - none
                    - regional
                    - screener
                    - rawhd
                    - brdisk
                    - remux
                    type: string
                  name:
                    description: Name is the canonical quality definition name.
                    type: string
                  resolution:
                    description: Resolution is the vertical resolution in lines. Video
                      only.
                    enum:
                    - 0
                    - 360
                    - 480
                    - 540
                    - 576
                    - 720
                    - 1080
                    - 2160
                    format: int32
                    type: integer
                  source:
                    description: Source is the release source. Video only.
                    enum:
                    - unknown
                    - cam
                    - telesync
                    - telecine
                    - workprint
                    - dvd
                    - tv
                    - webdl
                    - webrip
                    - bluray
                    type: string
                required:
                - name
                type: object
              searchAttempts:
                description: SearchAttempts counts the searches made for this audiobook.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.asin
    served: true
    storage: true
    subresources:
      status: {}
