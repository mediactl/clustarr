---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: delayprofiles.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    kind: DelayProfile
    listKind: DelayProfileList
    plural: delayprofiles
    shortNames:
    - dp
    singular: delayprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.order
      name: Order
      type: integer
    - jsonPath: .spec.preferredProtocol
      name: Preferred
      type: string
    - jsonPath: .spec.usenetDelayMinutes
      name: Usenet
      type: integer
    - jsonPath: .spec.torrentDelayMinutes
      name: Torrent
      type: integer
    - jsonPath: .status.pendingCount
      name: Pending
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DelayProfile holds a grab back for a while so that a better release can
          appear on the preferred protocol first.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DelayProfileSpec defines the desired state of DelayProfile.
            properties:
              bypassIfAboveFormatScore:
                default: false
                description: |-
                  BypassIfAboveFormatScore grabs immediately when the release scores at or
                  above MinimumFormatScore.
                type: boolean
              bypassIfHighestQuality:
                default: true
                description: |-
                  BypassIfHighestQuality grabs immediately when the release is already in
                  the top tier of the quality profile.
                type: boolean
              enableTorrent:
                default: true
                description: EnableTorrent allows torrent releases to be grabbed for
                  matching items.
                type: boolean
              enableUsenet:
                default: true
                description: EnableUsenet allows usenet releases to be grabbed for
                  matching items.
                type: boolean
              minimumFormatScore:
                default: 0
                description: MinimumFormatScore is the score that triggers BypassIfAboveFormatScore.
                format: int32
                type: integer
              order:
                default: 100
                description: |-
                  Order breaks ties between profiles that match the same item; lowest wins.
                  The chart installs a catch-all "default" profile with order 1000.
                format: int32
                minimum: 1
                type: integer
              preferredProtocol:
                default: usenet
                description: PreferredProtocol is the protocol preferred once both
                  delays have expired.
                enum:
                - usenet
                - torrent
                type: string
              tags:
                description: Tags matches the tags on a catalog item; empty makes
                  the profile a catch-all.
                items:
                  type: string
                maxItems: 64
                type: array
              torrentDelayMinutes:
                default: 0
                description: TorrentDelayMinutes is how long to wait before grabbing
                  a torrent release.
                format: int32
                minimum: 0
                type: integer
              usenetDelayMinutes:
                default: 0
                description: UsenetDelayMinutes is how long to wait before grabbing
                  a usenet release.
                format: int32
                minimum: 0
                type: integer
            type: object
          status:
            description: DelayProfileStatus describes the observed state of DelayProfile.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the profile's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              pendingCount:
                description: PendingCount is the number of grabs currently waiting
                  out this profile's delay.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
