---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: series.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Series
    listKind: SeriesList
    plural: series
    shortNames:
    - ser
    singular: series
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.title
      name: Title
      type: string
    - jsonPath: .spec.seriesType
      name: Type
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.episodeCount
      name: Episodes
      type: integer
    - jsonPath: .status.episodeFileCount
      name: Files
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.downloadingEpisodeCount
      name: Queue
      type: integer
    - jsonPath: .status.downloadPhase
      name: Download
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Series is a monitored television series in the catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SeriesSpec defines the desired state of Series.
            properties:
              addOptions:
                description: AddOptions are applied once, when the series is first
                  reconciled.
                properties:
                  ignoreEpisodesWithFiles:
                    description: IgnoreEpisodesWithFiles leaves episodes that already
                      have a file unmonitored.
                    type: boolean
                  ignoreEpisodesWithoutFiles:
                    description: IgnoreEpisodesWithoutFiles leaves episodes without
                      a file unmonitored.
                    type: boolean
                  monitor:
                    default: none
                    description: |-
                      Monitor selects which episodes start out monitored. The default,
                      none, searches nothing until a season or an episode is turned on.
                    enum:
                    - all
                    - future
                    - missing
                    - existing
                    - firstSeason
                    - lastSeason
                    - pilot
                    - recent
                    - monitorSpecials
                    - unmonitorSpecials
                    - none
                    - skip
                    type: string
                  searchForCutoffUnmet:
                    default: false
                    description: SearchForCutoffUnmet searches for episodes below
                      the profile cutoff on add.
                    type: boolean
                  searchForMissing:
                    default: true
                    description: SearchForMissing searches for missing episodes on
                      add.
                    type: boolean
                type: object
              artwork:
                description: Artwork overrides the provider's image for a type. One
                  entry per type.
                items:
                  description: |-
                    ArtworkOverride pins a custom URL for one image type, replacing whatever
                    the metadata provider published for it. R3: a URL that fails to fetch
                    never falls back to the provider image -- the entry and object stay as
                    they were, and an Event says why.
                  properties:
                    type:
                      description: Type classifies the image being overridden.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the replacement image is fetched from.
                      maxLength: 2048
                      pattern: ^https?://
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              delayProfileRef:
                description: DelayProfileRef pins a DelayProfile; unset falls back
                  to tag matching.
                type: string
              episodeOrder:
                default: official
                description: |-
                  EpisodeOrder is the numbering scheme releases are matched against.
                  Anime series are forced to absolute ordering.
                enum:
                - official
                - dvd
                - absolute
                type: string
              folder:
                description: Folder overrides the folder name under the root folder.
                type: string
              monitorNewItems:
                default: all
                description: |-
                  MonitorNewItems says what happens to seasons and episodes discovered
                  after the series was added.
                enum:
                - all
                - none
                type: string
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this series.
                type: boolean
              qualityProfileRef:
                description: QualityProfileRef is the QualityProfile episodes are
                  ranked against.
                type: string
              rootFolderRef:
                description: RootFolderRef is the RootFolder the series is stored
                  under.
                type: string
              seasonFolder:
                default: true
                description: SeasonFolder stores each season in its own folder.
                type: boolean
              seasons:
                description: |-
                  Seasons overrides monitoring per season. A change to an entry sets
                  spec.monitored on every episode of that season once (Sonarr's season
                  toggle), and a new episode of the season takes the override rather
                  than monitorNewItems.
                items:
                  description: SeasonSpec turns monitoring on or off for one season.
                  properties:
                    monitored:
                      default: true
                      description: Monitored enables automatic searching for the season's
                        episodes.
                      type: boolean
                    number:
                      description: Number is the season number; 0 is the specials
                        season.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - number
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - number
                x-kubernetes-list-type: map
              seriesType:
                default: standard
                description: SeriesType selects the numbering and naming dialect.
                enum:
                - standard
                - daily
                - anime
                type: string
              source:
                description: Source records the ImportList that added the series,
                  if any.
                properties:
                  importListRef:
                    description: |-
                      ImportListRef is the name of the ImportList that added the item. Empty
                      means the item was added manually.
                    type: string
                type: object
              subtitleProfileRef:
                description: SubtitleProfileRef pins a SubtitleProfile.
                type: string
              tags:
                description: Tags select DelayProfiles, TranscodeProfiles and SubtitleProfiles.
                items:
                  type: string
                maxItems: 64
                type: array
              transcodeProfileRef:
                description: TranscodeProfileRef pins a TranscodeProfile.
                type: string
              tvdbID:
                description: TvdbID is the TheTVDB series ID; it identifies the series
                  and is immutable.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: tvdbID is immutable
                  rule: self == oldSelf
            required:
            - qualityProfileRef
            - rootFolderRef
            - tvdbID
            type: object
          status:
            description: SeriesStatus describes the observed state of Series.
            properties:
              addOptionsApplied:
                description: AddOptionsApplied is true once spec.addOptions has been
                  acted on.
                type: boolean
              artwork:
                description: |-
                  Artwork lists the images fetched into the artwork store, one per type.
                  Written by the metadata gateway.
                items:
                  description: |-
                    ArtworkEntry records one artwork image fetched into the artwork store,
                    whether from the provider or from a spec.artwork override. Written by the
                    metadata gateway under the manager that already writes status.metadata.
                  properties:
                    digest:
                      description: Digest is the hex SHA-256 of the stored original
                        image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size in bytes of the stored original
                        image.
                      format: int64
                      type: integer
                    source:
                      description: |-
                        Source is whether this image came from the provider or a spec.artwork
                        override.
                      enum:
                      - provider
                      - custom
                      type: string
                    sourceURL:
                      description: SourceURL is the URL the image was fetched from.
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    updatedAt:
                      description: UpdatedAt is when the image was last fetched.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - sizeBytes
                  - source
                  - sourceURL
                  - type
                  - updatedAt
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              classification:
                description: |-
                  Classification records the one-time anime detection: once set, the
                  Series reconciler never classifies the series again, so a profile or
                  type the owner changes afterwards stays.
                properties:
                  anime:
                    description: Anime is true when the series' metadata named it
                      anime.
                    type: boolean
                  appliedAt:
                    description: AppliedAt is when it was classified.
                    format: date-time
                    type: string
                  qualityProfileRef:
                    description: QualityProfileRef is the profile applied, empty when
                      none was.
                    type: string
                  seriesType:
                    description: SeriesType is the series type applied, empty when
                      none was.
                    enum:
                    - standard
                    - daily
                    - anime
                    type: string
                required:
                - anime
                - appliedAt
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the series' state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              downloadNonces:
                description: |-
                  DownloadNonces records the one-shot download intents last handled
                  (ADR-0019 §6.10).
                properties:
                  import:
                    maxLength: 63
                    type: string
                  remove:
                    maxLength: 63
                    type: string
                  resume:
                    maxLength: 63
                    type: string
                  unblock:
                    maxLength: 63
                    type: string
                type: object
              downloadPhase:
                description: |-
                  DownloadPhase is the active entry's phase, "" when none: a print column
                  and a selectable field (ADR-0019 §6.2).
                enum:
                - Pending
                - Assigned
                - Queued
                - Downloading
                - Paused
                - Completed
                - Seeding
                - Imported
                - Failed
                - Blocklisted
                - Removing
                type: string
              downloadingEpisodeCount:
                description: |-
                  DownloadingEpisodeCount is the number of episodes with a download in
                  flight or a grab pending (phase Downloading or Delayed), specials
                  left out.
                format: int32
                type: integer
              downloads:
                description: |-
                  Downloads is every grab of this item the system is responsible for, live
                  entries only (ADR-0019 §6.4); written by the remediation loop's item key
                  under catalogarr.
                items:
                  description: |-
                    DownloadEntry is one grab of its owner, from the manager's decision to
                    grab through seeding and removal. Written only by the owner's item key
                    in the remediation loop, under field manager catalogarr (ADR-0019 §6.2).
                  properties:
                    block:
                      description: |-
                        Block is the blocklist write this entry owes the release index
                        (§6.14): set on the Blocklisted transition; ConfirmedAt when the
                        index answered. A Blocklisted entry is dropped only after its transfer
                        is removed and its block confirmed, and then after BlockQuarantine.
                      properties:
                        confirmedAt:
                          format: date-time
                          type: string
                        reason:
                          description: DownloadFailureReason is the machine-readable
                            cause of a failure.
                          enum:
                          - none
                          - missingArticles
                          - diskFull
                          - encrypted
                          - stalled
                          - writeError
                          - timeout
                          - importRejected
                          - importExpired
                          - manual
                          - payloadMismatch
                          - payloadUnavailable
                          type: string
                        scope:
                          description: BlockScope is where a release is blocked (ADR-0019
                            §6.14).
                          enum:
                          - item
                          - global
                          type: string
                        seq:
                          description: Seq fences block and unblock writes on the
                            release index row.
                          format: int64
                          minimum: 1
                          type: integer
                      required:
                      - reason
                      - scope
                      - seq
                      type: object
                    client:
                      description: |-
                        Client is the DownloadClient, Engine the instance holding the
                        transfer (<client>-<ordinal>); both pinned once, at admission.
                      maxLength: 253
                      type: string
                    completedAt:
                      format: date-time
                      type: string
                    dispatch:
                      description: |-
                        Dispatch fences the engine command: Seq is the last desired state
                        published, AnsweredSeq the transfer record's seq last incorporated
                        (loop spec §2.3, with ADR-0019 §8.3's Delivery). A Pending entry
                        carries seq 1 from creation; nothing is published until Assigned.
                      properties:
                        answeredSeq:
                          description: |-
                            AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                            answer, a withdrawal or a timeout. A task is in flight while
                            Seq > AnsweredSeq.
                          format: int64
                          minimum: 0
                          type: integer
                        delivery:
                          description: |-
                            Delivery is what the manager knows about the task between publish
                            and answer. Written on transitions only (ADR-0019 §8.3), never per
                            nak.
                          properties:
                            attempts:
                              description: Attempts is the deliveries count of the
                                last nak the manager recorded.
                              format: int32
                              type: integer
                            deadLetteredAt:
                              format: date-time
                              type: string
                            lastNakAt:
                              format: date-time
                              type: string
                            message:
                              maxLength: 256
                              type: string
                            reason:
                              description: |-
                                Reason when waiting or retrying: Budget, Paced, NoAgent,
                                NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                              maxLength: 64
                              type: string
                            state:
                              description: |-
                                DeliveryPhase is where a dispatched task is between its publish and its
                                answer (ADR-0019 §8.3).
                              enum:
                              - waiting
                              - published
                              - claimed
                              - retrying
                              - deadLettered
                              type: string
                          required:
                          - state
                          type: object
                        destination:
                          description: |-
                            Destination is the durable, pool or engine instance the task went to
                            (ADR-0019 §8.3).
                          maxLength: 253
                          type: string
                        dispatchedAt:
                          description: |-
                            DispatchedAt is when Seq was issued; the republish window and the
                            request timeout run from it.
                          format: date-time
                          type: string
                        seq:
                          description: Seq is the sequence of the last task issued
                            for this remediation.
                          format: int64
                          minimum: 1
                          type: integer
                        withdrawn:
                          description: |-
                            Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                            not by an answer. For transcode and graft a fact (a change already
                            made on disk) can still land after that: the planner keeps reading
                            the record while Withdrawn is true and now < DispatchedAt +
                            records.FactWindow, and incorporates a fact at Seq whatever the phase
                            (§4.10, §5.9). Incorporating it clears Withdrawn.
                          type: boolean
                      required:
                      - dispatchedAt
                      - seq
                      type: object
                    engine:
                      maxLength: 263
                      type: string
                    episodes:
                      description: |-
                        Episodes names the covered episodes on a Series entry (season and
                        number in the Series' stored order), Issues the covered issue numbers
                        on a Comic entry. Empty on every other owner.
                      items:
                        description: |-
                          EpisodeNumber is one episode a Series entry or pending grab covers, in
                          the Series' stored order.
                        properties:
                          number:
                            format: int32
                            minimum: 0
                            type: integer
                          season:
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - number
                        - season
                        type: object
                      maxItems: 200
                      type: array
                      x-kubernetes-list-type: atomic
                    failureReason:
                      description: DownloadFailureReason is the machine-readable cause
                        of a failure.
                      enum:
                      - none
                      - missingArticles
                      - diskFull
                      - encrypted
                      - stalled
                      - writeError
                      - timeout
                      - importRejected
                      - importExpired
                      - manual
                      - payloadMismatch
                      - payloadUnavailable
                      type: string
                    grabbedAt:
                      format: date-time
                      type: string
                    grabbedBy:
                      description: GrabSource records what caused a release to be
                        grabbed.
                      enum:
                      - rss
                      - search
                      - interactive
                      - push
                      - redownload
                      type: string
                    id:
                      description: |-
                        ID is the grab's stable name: k8s.ChildName(target, guid), or
                        k8s.ChildName(target, purpose, guid) for a donor, the name the
                        Download had (adopted entries keep it, so MediaFile
                        spec.importedFrom.downloadRef, history and ui links still resolve).
                      maxLength: 253
                      type: string
                    import:
                      description: |-
                        DownloadImportSummary is the grab's import, summarised from its
                        clustarr-imports record (ADR-0019 §6.9); the per-file detail stays in the
                        record.
                      properties:
                        attempts:
                          format: int32
                          type: integer
                        class:
                          description: |-
                            ImportRejectionClass is why an import that imported nothing did so, and
                            with it the remediation (2026-10-07: refusing every file used to blocklist
                            the release at once, which threw away a good 20 GB download that the item
                            merely would not take).
                          enum:
                          - transient
                          - itemState
                          - needsPerson
                          - releaseFault
                          type: string
                        dispatch:
                          description: Dispatch fences the inspect and execute tasks
                            (§6.9).
                          properties:
                            answeredSeq:
                              description: |-
                                AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                                answer, a withdrawal or a timeout. A task is in flight while
                                Seq > AnsweredSeq.
                              format: int64
                              minimum: 0
                              type: integer
                            delivery:
                              description: |-
                                Delivery is what the manager knows about the task between publish
                                and answer. Written on transitions only (ADR-0019 §8.3), never per
                                nak.
                              properties:
                                attempts:
                                  description: Attempts is the deliveries count of
                                    the last nak the manager recorded.
                                  format: int32
                                  type: integer
                                deadLetteredAt:
                                  format: date-time
                                  type: string
                                lastNakAt:
                                  format: date-time
                                  type: string
                                message:
                                  maxLength: 256
                                  type: string
                                reason:
                                  description: |-
                                    Reason when waiting or retrying: Budget, Paced, NoAgent,
                                    NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                                  maxLength: 64
                                  type: string
                                state:
                                  description: |-
                                    DeliveryPhase is where a dispatched task is between its publish and its
                                    answer (ADR-0019 §8.3).
                                  enum:
                                  - waiting
                                  - published
                                  - claimed
                                  - retrying
                                  - deadLettered
                                  type: string
                              required:
                              - state
                              type: object
                            destination:
                              description: |-
                                Destination is the durable, pool or engine instance the task went to
                                (ADR-0019 §8.3).
                              maxLength: 253
                              type: string
                            dispatchedAt:
                              description: |-
                                DispatchedAt is when Seq was issued; the republish window and the
                                request timeout run from it.
                              format: date-time
                              type: string
                            seq:
                              description: Seq is the sequence of the last task issued
                                for this remediation.
                              format: int64
                              minimum: 1
                              type: integer
                            withdrawn:
                              description: |-
                                Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                                not by an answer. For transcode and graft a fact (a change already
                                made on disk) can still land after that: the planner keeps reading
                                the record while Withdrawn is true and now < DispatchedAt +
                                records.FactWindow, and incorporates a fact at Seq whatever the phase
                                (§4.10, §5.9). Incorporating it clears Withdrawn.
                              type: boolean
                          required:
                          - dispatchedAt
                          - seq
                          type: object
                        files:
                          description: |-
                            Files is how many files the approved plan places; the entry reads
                            Imported only when that many MediaFiles name this entry's ID in
                            spec.importedFrom.downloadRef.
                          format: int32
                          type: integer
                        heldSince:
                          format: date-time
                          type: string
                        importedAt:
                          format: date-time
                          type: string
                        message:
                          maxLength: 1024
                          type: string
                        nextAttemptAt:
                          format: date-time
                          type: string
                        phase:
                          description: |-
                            ImportPhase is a grab's import, summarised (ADR-0019 §6.9). Not
                            downloadv1alpha1.ImportPhase, which release N+1 removes with Download.
                          enum:
                          - pending
                          - inspected
                          - approved
                          - imported
                          - blocked
                          - held
                          - expired
                          type: string
                      required:
                      - dispatch
                      - phase
                      type: object
                    issues:
                      items:
                        maxLength: 16
                        type: string
                      maxItems: 200
                      type: array
                      x-kubernetes-list-type: atomic
                    manual:
                      type: boolean
                    message:
                      maxLength: 1024
                      type: string
                    outputPath:
                      description: |-
                        OutputPath is where the engine put the payload; the manager removes
                        it (fsops.SafeRemove) when the entry's removal asks for data, so it is
                        kept in etcd, not only in the transfer record.
                      maxLength: 4096
                      type: string
                    phase:
                      description: |-
                        DownloadPhase is the lifecycle phase of a Download, owned by the grabarr
                        controller.
                      enum:
                      - Pending
                      - Assigned
                      - Queued
                      - Downloading
                      - Paused
                      - Completed
                      - Seeding
                      - Imported
                      - Failed
                      - Blocklisted
                      - Removing
                      type: string
                    purpose:
                      description: DownloadPurpose is what a Download is for.
                      enum:
                      - audioDonor
                      type: string
                    qualityProfileRef:
                      maxLength: 253
                      type: string
                    release:
                      description: |-
                        DownloadRelease is the capped subset of ReleaseInfo a grab keeps.
                        ReleaseInfo itself has no string caps, so it cannot go into status.
                      properties:
                        edition:
                          maxLength: 256
                          type: string
                        formatScore:
                          format: int32
                          type: integer
                        guid:
                          description: 'GUID is identity: a longer one is refused
                            at admission, never clamped.'
                          maxLength: 1024
                          type: string
                        indexerName:
                          maxLength: 253
                          type: string
                        indexerRef:
                          maxLength: 253
                          type: string
                        infoHash:
                          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
                          type: string
                        languages:
                          items:
                            maxLength: 35
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                        protocol:
                          description: Protocol is the transfer protocol of an indexer,
                            download client or release.
                          enum:
                          - torrent
                          - usenet
                          type: string
                        quality:
                          description: |-
                            Quality identifies a quality definition. For video the name is derived from
                            the (source, resolution, modifier) tuple; for music, books, audiobooks and
                            comics it is a table name such as FLAC, MP3-320, EPUB, M4B or CBZ.
