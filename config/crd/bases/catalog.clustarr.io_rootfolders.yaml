---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: rootfolders.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    kind: RootFolder
    listKind: RootFolderList
    plural: rootfolders
    shortNames:
    - rf
    singular: rootfolder
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .status.itemCount
      name: Items
      type: integer
    - jsonPath: .status.freeBytes
      name: Free
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RootFolder is a library location on disk that catalog items are
          stored under.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RootFolderSpec defines the desired state of RootFolder.
            properties:
              defaults:
                description: Defaults are applied to items added under this root folder.
                properties:
                  delayProfileRef:
                    description: DelayProfileRef is the default DelayProfile name.
                    type: string
                  minimumAvailability:
                    default: released
                    description: MinimumAvailability is the default minimum availability
                      for movies.
                    enum:
                    - tba
                    - announced
                    - inCinemas
                    - released
                    type: string
                  monitorNewItems:
                    default: all
                    description: MonitorNewItems is the default handling of newly
                      discovered children.
                    enum:
                    - all
                    - none
                    - new
                    type: string
                  monitored:
                    default: true
                    description: Monitored is the default monitored flag for new items.
                    type: boolean
                  qualityProfileRef:
                    description: QualityProfileRef is the default QualityProfile name.
                    type: string
                  searchOnAdd:
                    default: true
                    description: SearchOnAdd triggers a search as soon as an item
                      is added.
                    type: boolean
                  seasonFolder:
                    default: true
                    description: SeasonFolder is the default season-folder flag for
                      series added here.
                    type: boolean
                  seriesType:
                    default: standard
                    description: SeriesType is the default series type for series
                      added here.
                    enum:
                    - standard
                    - daily
                    - anime
                    type: string
                  subtitleProfileRef:
                    description: SubtitleProfileRef is the default SubtitleProfile
                      name.
                    type: string
                  tags:
                    description: Tags are applied to every item added under this root
                      folder.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  transcodeProfileRef:
                    description: TranscodeProfileRef is the default TranscodeProfile
                      name.
                    type: string
                type: object
              kind:
                description: Kind is the media kind stored under this root folder.
                enum:
                - movie
                - series
                - music
                - book
                - audiobook
                - comic
                type: string
                x-kubernetes-validations:
                - message: kind is immutable
                  rule: self == oldSelf
              minFreeBytes:
                default: 0
                description: |-
                  MinFreeBytes is the amount of free space that must remain for imports to
                  be allowed; 0 disables the check.
                format: int64
                minimum: 0
                type: integer
              naming:
                description: Naming controls the on-disk layout.
                properties:
                  colonReplacement:
                    default: smart
                    description: ColonReplacement says how colons in titles are rendered
                      on disk.
                    enum:
                    - delete
                    - dash
                    - spaceDash
                    - spaceDashSpace
                    - smart
                    type: string
                  dialect:
                    default: jellyfin
                    description: Dialect is the media-server layout convention to
                      follow.
                    enum:
                    - jellyfin
                    - plex
                    - emby
                    - kodi
                    type: string
                  multiEpisodeStyle:
                    default: prefixedRange
                    description: MultiEpisodeStyle says how multi-episode files are
                      named.
                    enum:
                    - extend
                    - duplicate
                    - repeat
                    - scene
                    - range
                    - prefixedRange
                    type: string
                  overrides:
                    additionalProperties:
                      type: string
                    description: |-
                      Overrides replaces individual naming tokens of the dialect. Recognised
                      keys are movieFolder, movieFile, seriesFolder, seasonFolder, episodeFile,
                      animeFile, dailyFile, artistFolder, albumFolder, trackFile, authorFolder,
                      bookFile, audiobookFolder, audiobookFile, comicFolder and issueFile.
                    maxProperties: 16
                    type: object
                type: object
              path:
                description: |-
                  Path is the absolute path of the root folder; it is immutable and must
                  live under /data/media/. It is a clean path: no "." or ".." segment
                  and no empty one ("//"), so "/data/media/../x" cannot pass the prefix
                  check and resolve outside the library.
                type: string
                x-kubernetes-validations:
                - message: path is immutable
                  rule: self == oldSelf
                - message: path must start with /data/media/
                  rule: self.startsWith('/data/media/')
                - message: 'path must be clean: no ''.'' or ''..'' segment and no
                    empty segment (''//'')'
                  rule: '!self.contains(''/../'') && !self.endsWith(''/..'') && !self.contains(''/./'')
                    && !self.endsWith(''/.'') && !self.contains(''//'')'
              permissions:
                description: Permissions is the ownership and mode applied to imported
                  files.
                properties:
                  dirMode:
                    default: "0775"
                    description: DirMode is the octal mode applied to created directories.
                    pattern: ^0[0-7]{3}$
                    type: string
                  fileMode:
                    default: "0664"
                    description: FileMode is the octal mode applied to imported files.
                    pattern: ^0[0-7]{3}$
                    type: string
                  group:
                    description: Group is the numeric GID imported files are chgrp'd
                      to.
                    format: int64
                    type: integer
                type: object
              recycleBin:
                description: RecycleBin configures the deletion grace period.
                properties:
                  cleanupDays:
                    default: 7
                    description: |-
                      CleanupDays is how long a recycled file is kept before it is removed;
                      0 disables the cleanup, keeping recycled files until removed by hand
                      (Sonarr's RecycleBinCleanupDays: RecycleBinProvider.Cleanup returns
                      early at 0). A pointer so a Go client can send that 0: with omitempty
                      it would be dropped and defaulted back to 7. Unset means 7; read it
                      through CleanupDaysOrDefault.
                    format: int32
                    minimum: 0
                    type: integer
                  path:
                    default: /data/.recycle
                    description: Path is where deleted files are moved.
                    type: string
                type: object
              scanSchedule:
                description: |-
                  ScanSchedule is a cron expression; importarr creates a LibraryScan per tick.
                  Empty means no periodic rescan.
                maxLength: 120
                type: string
            required:
            - kind
            - path
            type: object
          status:
            description: RootFolderStatus describes the observed state of RootFolder.
            properties:
              accessible:
                description: Accessible is true when the path exists and catalogarr
                  can write to it.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations
                  of the root folder's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              freeBytes:
                description: FreeBytes is the free space on the filesystem backing
                  the path.
                format: int64
                type: integer
              itemCount:
                description: ItemCount is the number of catalog items rooted here.
                format: int32
                type: integer
              lastScannedAt:
                description: LastScannedAt is when the folder was last walked.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              totalBytes:
                description: TotalBytes is the total size of the filesystem backing
                  the path.
                format: int64
                type: integer
              unmappedFolders:
                description: UnmappedFolders lists folders under the path with no
                  catalog item.
                items:
                  type: string
                maxItems: 200
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
