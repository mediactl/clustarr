---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: albums.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Album
    listKind: AlbumList
    plural: albums
    shortNames:
    - alb
    singular: album
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.artistRef
      name: Artist
      type: string
    - jsonPath: .status.metadata.title
      name: Title
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.trackFileCount
      name: Files
      type: integer
    - jsonPath: .status.quality.name
      name: Quality
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Album is one MusicBrainz release group owned by an Artist. Albums are named
          <artist>-<releasegroup-uid8>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlbumSpec defines the desired state of Album.
            properties:
              anyReleaseOk:
                default: true
                description: |-
                  AnyReleaseOk accepts a release of the group other than the selected one
                  when it is the best match.
                type: boolean
              artistRef:
                description: ArtistRef is the name of the owning Artist in the same
                  namespace.
                type: string
                x-kubernetes-validations:
                - message: artistRef is immutable
                  rule: self == oldSelf
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this album.
                type: boolean
              qualityProfileRef:
                description: QualityProfileRef overrides the Artist's QualityProfile.
                type: string
              releaseGroupID:
                description: |-
                  ReleaseGroupID is the MusicBrainz release-group MBID; it identifies the
                  album and is immutable.
                type: string
                x-kubernetes-validations:
                - message: releaseGroupID is immutable
                  rule: self == oldSelf
              releaseID:
                description: ReleaseID pins a specific MusicBrainz release of the
                  group.
                type: string
            required:
            - artistRef
            - releaseGroupID
            type: object
          status:
            description: AlbumStatus describes the observed state of Album.
            properties:
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this album.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the album's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffMet:
                description: CutoffMet is true when the imported tracks meet the profile
                  cutoff.
                type: boolean
              formatScore:
                description: FormatScore is the custom-format score of the imported
                  release.
                format: int32
                type: integer
              lastSearchedAt:
                description: LastSearchedAt is when the album was last searched for.
                format: date-time
                type: string
              metadata:
                description: Metadata is the cached provider metadata.
                properties:
                  albumType:
                    description: AlbumType is the MusicBrainz primary release-group
                      type.
                    type: string
                  disambiguation:
                    description: Disambiguation distinguishes same-named release groups.
                    type: string
                  images:
                    description: Images lists the cover art published by the provider.
                    items:
                      description: Image is one artwork URL published by a metadata
                        provider.
                      properties:
                        type:
                          description: Type classifies the image.
                          enum:
                          - poster
                          - fanart
                          - logo
                          type: string
                        url:
                          description: URL is where the image can be fetched.
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 50
                    type: array
                  overview:
                    description: Overview is the album description.
                    type: string
                  refreshedAt:
                    description: RefreshedAt is when the metadata was last fetched.
                    format: date-time
                    type: string
                  releaseDate:
                    description: ReleaseDate is the earliest release date of the release
                      group.
                    format: date-time
                    type: string
                  releases:
                    description: Releases lists the releases in the release group.
                    items:
                      description: ReleaseSummary is one MusicBrainz release of the
                        album's release group.
                      properties:
                        country:
                          description: Country is the ISO 3166-1 country the release
                            was issued in.
                          type: string
                        id:
                          description: ID is the MusicBrainz release MBID.
                          type: string
                        label:
                          description: Label is the issuing record label.
                          type: string
                        media:
                          description: Media lists the discs or sides making up the
                            release.
                          items:
                            description: Medium is one disc, tape or side of a MusicBrainz
                              release.
                            properties:
                              format:
                                description: Format is the medium format, e.g. CD,
                                  Vinyl or Digital Media.
                                type: string
                              number:
                                description: Number is the 1-based medium number.
                                format: int32
                                minimum: 1
                                type: integer
                            required:
                            - number
                            type: object
                          maxItems: 20
                          type: array
                        status:
                          description: Status is the MusicBrainz release status, e.g.
                            Official.
                          type: string
                        trackCount:
                          description: TrackCount is the total number of tracks across
                            all media.
                          format: int32
                          type: integer
                      required:
                      - id
                      type: object
                    maxItems: 50
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  secondaryTypes:
                    description: SecondaryTypes are the MusicBrainz secondary release-group
                      types.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  selectedReleaseID:
                    description: SelectedReleaseID is the release the tracks were
                      taken from.
                    type: string
                  title:
                    description: Title is the album title.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              path:
                description: Path is the resolved folder on disk.
                type: string
              pendingGrab:
                description: PendingGrab is a chosen release waiting out a DelayProfile
                  delay.
                properties:
                  grabAt:
                    description: GrabAt is when the delay expires and the grab will
                      be issued.
                    format: date-time
                    type: string
                  protocol:
                    description: Protocol is the transfer protocol of the pending
                      release.
                    enum:
                    - torrent
                    - usenet
                    type: string
                  releaseTitle:
                    description: ReleaseTitle is the raw title of the release that
                      will be grabbed.
                    type: string
                required:
                - grabAt
                - releaseTitle
                type: object
              phase:
                description: Phase is the coarse lifecycle state of the album.
                enum:
                - Wanted
                - Delayed
                - Downloading
                - Imported
                - CutoffUnmet
                - Unmonitored
                type: string
              quality:
                description: Quality is the lowest quality across the album's imported
                  tracks.
                properties:
                  modifier:
                    description: Modifier refines the quality (remux, screener, ...).
                    enum:
                    - none
                    - regional
                    - screener
                    - rawhd
                    - brdisk
                    - remux
                    type: string
                  name:
                    description: Name is the canonical quality definition name.
                    type: string
                  resolution:
                    description: Resolution is the vertical resolution in lines. Video
                      only.
                    enum:
                    - 0
                    - 360
                    - 480
                    - 540
                    - 576
                    - 720
                    - 1080
                    - 2160
                    format: int32
                    type: integer
                  source:
                    description: Source is the release source. Video only.
                    enum:
                    - unknown
                    - cam
                    - telesync
                    - telecine
                    - workprint
                    - dvd
                    - tv
                    - webdl
                    - webrip
                    - bluray
                    type: string
                required:
                - name
                type: object
              searchAttempts:
                description: SearchAttempts counts the searches made for this album.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
              trackFileCount:
                description: TrackFileCount is the number of tracks with an imported
                  file.
                format: int32
                type: integer
              tracks:
                description: |-
                  Tracks is the track listing of the selected release. Releases with more
                  than 200 tracks raise the Invalid condition instead of being truncated
                  silently.
                items:
                  description: Track is one recording on the selected release of an
                    album.
                  properties:
                    absoluteNumber:
                      description: AbsoluteNumber is the track number across the whole
                        release.
                      format: int32
                      type: integer
                    durationMs:
                      description: DurationMs is the track duration in milliseconds.
                      format: int32
                      minimum: 0
                      type: integer
                    explicit:
                      description: Explicit marks a track with an explicit-content
                        advisory.
                      type: boolean
                    fileRef:
                      description: FileRef is the name of the MediaFile holding this
                        track.
                      type: string
                    medium:
                      description: Medium is the 1-based medium the track sits on.
                      format: int32
                      type: integer
                    number:
                      description: Number is the track number within the medium.
                      format: int32
                      type: integer
                    recordingID:
                      description: RecordingID is the MusicBrainz recording MBID.
                      type: string
                    title:
                      description: Title is the track title.
                      type: string
                  required:
                  - recordingID
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - recordingID
                x-kubernetes-list-type: map
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.artistRef
    served: true
    storage: true
    subresources:
      status: {}
