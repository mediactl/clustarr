---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: indexerproxies.index.clustarr.io
spec:
  group: index.clustarr.io
  names:
    categories:
    - clustarr
    kind: IndexerProxy
    listKind: IndexerProxyList
    plural: indexerproxies
    shortNames:
    - idxproxy
    singular: indexerproxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IndexerProxy is an HTTP, SOCKS or FlareSolverr proxy that selected
          Indexers route their requests through.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IndexerProxySpec defines the desired state of IndexerProxy.
            properties:
              host:
                description: Host is the proxy hostname or IP address.
                type: string
              port:
                description: |-
                  Port is the proxy port. It is required and has no default: a proxy is
                  addressed as host:port, and the defensible values are per-type
                  (flaresolverr 8191, http 3128/8080/8888, socks 1080), so any one
                  default would probe an endpoint nobody configured and report it Ready.
                  Before this was +required the CRD accepted a portless proxy that the
                  controller then always refused as an invalid spec.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              requestTimeout:
                default: 60s
                description: |-
                  RequestTimeout is how long a request through the proxy may take. A Go
                  client always sends a Duration, so the prober floors a zero (or
                  negative) one to this default: a probe that may never return is never
                  meant.
                type: string
              secretRef:
                description: SecretRef names a Secret in the same namespace holding
                  proxy credentials.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              selector:
                description: |-
                  Selector matches the Indexers (by label) that use this proxy. An empty
                  selector matches no Indexer: a Go client always sends {}, so "{}
                  matches everything" would route a whole namespace. An Indexer's own
                  spec.proxyRef wins over any selector. At most one http, socks4 or
                  socks5 proxy and at most one FlareSolverr may apply to an Indexer, and
                  the FlareSolverr is applied last; anything more, or a FlareSolverr
                  beside a proxy with credentials, fails closed (indexarr/proxy).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              type:
                description: Type is the kind of proxy.
                enum:
                - flaresolverr
                - http
                - socks4
                - socks5
                type: string
            required:
            - host
            - port
            - type
            type: object
          status:
            description: IndexerProxyStatus defines the observed state of IndexerProxy.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the proxy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastCheckedAt:
                description: LastCheckedAt is when the proxy was last probed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              version:
                description: Version is the proxy software version reported on the
                  last probe.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
