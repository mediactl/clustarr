---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: downloadclients.download.clustarr.io
spec:
  group: download.clustarr.io
  names:
    categories:
    - clustarr
    kind: DownloadClient
    listKind: DownloadClientList
    plural: downloadclients
    shortNames:
    - dlclient
    singular: downloadclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.engine.readyReplicas
      name: Replicas
      type: integer
    - jsonPath: .status.active
      name: Active
      type: integer
    - jsonPath: .status.queued
      name: Queued
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DownloadClient is a torrent or usenet download engine managed by grabarr.
          The controller owns a StatefulSet of spec.replicas engine pods; Downloads
          are assigned to this client and pinned to one of its ordinals.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DownloadClientSpec defines the desired state of DownloadClient. Exactly one
              of torrent or usenet is set, selected by protocol.
            properties:
              categories:
                additionalProperties:
                  type: string
                description: |-
                  Categories maps a media kind to the subdirectory downloads of that kind
                  are written to. A kind with no entry uses the kind's own name.
                type: object
              enabled:
                default: true
                description: |-
                  Enabled turns the client off without deleting it. A disabled client keeps
                  its engine running for in-flight work but is not assigned new Downloads.
                type: boolean
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector constrains the engine replicas to matching
                  nodes.
                type: object
              priority:
                default: 1
                description: |-
                  Priority orders clients of the same protocol when grabarr picks one for a
                  Download; lower wins.
                format: int32
                maximum: 50
                minimum: 1
                type: integer
              protocol:
                description: |-
                  Protocol selects which engine this client runs. It is immutable: change
                  the protocol by creating a new DownloadClient.
                enum:
                - torrent
                - usenet
                type: string
                x-kubernetes-validations:
                - message: protocol is immutable
                  rule: self == oldSelf
              replicas:
                default: 1
                description: |-
                  Replicas is the number of engine shards, backing a StatefulSet owned by
                  this client. Each Download is pinned to one ordinal for its lifetime; see
                  Download.status.engine. Usenet clients are limited to one replica in
                  v1alpha1.
                format: int32
                maximum: 64
                minimum: 1
                type: integer
              resources:
                description: Resources is the resource requirements of each engine
                  replica.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tolerations:
                description: Tolerations are applied to the engine replicas.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                maxItems: 32
                type: array
              torrent:
                description: Torrent configures the torrent engine. Required when
                  protocol is torrent.
                properties:
                  downloadLimitBps:
                    description: |-
                      DownloadLimitBps caps the aggregate download rate in bytes per second.
                      Zero or unset means unlimited.
                    format: int64
                    minimum: 0
                    type: integer
                  enableDHT:
                    default: true
                    description: EnableDHT joins the distributed hash table for peer
                      discovery.
                    type: boolean
                  enablePEX:
                    default: true
                    description: EnablePEX enables peer exchange with connected peers.
                    type: boolean
                  listenPort:
                    default: 42069
                    description: ListenPort is the TCP/uTP port the engine listens
                      on for peers.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  maxActive:
                    default: 200
                    description: MaxActive caps how many torrents may transfer at
                      once per replica.
                    format: int32
                    minimum: 1
                    type: integer
                  maxUnverifiedBytes:
                    default: 134217728
                    description: |-
                      MaxUnverifiedBytes caps how many downloaded-but-unhashed bytes the engine
                      keeps in flight before it stops requesting more pieces.
                    format: int64
                    minimum: 0
                    type: integer
                  publicIP:
                    description: |-
                      PublicIP is the address advertised to peers and trackers when the engine
                      cannot discover it, e.g. behind NAT or a gateway. Unset means autodetect.
                    type: string
                  removeCompleted:
                    default: true
                    description: |-
                      RemoveCompleted removes a torrent from the engine once it has been
                      imported and its seed goal is met: Sonarr's and Radarr's "Remove
                      Completed" download-client setting. It combines with each Download's
                      spec.removeOnImport, and a torrent is removed only when both are true;
                      false keeps every imported torrent on the engine, uploading nothing
                      once its goal is met. The engine reads it on every reconcile.
                    type: boolean
                  seed:
                    default:
                      inactiveTime: 24h
                      packSeedTime: 336h
                      ratio: "1"
                      seedTime: 168h
                    description: |-
                      Seed is the default seed goal for torrents on this client. A Download may
                      override it with its own spec.seedCriteria.
                    properties:
                      inactiveTime:
                        description: |-
                          InactiveTime is how long a completed torrent may seed without uploading before its seed
                          goal counts as met, measured from the later of completion and the last upload
                          (qBittorrent's inactive seeding time limit). Like Ratio and SeedTime, reaching it alone
                          meets the goal. It is not a stall timeout: an incomplete torrent that receives no data
                          fails on the DownloadClient's torrent.stallTimeout instead.
                        type: string
                      packSeedTime:
                        description: PackSeedTime is how long a pack (season, discography)
                          torrent must seed before removal.
                        type: string
                      ratio:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Ratio is the upload/download ratio to reach before the torrent may be removed,
                          written as a decimal string such as "2.0". Quantity is used instead of a float
                          so the value round-trips exactly across API clients.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      seedTime:
                        description: SeedTime is how long a single-item torrent must
                          seed before removal.
                        type: string
                    type: object
                  stallTimeout:
                    default: 24h
                    description: |-
                      StallTimeout is how long an unfinished, unpaused torrent may go without
                      downloading a byte before the engine fails it as stalled -- which
                      blocklists the release, so the redownload search looks elsewhere. It
                      is qBittorrent's stalledDL state ("no data is being received"; Sonarr
                      reports it as a Warning, "The download is stalled with no
                      connections") held for the whole window, and it covers a magnet whose
                      metadata never arrives. The clock restarts when the engine re-attaches
                      the torrent and when it is resumed, so neither a restart nor a pause is
                      counted against it. "0s" disables stall detection. The engine reads it
                      at start, so a change rolls the engine pods: their template carries a
                      hash of every setting read at start.
                    type: string
                  uploadLimitBps:
                    description: |-
                      UploadLimitBps caps the aggregate upload rate in bytes per second.
                      Zero or unset means unlimited.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              usenet:
                description: Usenet configures the NNTP engine. Required when protocol
                  is usenet.
                properties:
                  abortHealthPercent:
                    default: 90
                    description: |-
                      AbortHealthPercent is the article-health floor, as a whole percentage.
                      A download whose projected health falls below it triggers healthAction.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  downloadTimeout:
                    description: |-
                      DownloadTimeout is how long a usenet download may take, from when it
                      was first added -- propagation wait, transfer, repair and unpack all
                      count, and so does time spent paused -- before the engine fails it
                      with reason timeout, which blocklists the release. Unset or "0s" means
                      no deadline, which is the default: neither SABnzbd nor NZBGet bounds a
                      whole job. The engine reads it at start, so a change rolls the engine
                      pod: its template carries a hash of every setting read at start.
                    type: string
                  healthAction:
                    default: pause
                    description: |-
                      HealthAction is what happens when abortHealthPercent, or the NZB's own
                      par2 critical health, is breached -- during the transfer or at the
                      pre-check. See HealthActionPause and HealthActionDelete.
                    enum:
                    - pause
                    - delete
                    type: string
                  postProcess:
                    description: PostProcess controls par2 repair, unpacking and cleanup.
                    properties:
                      cleanupPatterns:
                        description: |-
                          CleanupPatterns lists glob patterns of junk files removed after unpack,
                          e.g. "*.nfo", "*sample*".
                        items:
                          type: string
                        maxItems: 64
                        type: array
                      deleteArchives:
                        default: true
                        description: |-
                          DeleteArchives removes the source archives and par2 volumes after a
                          successful unpack.
                        type: boolean
                      par2:
                        default: true
                        description: |-
                          Par2 repairs the download from its par2 recovery volumes when articles
                          are missing or corrupt.
                        type: boolean
                      unpack:
                        default: true
                        description: Unpack extracts rar/7z/zip archives after a successful
                          repair.
                        type: boolean
                    type: object
                  preCheck:
                    description: |-
                      PreCheck verifies that the first articles of an NZB exist before the
                      engine commits to the download.
                    type: boolean
                  propagationDelay:
                    description: |-
                      PropagationDelay is how long after a release is published the engine
                      waits before starting it, so articles have time to propagate.
                    type: string
                  providers:
                    description: |-
                      Providers lists the NNTP servers the engine may use. At least one
                      non-backup provider is required.
                    items:
                      description: |-
                        NNTPProvider is one upstream usenet server. Providers are tried in priority
                        order; backup providers are only used to repair missing articles.
                      properties:
                        backup:
                          description: |-
                            Backup marks the provider as fill-only: it is used to fetch articles the
                            primary providers could not supply, never for the bulk of a download.
                          type: boolean
                        connections:
                          default: 8
                          description: |-
                            Connections is the maximum number of simultaneous connections allowed by
                            the provider's plan.
                          format: int32
                          maximum: 256
                          minimum: 1
                          type: integer
                        host:
                          description: Host is the NNTP server hostname.
                          minLength: 1
                          type: string
                        name:
                          description: Name identifies the provider within this client
                            and keys the list.
                          maxLength: 63
                          minLength: 1
                          type: string
                        port:
                          default: 563
                          description: Port is the NNTP port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        priority:
                          default: 1
                          description: Priority orders providers of the same class;
                            lower wins.
                          format: int32
                          maximum: 50
                          minimum: 1
                          type: integer
                        quotaBytes:
                          description: |-
                            QuotaBytes is the monthly transfer allowance of the provider's plan.
                            Unset means unmetered.
                          format: int64
                          minimum: 0
                          type: integer
                        secretRef:
                          description: |-
                            SecretRef names a Secret in the same namespace holding the provider
                            credentials. Recognised keys: username, password. The engine reads it
                            at start, so a change to its data restarts the engine at the
                            controller's next periodic reconcile, within five minutes. grabarr
                            reads the Secret by name and does not watch Secrets, which would take
                            list and watch on every Secret in its scope.
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                        tls:
                          default: true
                          description: TLS enables implicit TLS on the connection.
                          type: boolean
                      required:
                      - host
                      - name
                      - secretRef
                      type: object
                    maxItems: 32
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  publishDir:
                    description: |-
                      PublishDir is where finished content is published, as
                      <publishDir>/<category>/<name>; unset means the root of the engine's
                      data mount. It must be an absolute path under the data mount (the
                      controller refuses one that is not), for example
                      "/data/usenet/complete", so the importer, which mounts the same
                      volume, can read and hard-link it.
                    maxLength: 4096
                    pattern: ^/
                    type: string
                  scratch:
                    description: Scratch places and sizes the per-replica working
                      area.
                    properties:
                      accessModes:
                        description: |-
                          AccessModes of the claim the controller creates. Empty means
                          ReadWriteOnce.
                        items:
                          type: string
                        maxItems: 3
                        type: array
                      existingClaim:
                        description: |-
                          ExistingClaim mounts this PersistentVolumeClaim, in the same
                          namespace, as the scratch volume as it is. The controller creates
                          nothing and sizeLimit does not apply.
                        maxLength: 253
                        type: string
                      path:
                        description: |-
                          Path uses this directory on the engine's shared data volume as the
                          working area instead of mounting a scratch volume at all, for example
                          "/data/usenet/incomplete". It must be an absolute path under the data
                          mount (the controller refuses one that is not), and it must be on the
                          same filesystem as publishDir so publishing is one atomic rename.
                          Transfers, their manifests and checkpoints then survive a pod restart
                          and resume, at the cost of doing assembly and repair over that volume.
                        maxLength: 4096
                        pattern: ^/
                        type: string
                      sizeLimit:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 50Gi
                        description: |-
                          SizeLimit is the capacity of the scratch volume. A Go client always
                          sends a Quantity, so the DownloadClient controller floors a zero one to
                          this default: a zero-byte scratch volume has no coherent meaning.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          StorageClassName selects the StorageClass of the claim the controller
                          creates for the scratch volume. Unset, with no other placement, means
                          an emptyDir backed by node storage is used instead of a PVC.
                        type: string
                      volumeName:
                        description: |-
                          VolumeName binds the claim the controller creates to this existing
                          PersistentVolume (static binding), for example an NFS volume already
                          provisioned by hand. Set accessModes to ReadWriteMany for such a
                          volume. Without storageClassName the claim asks for no class, so no
                          dynamic provisioner competes for it.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: scratch.path excludes existingClaim, storageClassName
                        and volumeName
                      rule: '!has(self.path) || (!has(self.existingClaim) && !has(self.storageClassName)
                        && !has(self.volumeName))'
                    - message: scratch.existingClaim excludes storageClassName and
                        volumeName
                      rule: '!has(self.existingClaim) || (!has(self.storageClassName)
                        && !has(self.volumeName))'
                required:
                - providers
                type: object
            required:
            - protocol
            type: object
            x-kubernetes-validations:
            - message: torrent must be set for protocol torrent and usenet for protocol
                usenet, never both
              rule: 'self.protocol == ''torrent'' ? (has(self.torrent) && !has(self.usenet))
                : (has(self.usenet) && !has(self.torrent))'
            - message: usenet clients must have replicas == 1 in v1alpha1
              rule: self.protocol != 'usenet' || !has(self.replicas) || self.replicas
                == 1
          status:
            description: DownloadClientStatus defines the observed state of DownloadClient.
            properties:
              active:
                description: Active is the number of Downloads currently transferring
                  on this client.
                format: int32
                type: integer
              conditions:
                description: Conditions holds Ready, EngineReady and DiskSpaceOK.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              downloadRateBps:
                description: DownloadRateBps is the aggregate download rate in bytes
                  per second.
                format: int64
                type: integer
              engine:
                description: Engine reports the StatefulSet backing this client.
                properties:
                  readyReplicas:
                    description: ReadyReplicas is the number of engine replicas that
                      are ready.
                    format: int32
                    type: integer
                  replicas:
                    description: Replicas is the number of engine replicas that currently
                      exist.
                    format: int32
                    type: integer
                  workloadRef:
                    description: |-
                      WorkloadRef is the name of the StatefulSet running the engine, in the
                      same namespace as the DownloadClient.
                    type: string
                type: object
              freeBytes:
                description: FreeBytes is the free space remaining on the client's
                  download volume.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              queued:
                description: |-
                  Queued is the number of Downloads assigned to this client but not yet
                  transferring.
                format: int32
                type: integer
              seeding:
                description: Seeding is the number of Downloads seeding on this client.
                  Torrent only.
                format: int32
                type: integer
              uploadRateBps:
                description: UploadRateBps is the aggregate upload rate in bytes per
                  second.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
