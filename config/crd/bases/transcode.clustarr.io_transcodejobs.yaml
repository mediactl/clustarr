---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: transcodejobs.transcode.clustarr.io
spec:
  group: transcode.clustarr.io
  names:
    categories:
    - clustarr
    kind: TranscodeJob
    listKind: TranscodeJobList
    plural: transcodejobs
    singular: transcodejob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.mediaFileRef
      name: MediaFile
      type: string
    - jsonPath: .spec.profileRef
      name: Profile
      type: string
    - jsonPath: .status.plan.mode
      name: Mode
      priority: 1
      type: string
    - jsonPath: .status.progress.percent
      name: Progress
      type: number
    - jsonPath: .status.attempts
      name: Attempts
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TranscodeJob is one transcode of a MediaFile against a TranscodeProfile.
          It is owned by the MediaFile and named <mediafile>-<profileHash[:8]>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TranscodeJobSpec defines the desired state of TranscodeJob.
            properties:
              hardware:
                description: Hardware overrides the profile's encoder backend.
                enum:
                - cpu
                - nvidia
                - intel
                type: string
              mediaFileRef:
                description: MediaFileRef is the name of the MediaFile (same namespace)
                  being transcoded.
                type: string
                x-kubernetes-validations:
                - message: mediaFileRef is immutable
                  rule: self == oldSelf
              outputPath:
                description: |-
                  OutputPath is where the output is written. Defaults to <stem>.mkv
                  beside the source.
                type: string
              priority:
                description: Priority orders jobs; higher runs first.
                format: int32
                type: integer
              profileRef:
                description: ProfileRef is the name of the cluster-scoped TranscodeProfile
                  to apply.
                type: string
                x-kubernetes-validations:
                - message: profileRef is immutable
                  rule: self == oldSelf
              sourcePath:
                description: SourcePath is the path of the source file.
                type: string
                x-kubernetes-validations:
                - message: sourcePath is immutable
                  rule: self == oldSelf
              sourceProbeHash:
                description: SourceProbeHash is the hash of the source probe the job
                  was planned from.
                type: string
                x-kubernetes-validations:
                - message: sourceProbeHash is immutable
                  rule: self == oldSelf
              suspend:
                description: Suspend pauses the job (user pause).
                type: boolean
            required:
            - mediaFileRef
            - profileRef
            - sourcePath
            type: object
          status:
            description: |-
              TranscodeJobStatus defines the observed state of TranscodeJob. The
              controller (squasharr) owns phase, plan, jobRef, attempts, timestamps,
              message and conditions; the worker (squasharr-worker) owns progress, result
              and stderrTail via server-side apply with a disjoint field set.
            properties:
              attempts:
                description: Attempts is the number of encode attempts so far.
                format: int32
                type: integer
              conditions:
                description: Conditions holds Planned, JobCreated, Verified, Succeeded
                  and Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is when the encode finished.
                format: date-time
                type: string
              jobRef:
                description: JobRef is the name of the batch Job running the encode.
                type: string
              message:
                description: Message is a human-readable summary of the current state.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle phase.
                enum:
                - Pending
                - Planned
                - Queued
                - Running
                - Verifying
                - Succeeded
                - Failed
                - Skipped
                type: string
              plan:
                description: Plan is the planner's rendered decision.
                properties:
                  argsHash:
                    description: ArgsHash is a hash of the rendered arguments.
                    type: string
                  audioTracks:
                    description: AudioTracks is the per-track audio plan.
                    items:
                      description: AudioPlan is the planner's decision for one source
                        audio track.
                      properties:
                        action:
                          description: Action says whether the track is encoded, copied
                            or dropped.
                          enum:
                          - encode
                          - copy
                          - drop
                          type: string
                        bitrateKbps:
                          description: BitrateKbps is the output bitrate for encoded
                            tracks.
                          format: int32
                          type: integer
                        codec:
                          description: Codec is the output codec for encoded tracks.
                          type: string
                        default:
                          description: Default marks the output default audio track.
                          type: boolean
                        sourceIndex:
                          description: SourceIndex is the source stream index.
                          format: int32
                          type: integer
                      type: object
                    maxItems: 200
                    type: array
                  encoder:
                    description: Encoder is the ffmpeg encoder selected (for example
                      libx265, hevc_nvenc).
                    type: string
                  hdrMode:
                    description: HDRMode is the HDR handling chosen for this source.
                    type: string
                  mode:
                    description: Mode says whether the job transcodes, only remuxes,
                      or is skipped.
                    enum:
                    - transcode
                    - remuxOnly
                    - skip
                    type: string
                  skipReason:
                    description: SkipReason explains a skip decision.
                    type: string
                  subtitleTracks:
                    description: SubtitleTracks lists the source subtitle stream indexes
                      to copy.
                    items:
                      format: int32
                      type: integer
                    maxItems: 200
                    type: array
                  videoArgs:
                    description: VideoArgs are the rendered ffmpeg video arguments.
                    items:
                      type: string
                    maxItems: 200
                    type: array
                type: object
              progress:
                description: Progress is the worker-reported encode progress.
                properties:
                  bitrateKbps:
                    description: BitrateKbps is the current output bitrate in whole
                      kilobits per second.
                    format: int32
                    minimum: 0
                    type: integer
                  fpsMilli:
                    description: FPSMilli is the current encode rate in thousandths
                      of a frame per second.
                    format: int32
                    minimum: 0
                    type: integer
                  frame:
                    description: Frame is the last encoded frame number.
                    format: int64
                    type: integer
                  outTimeMillis:
                    description: OutTimeMillis is the output timestamp reached so
                      far, in milliseconds.
                    format: int64
                    minimum: 0
                    type: integer
                  percent:
                    description: Percent is the completed percentage of the encode,
                      0-100.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  speedMilli:
                    description: |-
                      SpeedMilli is the encode speed relative to real time, in thousandths,
                      so 1.5x real time is 1500.
                    format: int32
                    minimum: 0
                    type: integer
                  updatedAt:
                    description: UpdatedAt is when this progress was reported.
                    format: date-time
                    type: string
                type: object
              result:
                description: Result is the worker-reported final outcome.
                properties:
                  mediaInfo:
                    description: MediaInfo is the probe of the output file.
                    properties:
                      attachments:
                        description: Attachments is the number of attachment streams
                          (fonts, cover art).
                        format: int32
                        type: integer
                      audio:
                        description: Audio lists the audio tracks.
                        items:
                          description: AudioStream describes one audio track of a
                            media file.
                          properties:
                            bitrateKbps:
                              description: BitrateKbps is the track bitrate in kilobits
                                per second.
                              format: int32
                              type: integer
                            channels:
                              description: Channels is the channel count (2 = stereo,
                                6 = 5.1, 8 = 7.1).
                              format: int32
                              type: integer
                            codec:
                              description: Codec is the audio codec name, e.g. aac,
                                eac3, truehd, flac.
                              type: string
                            commentary:
                              description: Commentary is true when the track is a
                                commentary track.
                              type: boolean
                            default:
                              description: Default is true when the container flags
                                this as the default audio track.
                              type: boolean
                            index:
                              description: Index is the zero-based stream index inside
                                the container.
                              format: int32
                              type: integer
                            language:
                              description: Language is the ISO 639 language tag of
                                the track.
                              type: string
                            profile:
                              description: Profile is the codec profile, if any, e.g.
                                Atmos or DTS-HD MA.
                              type: string
                            title:
                              description: Title is the track title from the container
                                metadata.
                              type: string
                          type: object
                        maxItems: 64
                        type: array
                      chapters:
                        description: Chapters is the number of chapters.
                        format: int32
                        type: integer
                      container:
                        description: Container is the container format, e.g. mkv,
                          mp4, flac, epub.
                        type: string
                      doviBLCompatID:
                        description: DoviBLCompatID is the Dolby Vision base-layer
                          compatibility ID, when present.
                        format: int32
                        type: integer
                      doviProfile:
                        description: DoviProfile is the Dolby Vision profile number,
                          when present.
                        format: int32
                        type: integer
                      fpsMilli:
                        description: |-
                          FpsMilli is the video frame rate in thousandths of a frame per second,
                          so 23.976 fps is 23976. Scaled integers are used instead of floats because
                          CRD schemas discourage floating-point values.
                        format: int32
                        minimum: 0
                        type: integer
                      hdr:
                        description: Hdr is the HDR format of the video stream.
                        enum:
                        - none
                        - pq10
                        - hdr10
                        - hdr10plus
                        - hlg10
                        - dolbyVision
                        - dolbyVisionHdr10
                        - dolbyVisionSdr
                        - dolbyVisionHlg
                        - dolbyVisionHdr10Plus
                        type: string
                      height:
                        description: Height is the video frame height in pixels.
                        format: int32
                        type: integer
                      pixelFormat:
                        description: PixelFormat is the pixel format, e.g. yuv420p10le.
                        type: string
                      runtimeMillis:
                        description: RuntimeMillis is the total duration of the file
                          in milliseconds.
                        format: int64
                        minimum: 0
                        type: integer
                      subtitles:
                        description: Subtitles lists the embedded subtitle tracks.
                        items:
                          description: SubtitleStream describes one subtitle track
                            of a media file.
                          properties:
                            bitmap:
                              description: Bitmap is true for image-based subtitles
                                (PGS, VobSub) as opposed to text.
                              type: boolean
                            codec:
                              description: Codec is the subtitle codec name, e.g.
                                subrip, ass, hdmv_pgs_subtitle.
                              type: string
                            forced:
                              description: Forced is true when the track is flagged
                                as forced.
                              type: boolean
                            hearingImpaired:
                              description: HearingImpaired is true when the track
                                is flagged as SDH / hearing impaired.
                              type: boolean
                            index:
                              description: Index is the zero-based stream index inside
                                the container.
                              format: int32
                              type: integer
                            language:
                              description: Language is the ISO 639 language tag of
                                the track.
                              type: string
                            title:
                              description: Title is the track title from the container
                                metadata.
                              type: string
                          type: object
                        maxItems: 64
                        type: array
                      videoBitDepth:
                        description: VideoBitDepth is the video bit depth (8, 10,
                          12).
                        format: int32
                        type: integer
                      videoBitrateKbps:
                        description: VideoBitrateKbps is the video bitrate in kilobits
                          per second.
                        format: int32
                        type: integer
                      videoCodec:
                        description: VideoCodec is the video codec name, e.g. h264,
                          hevc, av1.
                        type: string
                      videoProfile:
                        description: VideoProfile is the video codec profile, e.g.
                          Main 10.
                        type: string
                      width:
                        description: Width is the video frame width in pixels.
                        format: int32
                        type: integer
                    type: object
                  outputPath:
                    description: OutputPath is where the output was written.
                    type: string
                  outputSizeBytes:
                    description: OutputSizeBytes is the output file size.
                    format: int64
                    type: integer
                  outputToSourcePercent:
                    description: |-
                      OutputToSourcePercent is the output size as a percentage of the source size,
                      so an output 45% the size of its source is 45.
                    format: int32
                    minimum: 0
                    type: integer
                  vmafCentis:
                    description: VMAFCentis is the measured VMAF score in hundredths,
                      so 95.42 is 9542.
                    format: int32
                    maximum: 10000
                    minimum: 0
                    type: integer
                type: object
              startedAt:
                description: StartedAt is when the encode started.
                format: date-time
                type: string
              stderrTail:
                description: StderrTail is the tail of the encoder's stderr, at most
                  4 KiB.
                maxLength: 4096
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
