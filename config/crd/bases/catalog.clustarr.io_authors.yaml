---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: authors.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Author
    listKind: AuthorList
    plural: authors
    shortNames:
    - auth
    singular: author
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.name
      name: Name
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.bookCount
      name: Books
      type: integer
    - jsonPath: .status.bookFileCount
      name: Files
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Author is a monitored book author in the catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AuthorSpec defines the desired state of Author.
            properties:
              addOptions:
                description: AddOptions are applied once, when the author is first
                  reconciled.
                properties:
                  monitor:
                    default: all
                    description: Monitor selects which books start out monitored.
                    enum:
                    - all
                    - future
                    - missing
                    - existing
                    - none
                    type: string
                  searchForMissing:
                    description: SearchForMissing searches for missing books on add.
                    type: boolean
                type: object
              artwork:
                description: Artwork overrides the provider's image for a type. One
                  entry per type.
                items:
                  description: |-
                    ArtworkOverride pins a custom URL for one image type, replacing whatever
                    the metadata provider published for it. R3: a URL that fails to fetch
                    never falls back to the provider image -- the entry and object stay as
                    they were, and an Event says why.
                  properties:
                    type:
                      description: Type classifies the image being overridden.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the replacement image is fetched from.
                      maxLength: 2048
                      pattern: ^https?://
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              delayProfileRef:
                description: DelayProfileRef pins a DelayProfile; unset falls back
                  to tag matching.
                type: string
              folder:
                description: Folder overrides the folder name under the root folder.
                type: string
              hardcoverID:
                description: HardcoverID is the Hardcover author ID, when the author
                  is crosswalked.
                type: string
              metadataProfile:
                description: MetadataProfile filters which works become Books.
                properties:
                  allowedLanguages:
                    description: AllowedLanguages restricts works to these BCP-47
                      languages.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  minPages:
                    description: MinPages is the lowest page count a work may have.
                    format: int32
                    minimum: 0
                    type: integer
                  minPopularity:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MinPopularity is the lowest provider popularity score a work may have,
                      written as a decimal quantity such as "0.5" rather than a float, which
                      CRD schemas do not allow.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  skipMissingDate:
                    description: SkipMissingDate drops works with no release date.
                    type: boolean
                  skipMissingISBN:
                    description: SkipMissingISBN drops works with no edition carrying
                      an ISBN.
                    type: boolean
                  skipPartsAndSets:
                    description: SkipPartsAndSets drops box sets and part-of-a-volume
                      entries.
                    type: boolean
                  skipSeriesSecondary:
                    description: SkipSeriesSecondary drops works that are only secondary
                      entries in a series.
                    type: boolean
                type: object
              monitorNewItems:
                default: all
                description: |-
                  MonitorNewItems says what happens to books discovered after the author
                  was added.
                enum:
                - all
                - none
                type: string
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this author.
                type: boolean
              openLibraryID:
                description: |-
                  OpenLibraryID is the Open Library author key, e.g. "OL23919A"; it
                  identifies the author and is immutable.
                pattern: ^OL[0-9]+A$
                type: string
                x-kubernetes-validations:
                - message: openLibraryID is immutable
                  rule: self == oldSelf
              qualityProfileRef:
                description: QualityProfileRef is the QualityProfile books are ranked
                  against.
                type: string
              rootFolderRef:
                description: RootFolderRef is the RootFolder the author is stored
                  under.
                type: string
              source:
                description: Source records the ImportList that added the author,
                  if any.
                properties:
                  importListRef:
                    description: |-
                      ImportListRef is the name of the ImportList that added the item. Empty
                      means the item was added manually.
                    type: string
                type: object
              tags:
                description: Tags select DelayProfiles and other tag-matched policy.
                items:
                  type: string
                maxItems: 64
                type: array
            required:
            - openLibraryID
            - qualityProfileRef
            - rootFolderRef
            type: object
          status:
            description: AuthorStatus describes the observed state of Author.
            properties:
              addOptionsApplied:
                description: AddOptionsApplied is true once spec.addOptions has been
                  acted on.
                type: boolean
              artwork:
                description: |-
                  Artwork lists the images fetched into the artwork store, one per type.
                  Written by the metadata gateway.
                items:
                  description: |-
                    ArtworkEntry records one artwork image fetched into the artwork store,
                    whether from the provider or from a spec.artwork override. Written by the
                    metadata gateway under the manager that already writes status.metadata.
                  properties:
                    digest:
                      description: Digest is the hex SHA-256 of the stored original
                        image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size in bytes of the stored original
                        image.
                      format: int64
                      type: integer
                    source:
                      description: |-
                        Source is whether this image came from the provider or a spec.artwork
                        override.
                      enum:
                      - provider
                      - custom
                      type: string
                    sourceURL:
                      description: SourceURL is the URL the image was fetched from.
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    updatedAt:
                      description: UpdatedAt is when the image was last fetched.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - sizeBytes
                  - source
                  - sourceURL
                  - type
                  - updatedAt
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              bookCount:
                description: BookCount is the number of Book objects owned by the
                  author.
                format: int32
                type: integer
              bookFileCount:
                description: BookFileCount is the number of books with an imported
                  file.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the author's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              metadata:
                description: Metadata is the cached provider metadata.
                properties:
                  disambiguation:
                    description: Disambiguation distinguishes same-named authors.
                    type: string
                  externalIDs:
                    additionalProperties:
                      type: string
                    description: ExternalIDs maps provider names (openlibrary, hardcover,
                      ...) to their IDs.
                    type: object
                  genres:
                    description: Genres lists the genres the author writes in.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                  images:
                    description: Images lists the artwork published by the provider.
                    items:
                      description: Image is one artwork URL published by a metadata
                        provider.
                      properties:
                        type:
                          description: Type classifies the image.
                          enum:
                          - poster
                          - fanart
                          - banner
                          - logo
                          - clearart
                          - thumb
                          - screenshot
                          - disc
                          - headshot
                          type: string
                        url:
                          description: URL is where the image can be fetched.
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 50
                    type: array
                  name:
                    description: Name is the author name.
                    type: string
                  overview:
                    description: Overview is the author biography.
                    type: string
                  refreshedAt:
                    description: RefreshedAt is when the metadata was last fetched.
                    format: date-time
                    type: string
                  sortName:
                    description: SortName is the name used for sorting.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              path:
                description: Path is the resolved folder on disk.
                type: string
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.openLibraryID
    served: true
    storage: true
    subresources:
      status: {}
