---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: books.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Book
    listKind: BookList
    plural: books
    shortNames:
    - bk
    singular: book
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.title
      name: Title
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.hasFile
      name: File
      type: boolean
    - jsonPath: .status.fileFormat
      name: Format
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Book is one Open Library work, owned by an Author or standalone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BookSpec defines the desired state of Book.
            properties:
              anyEditionOk:
                default: true
                description: |-
                  AnyEditionOk accepts an edition other than the pinned one when it is the
                  best match.
                type: boolean
              artwork:
                description: Artwork overrides the provider's image for a type. One
                  entry per type.
                items:
                  description: |-
                    ArtworkOverride pins a custom URL for one image type, replacing whatever
                    the metadata provider published for it. R3: a URL that fails to fetch
                    never falls back to the provider image -- the entry and object stay as
                    they were, and an Event says why.
                  properties:
                    type:
                      description: Type classifies the image being overridden.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the replacement image is fetched from.
                      maxLength: 2048
                      pattern: ^https?://
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              authorRef:
                description: AuthorRef is the name of the owning Author; unset makes
                  the book standalone.
                type: string
              editionID:
                description: EditionID pins a specific Open Library edition.
                type: string
              editions:
                description: Editions overrides monitoring per edition.
                items:
                  description: EditionSpec overrides monitoring for one Open Library
                    edition.
                  properties:
                    id:
                      description: ID is the Open Library edition key, e.g. "OL7353617M".
                      type: string
                    monitored:
                      default: true
                      description: Monitored enables automatic searching for this
                        edition.
                      type: boolean
                  required:
                  - id
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this book.
                type: boolean
              qualityProfileRef:
                description: QualityProfileRef overrides the Author's QualityProfile.
                type: string
              rootFolderRef:
                description: RootFolderRef overrides the Author's RootFolder.
                type: string
              workID:
                description: |-
                  WorkID is the Open Library work key, e.g. "OL45883W"; it identifies the
                  book and is immutable.
                pattern: ^OL[0-9]+W$
                type: string
                x-kubernetes-validations:
                - message: workID is immutable
                  rule: self == oldSelf
            required:
            - workID
            type: object
          status:
            description: BookStatus describes the observed state of Book.
            properties:
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this book.
                type: string
              artwork:
                description: |-
                  Artwork lists the images fetched into the artwork store, one per type.
                  Written by the metadata gateway.
                items:
                  description: |-
                    ArtworkEntry records one artwork image fetched into the artwork store,
                    whether from the provider or from a spec.artwork override. Written by the
                    metadata gateway under the manager that already writes status.metadata.
                  properties:
                    digest:
                      description: Digest is the hex SHA-256 of the stored original
                        image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size in bytes of the stored original
                        image.
                      format: int64
                      type: integer
                    source:
                      description: |-
                        Source is whether this image came from the provider or a spec.artwork
                        override.
                      enum:
                      - provider
                      - custom
                      type: string
                    sourceURL:
                      description: SourceURL is the URL the image was fetched from.
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    updatedAt:
                      description: UpdatedAt is when the image was last fetched.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - sizeBytes
                  - source
                  - sourceURL
                  - type
                  - updatedAt
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                  of the book's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffMet:
                description: CutoffMet is true when the imported file meets the profile
                  cutoff.
                type: boolean
              fileFormat:
                description: FileFormat is the format of the imported file, e.g. EPUB
                  or AZW3.
                type: string
              fileRef:
                description: FileRef is the name of the MediaFile backing the book.
                type: string
              hasFile:
                description: HasFile is true while a MediaFile backs the book.
                type: boolean
              lastSearchedAt:
                description: LastSearchedAt is when the book was last searched for.
                format: date-time
                type: string
              metadata:
                description: Metadata is the cached provider metadata.
                properties:
                  editions:
                    description: Editions lists the known editions of the work.
                    items:
                      description: Edition is one published edition of a work.
                      properties:
                        asin:
                          description: ASIN is the Amazon ASIN of the edition.
                          type: string
                        format:
                          description: Format is the physical or digital format, e.g.
                            Hardcover or EPUB.
                          type: string
                        id:
                          description: ID is the Open Library edition key.
                          type: string
                        isEbook:
                          description: IsEbook is true when the edition is a digital
                            edition.
                          type: boolean
                        isbn13:
                          description: ISBN13 is the 13-digit ISBN of the edition.
                          type: string
                        language:
                          description: Language is the BCP-47 language tag of the
                            edition.
                          type: string
                        pageCount:
                          description: PageCount is the number of pages.
                          format: int32
                          type: integer
                        publisher:
                          description: Publisher is the publishing house.
                          type: string
                        releaseDate:
                          description: ReleaseDate is the edition's publication date.
                          format: date-time
                          type: string
                        title:
                          description: Title is the edition title.
                          type: string
                      required:
                      - id
                      type: object
                    maxItems: 100
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  externalIDs:
                    additionalProperties:
                      type: string
                    description: ExternalIDs maps provider names (openlibrary, hardcover,
                      isbn, ...) to their IDs.
                    type: object
                  genres:
                    description: Genres lists the genres.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                  images:
                    description: Images lists the cover art published by the provider.
                    items:
                      description: Image is one artwork URL published by a metadata
                        provider.
                      properties:
                        type:
                          description: Type classifies the image.
                          enum:
                          - poster
                          - fanart
                          - banner
                          - logo
                          - clearart
                          - thumb
                          - screenshot
                          - disc
                          - headshot
                          type: string
                        url:
                          description: URL is where the image can be fetched.
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 50
                    type: array
                  overview:
                    description: Overview is the synopsis.
                    type: string
                  refreshedAt:
                    description: RefreshedAt is when the metadata was last fetched.
                    format: date-time
                    type: string
                  releaseDate:
                    description: ReleaseDate is the first publication date of the
                      work.
                    format: date-time
                    type: string
                  seriesLinks:
                    description: SeriesLinks places the work inside one or more reading
                      orders.
                    items:
                      description: SeriesLink places a book or audiobook inside a
                        reading order.
                      properties:
                        position:
                          description: Position is the position within the series,
                            e.g. "3" or "2.5".
                          type: string
                        primary:
                          description: Primary is true for the series a work is chiefly
                            part of.
                          type: boolean
                        series:
                          description: Series is the name of the series.
                          type: string
                      required:
                      - series
                      type: object
                    maxItems: 10
                    type: array
                  subtitle:
                    description: Subtitle is the work subtitle.
                    type: string
                  title:
                    description: Title is the work title.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              path:
                description: Path is the resolved folder on disk.
                type: string
              pendingGrab:
                description: PendingGrab is a chosen release waiting out a DelayProfile
                  delay.
                properties:
                  grabAt:
                    description: GrabAt is when the delay expires and the grab will
                      be issued.
                    format: date-time
                    type: string
                  protocol:
                    description: Protocol is the transfer protocol of the pending
                      release.
                    enum:
                    - torrent
                    - usenet
                    type: string
                  releaseTitle:
                    description: ReleaseTitle is the raw title of the release that
                      will be grabbed.
                    type: string
                required:
                - grabAt
                - releaseTitle
                type: object
              phase:
                description: Phase is the coarse lifecycle state of the book.
                enum:
                - Wanted
                - Delayed
                - Downloading
                - Imported
                - CutoffUnmet
                - Unmonitored
                type: string
              searchAttempts:
                description: SearchAttempts counts the searches made for this book.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.workID
    served: true
    storage: true
    subresources:
      status: {}
