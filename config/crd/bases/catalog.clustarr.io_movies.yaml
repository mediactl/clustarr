---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: movies.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Movie
    listKind: MovieList
    plural: movies
    shortNames:
    - mov
    singular: movie
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.title
      name: Title
      type: string
    - jsonPath: .status.metadata.year
      name: Year
      type: integer
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.hasFile
      name: File
      type: boolean
    - jsonPath: .status.fileQuality.name
      name: Quality
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.downloadPhase
      name: Download
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Movie is a monitored film in the catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MovieSpec defines the desired state of Movie.
            properties:
              addOptions:
                description: AddOptions are applied once, when the movie is first
                  reconciled.
                properties:
                  addMethod:
                    default: manual
                    description: AddMethod records how the movie was added.
                    enum:
                    - manual
                    - list
                    - collection
                    - scan
                    type: string
                  monitor:
                    default: movieOnly
                    description: Monitor says whether the collection is monitored
                      alongside the movie.
                    enum:
                    - movieOnly
                    - movieAndCollection
                    - none
                    type: string
                  searchForMovie:
                    default: true
                    description: SearchForMovie triggers an automatic search on add.
                    type: boolean
                type: object
              artwork:
                description: Artwork overrides the provider's image for a type. One
                  entry per type.
                items:
                  description: |-
                    ArtworkOverride pins a custom URL for one image type, replacing whatever
                    the metadata provider published for it. R3: a URL that fails to fetch
                    never falls back to the provider image -- the entry and object stay as
                    they were, and an Event says why.
                  properties:
                    type:
                      description: Type classifies the image being overridden.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the replacement image is fetched from.
                      maxLength: 2048
                      pattern: ^https?://
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              availabilityDelayDays:
                default: 0
                description: |-
                  AvailabilityDelayDays shifts the availability date later (or, when
                  negative, earlier) by this many days.
                format: int32
                type: integer
              collection:
                description: |-
                  Collection holds the defaults used for movies added from this movie's
                  TMDB collection.
                properties:
                  minimumAvailability:
                    description: MinimumAvailability is the minimum availability for
                      collection members.
                    enum:
                    - tba
                    - announced
                    - inCinemas
                    - released
                    type: string
                  monitor:
                    description: Monitor monitors the other movies in the collection.
                    type: boolean
                  qualityProfileRef:
                    description: QualityProfileRef is the QualityProfile for collection
                      members.
                    type: string
                  rootFolderRef:
                    description: RootFolderRef is the RootFolder for collection members.
                    type: string
                  searchOnAdd:
                    description: SearchOnAdd searches for collection members as they
                      are added.
                    type: boolean
                type: object
              delayProfileRef:
                description: DelayProfileRef pins a DelayProfile; unset falls back
                  to tag matching.
                type: string
              folder:
                description: Folder overrides the folder name under the root folder.
                type: string
              minimumAvailability:
                default: released
                description: |-
                  MinimumAvailability is how far into its release cycle the movie must be
                  before it is searched for automatically.
                enum:
                - tba
                - announced
                - inCinemas
                - released
                type: string
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this movie.
                type: boolean
              qualityProfileRef:
                description: QualityProfileRef is the QualityProfile this movie is
                  ranked against.
                type: string
              region:
                default: US
                description: Region is the ISO 3166-1 region whose release dates and
                  certification are used.
                type: string
              rootFolderRef:
                description: RootFolderRef is the RootFolder the movie is stored under.
                type: string
              source:
                description: Source records the ImportList that added the movie, if
                  any.
                properties:
                  importListRef:
                    description: |-
                      ImportListRef is the name of the ImportList that added the item. Empty
                      means the item was added manually.
                    type: string
                type: object
              subtitleProfileRef:
                description: |-
                  SubtitleProfileRef pins a SubtitleProfile; unset falls back to the
                  RootFolder defaults and selectors.
                type: string
              tags:
                description: Tags select DelayProfiles, TranscodeProfiles and SubtitleProfiles.
                items:
                  type: string
                maxItems: 64
                type: array
              tmdbID:
                description: TmdbID is the TMDB movie ID; it identifies the movie
                  and is immutable.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: tmdbID is immutable
                  rule: self == oldSelf
              transcodeProfileRef:
                description: |-
                  TranscodeProfileRef pins a TranscodeProfile; unset falls back to the
                  RootFolder defaults and transcodarr's selectors.
                type: string
            required:
            - qualityProfileRef
            - rootFolderRef
            - tmdbID
            type: object
          status:
            description: MovieStatus describes the observed state of Movie.
            properties:
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this movie.
                type: string
              addOptionsApplied:
                description: AddOptionsApplied is true once spec.addOptions has been
                  acted on.
                type: boolean
              artwork:
                description: |-
                  Artwork lists the images fetched into the artwork store, one per type.
                  Written by the metadata gateway.
                items:
                  description: |-
                    ArtworkEntry records one artwork image fetched into the artwork store,
                    whether from the provider or from a spec.artwork override. Written by the
                    metadata gateway under the manager that already writes status.metadata.
                  properties:
                    digest:
                      description: Digest is the hex SHA-256 of the stored original
                        image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size in bytes of the stored original
                        image.
                      format: int64
                      type: integer
                    source:
                      description: |-
                        Source is whether this image came from the provider or a spec.artwork
                        override.
                      enum:
                      - provider
                      - custom
                      type: string
                    sourceURL:
                      description: SourceURL is the URL the image was fetched from.
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    updatedAt:
                      description: UpdatedAt is when the image was last fetched.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - sizeBytes
                  - source
                  - sourceURL
                  - type
                  - updatedAt
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              audio:
                description: |-
                  Audio is what the file's audio carries against the profile's audio
                  policy; unset when the profile has none (anime dual-audio spec §5.3).
                properties:
                  donor:
                    description: |-
                      Donor is the newest audio donor imported for this item: from the
                      item's Download with spec.purpose audioDonor whose import finished
                      (status.import.imported[].destPath, spec.release.title,
                      status.import.importedAt), carried forward from this status once
                      seen, so deleting the Download loses nothing (loop spec §2.6). A
                      MediaFile is named per file path, so an upgrade under a new filename
                      would lose it if it lived on the file.
                    properties:
                      downloadRef:
                        description: DownloadRef names the donor Download.
                        maxLength: 253
                        type: string
                      importedAt:
                        description: ImportedAt is when the donor's import finished.
                        format: date-time
                        type: string
                      path:
                        description: |-
                          Path is the reduced donor audio (<stem>.mka), which fileimport writes
                          at import.
                        maxLength: 4096
                        type: string
                      release:
                        description: Release is the donor Download's release title.
                        maxLength: 512
                        type: string
                    required:
                    - importedAt
                    - path
                    - release
                    type: object
                  graft:
                    description: Graft is the graft's state.
                    enum:
                    - none
                    - searching
                    - grabbed
                    - pending
                    - aligned
                    - failed
                    - done
                    type: string
                  missing:
                    description: Missing are Wanted less Present; empty when Present
                      is unknown.
                    items:
                      type: string
                    maxItems: 4
                    type: array
                  present:
                    description: |-
                      Present are the file's probed audio languages; empty when unknown.
                      Capped as MediaInfo.Audio is: a MULTi release carries 15-20 dubs.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  reason:
                    description: Reason says why, when Graft is failed.
                    maxLength: 1024
                    type: string
                  rejectedReleases:
                    description: |-
                      RejectedReleases are donor releases a graft of this item failed with
                      (status.graft.donorFault on its file); the donor search never takes
                      them again. Oldest dropped past MaxRejectedReleases.
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  wanted:
                    description: Wanted are the profile's languages, resolved to tags.
                    items:
                      type: string
                    maxItems: 4
                    type: array
                type: object
              available:
                description: Available is true once minimumAvailability has been reached.
                type: boolean
              availableAt:
                description: AvailableAt is when the movie became, or will become,
                  available.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the movie's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 12
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffMet:
                description: CutoffMet is true when the imported file meets the profile
                  cutoff.
                type: boolean
              donorSearchAttempts:
                description: |-
                  DonorSearchAttempts counts the audio donor searches made for this
                  movie (anime dual-audio spec §6.1): their own backoff, beside the
                  video's. Written by the grab worker with searchAttempts.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
              downloadNonces:
                description: |-
                  DownloadNonces records the one-shot download intents last handled
                  (ADR-0019 §6.10).
                properties:
                  import:
                    maxLength: 63
                    type: string
                  remove:
                    maxLength: 63
                    type: string
                  resume:
                    maxLength: 63
                    type: string
                  unblock:
                    maxLength: 63
                    type: string
                type: object
              downloadPhase:
                description: |-
                  DownloadPhase is the active entry's phase, "" when none: a print column
                  and a selectable field (ADR-0019 §6.2).
                enum:
                - Pending
                - Assigned
                - Queued
                - Downloading
                - Paused
                - Completed
                - Seeding
                - Imported
                - Failed
                - Blocklisted
                - Removing
                type: string
              downloads:
                description: |-
                  Downloads is every grab of this item the system is responsible for, live
                  entries only (ADR-0019 §6.4); written by the remediation loop's item key
                  under catalogarr.
                items:
                  description: |-
                    DownloadEntry is one grab of its owner, from the manager's decision to
                    grab through seeding and removal. Written only by the owner's item key
                    in the remediation loop, under field manager catalogarr (ADR-0019 §6.2).
                  properties:
                    block:
                      description: |-
                        Block is the blocklist write this entry owes the release index
                        (§6.14): set on the Blocklisted transition; ConfirmedAt when the
                        index answered. A Blocklisted entry is dropped only after its transfer
                        is removed and its block confirmed, and then after BlockQuarantine.
                      properties:
                        confirmedAt:
                          format: date-time
                          type: string
                        reason:
                          description: DownloadFailureReason is the machine-readable
                            cause of a failure.
                          enum:
                          - none
                          - missingArticles
                          - diskFull
                          - encrypted
                          - stalled
                          - writeError
                          - timeout
                          - importRejected
                          - importExpired
                          - manual
                          - payloadMismatch
                          - payloadUnavailable
                          type: string
                        scope:
                          description: BlockScope is where a release is blocked (ADR-0019
                            §6.14).
                          enum:
                          - item
                          - global
                          type: string
                        seq:
                          description: Seq fences block and unblock writes on the
                            release index row.
                          format: int64
                          minimum: 1
                          type: integer
                      required:
                      - reason
                      - scope
                      - seq
                      type: object
                    client:
                      description: |-
                        Client is the DownloadClient, Engine the instance holding the
                        transfer (<client>-<ordinal>); both pinned once, at admission.
                      maxLength: 253
                      type: string
                    completedAt:
                      format: date-time
                      type: string
                    dispatch:
                      description: |-
                        Dispatch fences the engine command: Seq is the last desired state
                        published, AnsweredSeq the transfer record's seq last incorporated
                        (loop spec §2.3, with ADR-0019 §8.3's Delivery). A Pending entry
                        carries seq 1 from creation; nothing is published until Assigned.
                      properties:
                        answeredSeq:
                          description: |-
                            AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                            answer, a withdrawal or a timeout. A task is in flight while
                            Seq > AnsweredSeq.
                          format: int64
                          minimum: 0
                          type: integer
                        delivery:
                          description: |-
                            Delivery is what the manager knows about the task between publish
                            and answer. Written on transitions only (ADR-0019 §8.3), never per
                            nak.
                          properties:
                            attempts:
                              description: Attempts is the deliveries count of the
                                last nak the manager recorded.
                              format: int32
                              type: integer
                            deadLetteredAt:
                              format: date-time
                              type: string
                            lastNakAt:
                              format: date-time
                              type: string
                            message:
                              maxLength: 256
                              type: string
                            reason:
                              description: |-
                                Reason when waiting or retrying: Budget, Paced, NoAgent,
                                NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                              maxLength: 64
                              type: string
                            state:
                              description: |-
                                DeliveryPhase is where a dispatched task is between its publish and its
                                answer (ADR-0019 §8.3).
                              enum:
                              - waiting
                              - published
                              - claimed
                              - retrying
                              - deadLettered
                              type: string
                          required:
                          - state
                          type: object
                        destination:
                          description: |-
                            Destination is the durable, pool or engine instance the task went to
                            (ADR-0019 §8.3).
                          maxLength: 253
                          type: string
                        dispatchedAt:
                          description: |-
                            DispatchedAt is when Seq was issued; the republish window and the
                            request timeout run from it.
                          format: date-time
                          type: string
                        seq:
                          description: Seq is the sequence of the last task issued
                            for this remediation.
                          format: int64
                          minimum: 1
                          type: integer
                        withdrawn:
                          description: |-
                            Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                            not by an answer. For transcode and graft a fact (a change already
                            made on disk) can still land after that: the planner keeps reading
                            the record while Withdrawn is true and now < DispatchedAt +
                            records.FactWindow, and incorporates a fact at Seq whatever the phase
                            (§4.10, §5.9). Incorporating it clears Withdrawn.
                          type: boolean
                      required:
                      - dispatchedAt
                      - seq
                      type: object
                    engine:
                      maxLength: 263
                      type: string
                    episodes:
                      description: |-
                        Episodes names the covered episodes on a Series entry (season and
                        number in the Series' stored order), Issues the covered issue numbers
                        on a Comic entry. Empty on every other owner.
                      items:
                        description: |-
                          EpisodeNumber is one episode a Series entry or pending grab covers, in
                          the Series' stored order.
                        properties:
                          number:
                            format: int32
                            minimum: 0
                            type: integer
                          season:
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - number
                        - season
                        type: object
                      maxItems: 200
                      type: array
                      x-kubernetes-list-type: atomic
                    failureReason:
                      description: DownloadFailureReason is the machine-readable cause
                        of a failure.
                      enum:
                      - none
                      - missingArticles
                      - diskFull
                      - encrypted
                      - stalled
                      - writeError
                      - timeout
                      - importRejected
                      - importExpired
                      - manual
                      - payloadMismatch
                      - payloadUnavailable
                      type: string
                    grabbedAt:
                      format: date-time
                      type: string
                    grabbedBy:
                      description: GrabSource records what caused a release to be
                        grabbed.
                      enum:
                      - rss
                      - search
                      - interactive
                      - push
                      - redownload
                      type: string
                    id:
                      description: |-
                        ID is the grab's stable name: k8s.ChildName(target, guid), or
                        k8s.ChildName(target, purpose, guid) for a donor, the name the
                        Download had (adopted entries keep it, so MediaFile
                        spec.importedFrom.downloadRef, history and ui links still resolve).
                      maxLength: 253
                      type: string
                    import:
                      description: |-
                        DownloadImportSummary is the grab's import, summarised from its
                        clustarr-imports record (ADR-0019 §6.9); the per-file detail stays in the
                        record.
                      properties:
                        attempts:
                          format: int32
                          type: integer
                        class:
                          description: |-
                            ImportRejectionClass is why an import that imported nothing did so, and
                            with it the remediation (2026-10-07: refusing every file used to blocklist
                            the release at once, which threw away a good 20 GB download that the item
                            merely would not take).
                          enum:
                          - transient
                          - itemState
                          - needsPerson
                          - releaseFault
                          type: string
                        dispatch:
                          description: Dispatch fences the inspect and execute tasks
                            (§6.9).
                          properties:
                            answeredSeq:
                              description: |-
                                AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                                answer, a withdrawal or a timeout. A task is in flight while
                                Seq > AnsweredSeq.
                              format: int64
                              minimum: 0
                              type: integer
                            delivery:
                              description: |-
                                Delivery is what the manager knows about the task between publish
                                and answer. Written on transitions only (ADR-0019 §8.3), never per
                                nak.
                              properties:
                                attempts:
                                  description: Attempts is the deliveries count of
                                    the last nak the manager recorded.
                                  format: int32
                                  type: integer
                                deadLetteredAt:
                                  format: date-time
                                  type: string
                                lastNakAt:
                                  format: date-time
                                  type: string
                                message:
                                  maxLength: 256
                                  type: string
                                reason:
                                  description: |-
                                    Reason when waiting or retrying: Budget, Paced, NoAgent,
                                    NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                                  maxLength: 64
                                  type: string
                                state:
                                  description: |-
                                    DeliveryPhase is where a dispatched task is between its publish and its
                                    answer (ADR-0019 §8.3).
                                  enum:
                                  - waiting
                                  - published
                                  - claimed
                                  - retrying
                                  - deadLettered
                                  type: string
                              required:
                              - state
                              type: object
                            destination:
                              description: |-
                                Destination is the durable, pool or engine instance the task went to
                                (ADR-0019 §8.3).
                              maxLength: 253
                              type: string
                            dispatchedAt:
                              description: |-
                                DispatchedAt is when Seq was issued; the republish window and the
                                request timeout run from it.
                              format: date-time
                              type: string
                            seq:
                              description: Seq is the sequence of the last task issued
                                for this remediation.
                              format: int64
                              minimum: 1
                              type: integer
                            withdrawn:
                              description: |-
                                Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                                not by an answer. For transcode and graft a fact (a change already
                                made on disk) can still land after that: the planner keeps reading
                                the record while Withdrawn is true and now < DispatchedAt +
                                records.FactWindow, and incorporates a fact at Seq whatever the phase
                                (§4.10, §5.9). Incorporating it clears Withdrawn.
                              type: boolean
                          required:
                          - dispatchedAt
                          - seq
                          type: object
                        files:
                          description: |-
                            Files is how many files the approved plan places; the entry reads
                            Imported only when that many MediaFiles name this entry's ID in
                            spec.importedFrom.downloadRef.
                          format: int32
                          type: integer
                        heldSince:
                          format: date-time
                          type: string
                        importedAt:
                          format: date-time
                          type: string
                        message:
                          maxLength: 1024
                          type: string
                        nextAttemptAt:
                          format: date-time
                          type: string
                        override:
                          description: |-
                            Override is the intent's override: the import is a person's, so a
                            suspected sample, an unknown quality and a transcoded file are taken
                            as a manual import takes them (§6.10).
                          type: boolean
                        phase:
                          description: |-
                            ImportPhase is a grab's import, summarised (ADR-0019 §6.9). Not
                            downloadv1alpha1.ImportPhase, which release N+1 removes with Download.
                          enum:
                          - pending
                          - inspected
                          - approved
                          - imported
                          - blocked
                          - held
                          - expired
                          type: string
                        target:
                          description: |-
                            Target is the download.clustarr.io/import intent's target,
                            "<kind>/<name>[/<key>]": every later inspect of this import keeps it.
                            Empty for the entry's own target.
                          maxLength: 512
                          type: string
                      required:
                      - dispatch
                      - phase
                      type: object
                    issues:
