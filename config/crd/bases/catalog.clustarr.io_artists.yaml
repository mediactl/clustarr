---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: artists.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Artist
    listKind: ArtistList
    plural: artists
    shortNames:
    - art
    singular: artist
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.name
      name: Name
      type: string
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.albumCount
      name: Albums
      type: integer
    - jsonPath: .status.albumFileCount
      name: Files
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Artist is a monitored recording artist in the catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArtistSpec defines the desired state of Artist.
            properties:
              addOptions:
                description: AddOptions are applied once, when the artist is first
                  reconciled.
                properties:
                  monitor:
                    default: all
                    description: Monitor selects which albums start out monitored.
                    enum:
                    - all
                    - future
                    - missing
                    - existing
                    - latest
                    - first
                    - none
                    type: string
                  searchForMissing:
                    description: SearchForMissing searches for missing albums on add.
                    type: boolean
                type: object
              delayProfileRef:
                description: DelayProfileRef pins a DelayProfile; unset falls back
                  to tag matching.
                type: string
              folder:
                description: Folder overrides the folder name under the root folder.
                type: string
              metadataProfile:
                description: MetadataProfile filters which release groups become Albums.
                properties:
                  primaryTypes:
                    default:
                    - album
                    - ep
                    description: PrimaryTypes are the MusicBrainz primary release-group
                      types to accept.
                    items:
                      enum:
                      - album
                      - ep
                      - single
                      - broadcast
                      - other
                      type: string
                    maxItems: 8
                    type: array
                  releaseStatuses:
                    default:
                    - official
                    description: ReleaseStatuses are the MusicBrainz release statuses
                      to accept.
                    items:
                      enum:
                      - official
                      - promotion
                      - bootleg
                      - pseudoRelease
                      type: string
                    maxItems: 8
                    type: array
                  secondaryTypes:
                    default:
                    - studio
                    description: |-
                      SecondaryTypes are the MusicBrainz secondary release-group types to accept.
                      Each token folds one MusicBrainz spelling (https://musicbrainz.org/doc/Release_Group/Type):
                      "Audio drama" is audioDrama, "DJ-mix" djMix, "Mixtape/Street" mixtape
                      and "Field recording" fieldRecording; "studio" is this project's token
                      for a release group with no secondary type at all.
                    items:
                      enum:
                      - studio
                      - compilation
                      - soundtrack
                      - spokenword
                      - interview
                      - audiobook
                      - live
                      - remix
                      - djMix
                      - mixtape
                      - demo
                      - audioDrama
                      - fieldRecording
                      type: string
                    maxItems: 16
                    type: array
                type: object
              monitorNewItems:
                default: all
                description: |-
                  MonitorNewItems says what happens to albums discovered after the artist
                  was added.
                enum:
                - all
                - none
                - new
                type: string
              monitored:
                default: true
                description: Monitored enables automatic searching and importing for
                  this artist.
                type: boolean
              musicBrainzID:
                description: |-
                  MusicBrainzID is the MusicBrainz artist MBID; it identifies the artist
                  and is immutable.
                type: string
                x-kubernetes-validations:
                - message: musicBrainzID is immutable
                  rule: self == oldSelf
              qualityProfileRef:
                description: QualityProfileRef is the QualityProfile albums are ranked
                  against.
                type: string
              rootFolderRef:
                description: RootFolderRef is the RootFolder the artist is stored
                  under.
                type: string
              source:
                description: Source records the ImportList that added the artist,
                  if any.
                properties:
                  importListRef:
                    description: |-
                      ImportListRef is the name of the ImportList that added the item. Empty
                      means the item was added manually.
                    type: string
                type: object
              tags:
                description: Tags select DelayProfiles and other tag-matched policy.
                items:
                  type: string
                maxItems: 64
                type: array
            required:
            - musicBrainzID
            - qualityProfileRef
            - rootFolderRef
            type: object
          status:
            description: ArtistStatus describes the observed state of Artist.
            properties:
              addOptionsApplied:
                description: AddOptionsApplied is true once spec.addOptions has been
                  acted on.
                type: boolean
              albumCount:
                description: AlbumCount is the number of Album objects owned by the
                  artist.
                format: int32
                type: integer
              albumFileCount:
                description: AlbumFileCount is the number of albums with at least
                  one imported file.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the artist's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              metadata:
                description: Metadata is the cached provider metadata.
                properties:
                  disambiguation:
                    description: Disambiguation distinguishes same-named artists.
                    type: string
                  externalIDs:
                    additionalProperties:
                      type: string
                    description: ExternalIDs maps provider names (musicbrainz, fanart,
                      ...) to their IDs.
                    type: object
                  genres:
                    description: Genres lists the genres.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                  images:
                    description: Images lists the artwork published by the provider.
                    items:
                      description: Image is one artwork URL published by a metadata
                        provider.
                      properties:
                        type:
                          description: Type classifies the image.
                          enum:
                          - poster
                          - fanart
                          - banner
                          - logo
                          - clearart
                          - thumb
                          - screenshot
                          - disc
                          - headshot
                          type: string
                        url:
                          description: URL is where the image can be fetched.
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 50
                    type: array
                  name:
                    description: Name is the artist name.
                    type: string
                  overview:
                    description: Overview is the artist biography.
                    type: string
                  refreshedAt:
                    description: RefreshedAt is when the metadata was last fetched.
                    format: date-time
                    type: string
                  sortName:
                    description: SortName is the name used for sorting.
                    type: string
                  status:
                    description: Status is the upstream activity status.
                    enum:
                    - continuing
                    - ended
                    type: string
                  type:
                    description: Type is the MusicBrainz artist type, e.g. Person
                      or Group.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              path:
                description: Path is the resolved folder on disk.
                type: string
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.musicBrainzID
    served: true
    storage: true
    subresources:
      status: {}
