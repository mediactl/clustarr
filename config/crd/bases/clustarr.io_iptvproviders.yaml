---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: iptvproviders.clustarr.io
spec:
  group: clustarr.io
  names:
    categories:
    - clustarr
    kind: IPTVProvider
    listKind: IPTVProviderList
    plural: iptvproviders
    shortNames:
    - iptv
    singular: iptvprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.server
      name: Server
      type: string
    - jsonPath: .status.tuners.total
      name: Tuners
      type: integer
    - jsonPath: .status.lineup.active
      name: Active
      type: integer
    - jsonPath: .status.playlist.candidates
      name: Candidates
      type: integer
    - jsonPath: .spec.epgSource
      name: EPG
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.account.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPTVProvider is one Xtream Codes IPTV account routed to Plex as emulated
          HDHomeRuns, one per block of its channels (Live TV spec §3). Its tuner runs
          in the manager, behind one livetv Service; Plex is given each block at its
          own path on that Service (status.blocks[].uri).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IPTVProviderSpec is one Xtream Codes IPTV account
              (docs/superpowers/specs/2026-10-20-iptv-xtream-ranges-design.md). Its
              playlist is <server>/get.php with output=ts and type=m3u_plus, its guide
              <server>/xmltv.php unless guideURL names another, both fetched daily and
              cached. Its active channels are
              split into blocks of contiguous numbers, each one emulated HDHomeRun and
              one Plex DVR (Live TV spec §3, §3.1).
            properties:
              channelNumberStart:
                description: ChannelNumberStart is where the UI's auto-numbering begins.
                  Default 1000.
                format: int32
                maximum: 99999
                minimum: 1
                type: integer
              credentialsRef:
                description: |-
                  CredentialsRef names a Secret in the provider's namespace holding the
                  account's username and password, under the keys "username" and
                  "password". They are sent as the panel's query parameters and never
                  stored or reported.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              device:
                description: Device names the emulated HDHomeRuns, one per block.
                properties:
                  friendlyName:
                    description: |-
                      FriendlyName is the name Plex shows, before each block's "<start>+".
                      Default "Clustarr <name>".
                    maxLength: 128
                    type: string
                  id:
                    description: |-
                      ID pins the first block's DeviceID when the provider's blocks are
                      first packed: eight upper-case hex digits, unique among every
                      provider's blocks. Unset, every DeviceID is a hash of namespace, name
                      and the block's start (Live TV spec §3.1).
                    pattern: ^[0-9A-F]{8}$
                    type: string
                type: object
              dvr:
                description: DVR sizes the blocks the lineup is split into, one Plex
                  DVR each.
                properties:
                  maxChannels:
                    description: |-
                      MaxChannels is a block's most channels. A block is also held under
                      30,000 bytes of channel map, whichever comes first. Default 400.
                    format: int32
                    maximum: 450
                    minimum: 1
                    type: integer
                type: object
              enabled:
                description: |-
                  Enabled false stops this provider's tuner; Plex then sees its devices
                  gone. Default true.
                type: boolean
              epgSource:
                description: |-
                  EPGSource is where Plex reads the guide: XEPG (this provider's
                  xmltv.xml, built from the panel's guide and the channel mappings) or
                  PMS (Plex's own lineup guide; mappings' epg is ignored). Default XEPG.
                enum:
                - XEPG
                - PMS
                type: string
              filters:
                description: |-
                  Filters choose which playlist entries reach the mapping table. An
                  entry is a candidate when any enabled filter matches it; with no
                  filter, nothing is a candidate (xTeVe's rule).
                items:
                  description: |-
                    ChannelFilter chooses playlist entries for the mapping table, with
                    xTeVe's semantics (Live TV spec §4.2).
                  properties:
                    caseSensitive:
                      description: CaseSensitive makes Match, Include and Exclude
                        match case.
                      type: boolean
                    enabled:
                      description: Enabled false keeps the filter but matches nothing.
                        Default true.
                      type: boolean
                    exclude:
                      description: 'Exclude: the name must contain none of these words.'
                      items:
                        maxLength: 128
                        type: string
                      maxItems: 32
                      type: array
                    include:
                      description: 'Include: the name must contain at least one of
                        these words.'
                      items:
                        maxLength: 128
                        type: string
                      maxItems: 32
                      type: array
                    match:
                      description: Match is the group title or the name substring.
                      maxLength: 256
                      minLength: 1
                      type: string
                    name:
                      description: Name identifies the filter.
                      maxLength: 63
                      minLength: 1
                      type: string
                    type:
                      description: |-
                        Type groupTitle matches an entry's group-title exactly; custom
                        matches Match as a substring of the channel name.
                      enum:
                      - groupTitle
                      - custom
                      type: string
                  required:
                  - match
                  - name
                  - type
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              guideURL:
                description: |-
                  GuideURL is an XMLTV guide fetched instead of the panel's xmltv.php
                  (owner, 2026-10-27: iptv-epg.org's US guide, whose programmes carry
                  icons the panel's have none of). An http or https URL; "{username}"
                  and "{password}" in it are replaced with the account's, query-escaped,
                  so a panel's own guide under another path can be named without its
                  credentials. Channels map to its channel ids through each
                  IPTVChannel's spec.epg.channelID, so a change of guide needs the
                  lineup's ids mapped to the new guide's. Unset, the panel's xmltv.php.
                maxLength: 2048
                pattern: ^https?://
                type: string
              refresh:
                description: |-
                  Refresh is how often the playlist, the guide and the account are
                  fetched again. Each is cached, and a restart fetches only what is
                  older than this. Default 24h.
                type: string
              server:
                description: |-
                  Server is the Xtream Codes panel: a host ("tvload.win"), a host:port,
                  or a URL. Without a scheme it is https.
                maxLength: 512
                minLength: 1
                type: string
              stream:
                description: Stream tunes the relay.
                properties:
                  buffer:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Buffer is each channel's ring buffer. Default 8Mi.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  language:
                    description: |-
                      Language is the language the relay declares for every audio and
                      subtitle track whose program map names none or an undetermined one
                      ("und"), as a BCP-47 or ISO 639-2 code; Plex shows such a track as
                      Unknown otherwise (2026-10-27: tvload.win's ESPN said und, its Weather
                      Channel eng). A channel's own language (IPTVChannel spec.language)
                      replaces whatever the stream declares. Default "eng".
                    maxLength: 16
                    type: string
                  linger:
                    description: |-
                      Linger keeps an upstream open after its last viewer leaves, so a
                      channel flip back costs no reconnect. Default 10s.
                    type: string
                type: object
              tuners:
                description: |-
                  Tuners overrides how many distinct channels may stream at once, which
                  the relay enforces with a 503. Unset, it is the account's
                  max_connections (player_api.php), else 1. discover.json advertises
                  tuner.SpareTuners more, so a grab PMS never ended cannot block an idle
                  relay.
                format: int32
                maximum: 64
                minimum: 1
                type: integer
              userAgent:
                description: |-
                  UserAgent is sent with playlist, guide and stream requests. Default
                  "clustarr".
                maxLength: 256
                type: string
            required:
            - credentialsRef
            - server
            type: object
          status:
            description: |-
              IPTVProviderStatus is written by the IPTVProvider controller alone, under
              k8s.ManagerLiveTV, from the tuner's snapshot (Live TV spec §3.2).
            properties:
              account:
                description: Account is the panel's report of the account (player_api.php).
                properties:
                  activeConnections:
                    description: ActiveConnections is how many it held when last asked.
                    format: int32
                    type: integer
                  error:
                    description: Error is the last ask's error, redacted.
                    maxLength: 1024
                    type: string
                  expiresAt:
                    description: ExpiresAt is when the account ends; unset for one
                      that does not.
                    format: date-time
                    type: string
                  fetchedAt:
                    description: FetchedAt is when the panel was last asked.
                    format: date-time
                    type: string
                  maxConnections:
                    description: MaxConnections is how many streams the account may
                      hold at once.
                    format: int32
                    type: integer
                  status:
                    description: |-
                      Status is the panel's word for the account: Active, Expired,
                      Banned, Disabled.
                    maxLength: 32
                    type: string
                type: object
              address:
                description: |-
                  Address is the tuner Service's cluster FQDN and port,
                  <release>-livetv.<namespace>.svc.cluster.local:80: each block's Path
                  is under it, and /livetv/<namespace>/<name>/<file>?from=<n>&to=<n>
                  serves any range of the lineup.
                type: string
              blocks:
                description: |-
                  Blocks are the lineup's runs of contiguous numbers, one emulated
                  HDHomeRun and one Plex DVR each, ordered by start (Live TV spec §3.1).
                items:
                  description: |-
                    BlockStatus is one block: one emulated HDHomeRun and one Plex DVR (Live TV
                    spec §3.1, §3.2).
                  properties:
                    channels:
                      description: Channels counts the block's active channels.
                      format: int32
                      type: integer
                    deviceID:
                      description: |-
                        DeviceID is the block's HDHomeRun id: spec.device.id for the first
                        block of a first packing, else a hash of namespace, name and start.
                      pattern: ^[0-9A-F]{8}$
                      type: string
                    first:
                      description: First and Last are the numbers the block's channels
                        span.
                      maxLength: 16
                      type: string
                    friendlyName:
                      description: FriendlyName is the name Plex shows for the block's
                        device and DVR.
                      maxLength: 160
                      type: string
                    guideHash:
                      description: |-
                        GuideHash is a hash of the block's guide. A change tells cluster-plex
                        to reload that DVR's guide.
                      maxLength: 64
                      type: string
                    guidePath:
                      description: |-
                        GuidePath is the block's XEPG guide path under its path; empty under
                        PMS.
                      maxLength: 64
                      type: string
                    last:
                      maxLength: 16
                      type: string
                    lineupHash:
                      description: |-
                        LineupHash is a hash of the block's lineup.json. A change tells
                        cluster-plex to save that DVR's channel map again.
                      maxLength: 64
                      type: string
                    mapBytes:
                      description: MapBytes is the size of the block's channel-map
                        query.
                      format: int32
                      type: integer
                    owner:
                      description: |-
                        Owner is the cluster-plex installation registered for the block,
                        read from its Lease. Empty while none holds it.
                      maxLength: 128
                      type: string
                    path:
                      description: |-
                        Path is the block's device on Address: /hdhr/<deviceID>, which Plex
                        is given (with Address) as the device's network address.
                      maxLength: 512
                      type: string
                    start:
                      description: |-
                        Start is the block's boundary and identity: the number its channels
                        begin at. A channel belongs to the last block whose start is at or
                        below its number.
                      maxLength: 16
                      type: string
                    uri:
                      description: |-
                        URI is the block's device address as Plex registers it:
                        http://<address><path>.
                      maxLength: 512
                      type: string
                  required:
                  - start
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - start
                x-kubernetes-list-type: map
              conditions:
                description: 'Conditions: Ready, Valid, PlaylistFetched, GuidesFetched.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              guide:
                description: Guide describes the guide the tuner serves.
                properties:
                  channels:
                    format: int32
                    type: integer
                  error:
                    maxLength: 1024
                    type: string
                  fetchedAt:
                    format: date-time
                    type: string
                  programmes:
                    format: int32
                    type: integer
                required:
                - channels
                - programmes
                type: object
              lineup:
                description: Lineup counts the rendered lineup.
                properties:
                  active:
                    format: int32
                    type: integer
                  first:
                    description: First and Last are the numbers the active channels
                      span.
                    maxLength: 16
                    type: string
                  last:
                    maxLength: 16
                    type: string
                  missing:
                    format: int32
                    type: integer
                  unmapped:
                    format: int32
                    type: integer
                required:
                - active
                - missing
                - unmapped
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              playlist:
                description: Playlist describes the playlist the tuner serves.
                properties:
                  candidates:
                    format: int32
                    type: integer
                  entries:
                    format: int32
                    type: integer
                  error:
                    description: |-
                      Error is the last fetch's error, redacted; the last good playlist is
                      still served.
                    maxLength: 1024
                    type: string
                  fetchedAt:
                    description: |-
                      FetchedAt is when the playlist served was fetched, from the panel or
                      before a restart.
                    format: date-time
                    type: string
                  groups:
                    format: int32
                    type: integer
                  hash:
                    type: string
                required:
                - candidates
                - entries
                - groups
                type: object
              tuners:
                description: Tuners counts the provider's tuners.
                properties:
                  inUse:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                required:
                - inUse
                - total
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
