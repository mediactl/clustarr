---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: plexhublayouts.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    kind: PlexHubLayout
    listKind: PlexHubLayoutList
    plural: plexhublayouts
    shortNames:
    - phub
    singular: plexhublayout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.library
      name: Library
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlexHubLayout is one Plex library's hubs -- their order and where each
          shows -- declared as a resource; cluster-plex reconciles it into Plex.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlexHubLayoutSpec is a library's hub layout.
            properties:
              hubs:
                description: |-
                  Hubs are the library's hubs in the order wanted. The listed hubs
                  come first, in this order; a hub of the library not listed keeps
                  Plex's relative order after them, and its visibility. Empty leaves
                  the library's hubs as Plex has them.
                items:
                  description: |-
                    PlexHubEntry is one hub of a layout: exactly one of Identifier,
                    Collection and CollectionTitle names it, and the three booleans say
                    where Plex shows it. All three are always sent.
                  properties:
                    collection:
                      description: |-
                        Collection names a PlexCollection in the layout's namespace. A
                        collection with no hub yet gets one created, and a collection a
                        layout lists takes its visibility from the layout, not from the
                        PlexCollection's spec.visibility.
                      maxLength: 253
                      minLength: 1
                      type: string
                    collectionTitle:
                      description: |-
                        CollectionTitle names a Plex collection no resource manages, by its
                        title in the library.
                      maxLength: 256
                      minLength: 1
                      type: string
                    friendsHome:
                      description: FriendsHome shows the hub on shared users' Home.
                      type: boolean
                    home:
                      description: Home shows the hub on the server owner's Home.
                      type: boolean
                    identifier:
                      description: |-
                        Identifier names one of Plex's built-in hubs by its identifier:
                        "movie.recentlyreleased", "tv.toprated".
                      maxLength: 253
                      minLength: 1
                      type: string
                    libraryRecommended:
                      description: LibraryRecommended shows the hub on the library's
                        Recommended tab.
                      type: boolean
                  required:
                  - friendsHome
                  - home
                  - libraryRecommended
                  type: object
                  x-kubernetes-validations:
                  - message: a hub is exactly one of identifier, collection and collectionTitle
                    rule: '(has(self.identifier) ? 1 : 0) + (has(self.collection)
                      ? 1 : 0) + (has(self.collectionTitle) ? 1 : 0) == 1'
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: a built-in hub is listed once
                  rule: self.all(h, !has(h.identifier) || self.exists_one(o, has(o.identifier)
                    && o.identifier == h.identifier))
                - message: a collection is listed once
                  rule: self.all(h, !has(h.collection) || self.exists_one(o, has(o.collection)
                    && o.collection == h.collection))
                - message: a collection title is listed once
                  rule: self.all(h, !has(h.collectionTitle) || self.exists_one(o,
                    has(o.collectionTitle) && o.collectionTitle == h.collectionTitle))
              library:
                description: |-
                  Library is the Plex library section, by title. cluster-plex also
                  takes a library's former title, so nothing checks it here.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: library is immutable
                  rule: self == oldSelf
            required:
            - library
            type: object
          status:
            description: PlexHubLayoutStatus is cluster-plex's, alone.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hubs:
                description: |-
                  Hubs is the library's whole hub list as Plex holds it, in Plex's
                  order, listed in the spec or not.
                items:
                  description: PlexHubStatus is one hub as Plex holds it.
                  properties:
                    collection:
                      description: |-
                        Collection is the PlexCollection that holds the hub's collection,
                        when a resource does.
                      type: string
                    friendsHome:
                      type: boolean
                    home:
                      type: boolean
                    identifier:
                      description: Identifier is Plex's identifier of the hub.
                      type: string
                    kind:
                      description: |-
                        Kind is builtin for one of Plex's own hubs, collection for a
                        collection's.
                      enum:
                      - builtin
                      - collection
                      type: string
                    libraryRecommended:
                      type: boolean
                    ratingKey:
                      description: RatingKey is the Plex collection's, for a collection
                        hub.
                      type: string
                    title:
                      description: Title is the hub's title in Plex.
                      maxLength: 256
                      type: string
                  required:
                  - friendsHome
                  - home
                  - identifier
                  - kind
                  - libraryRecommended
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                format: int64
                type: integer
              resetHandled:
                description: |-
                  ResetHandled is the value of the hubs-reset annotation cluster-plex
                  last honoured.
                type: string
              sectionKey:
                description: SectionKey is the Plex library section the layout resolved
                  to.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
