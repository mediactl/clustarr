---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: backlogsearches.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    kind: BacklogSearch
    listKind: BacklogSearchList
    plural: backlogsearches
    shortNames:
    - bls
    singular: backlogsearch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Ready
      type: string
    - jsonPath: .status.missing.due
      name: Missing
      type: integer
    - jsonPath: .status.cutoffUnmet.due
      name: CutoffUnmet
      type: integer
    - jsonPath: .status.searchesLastHour
      name: LastHour
      type: integer
    - jsonPath: .status.lastCycleAt
      name: LastCycle
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BacklogSearch searches a namespace's backlog -- missing items and items
          below their cutoff -- against the indexers again, a few at a time: every
          interval it picks the items whose last live search is oldest and lets
          each make one live search, behind the namespace's live-search pace and
          the dispatch ledger. Without it an item is searched live once, and
          afterwards only against the release index its indexers' RSS feeds fill
          (docs/superpowers/specs/2026-11-10-backlog-search-design.md).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BacklogSearchSpec is how a namespace's backlog is searched.
            properties:
              cutoffUnmet:
                description: |-
                  CutoffUnmet is the queue of monitored items whose file is below its
                  profile's cutoff.
                properties:
                  cooldown:
                    description: |-
                      Cooldown is how long after an item's last live search (its
                      status.lastLiveSearchAt) it may be searched live again by the
                      backlog. Unset: 168h for missing, 336h for cutoffUnmet; at least 1h.
                    type: string
                  perCycle:
                    description: |-
                      PerCycle is how many of the queue's searches a cycle starts at most:
                      one item, or one season (spec.seasonSearch). 0 turns the queue off.
                      Unset: 5 for missing, 1 for cutoffUnmet.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                type: object
              enabled:
                description: 'Enabled runs the cycles; false pauses them. Unset: true.'
                type: boolean
              hourlyLimit:
                description: |-
                  HourlyLimit is how many backlog searches start in any hour at most,
                  across both queues. Every search asks each of the namespace's
                  indexers once, so it is read per indexer. Unset: 20.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              interval:
                description: 'Interval is the time between cycles. Unset: 15m; at
                  least 1m.'
                type: string
              kinds:
                description: |-
                  Kinds limits the backlog to these kinds; empty is every searchable
                  kind.
                items:
                  description: MediaKind identifies what kind of catalog item a reference
                    points at.
                  enum:
                  - movie
                  - series
                  - episode
                  - artist
                  - album
                  - author
                  - book
                  - audiobook
                  - comic
                  - issue
                  type: string
                maxItems: 6
                type: array
                x-kubernetes-list-type: set
              missing:
                description: Missing is the queue of monitored items with no file.
                properties:
                  cooldown:
                    description: |-
                      Cooldown is how long after an item's last live search (its
                      status.lastLiveSearchAt) it may be searched live again by the
                      backlog. Unset: 168h for missing, 336h for cutoffUnmet; at least 1h.
                    type: string
                  perCycle:
                    description: |-
                      PerCycle is how many of the queue's searches a cycle starts at most:
                      one item, or one season (spec.seasonSearch). 0 turns the queue off.
                      Unset: 5 for missing, 1 for cutoffUnmet.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                type: object
              seasonSearch:
                description: |-
                  SeasonSearch searches two or more due episodes of one season as one
                  season query, through the Series' automatic season search, where a
                  lone due episode searches alone. Unset: true.
                type: boolean
            type: object
          status:
            description: BacklogSearchStatus describes the observed state of BacklogSearch.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffUnmet:
                description: CutoffUnmet is the cutoff-unmet queue as the last cycle
                  found it.
                properties:
                  candidates:
                    description: |-
                      Candidates are the queue's items: monitored, wanted for the queue's
                      reason, searched before, nothing in flight.
                    format: int32
                    type: integer
                  due:
                    description: Due are the candidates past the queue's cooldown.
                    format: int32
                    type: integer
                  oldestLiveSearchAt:
                    description: |-
                      OldestLiveSearchAt is the oldest last live search among the due
                      candidates that have one.
                    format: date-time
                    type: string
                required:
                - candidates
                - due
                type: object
              lastCycleAt:
                description: LastCycleAt is when the last cycle ran.
                format: date-time
                type: string
              missing:
                description: Missing is the missing queue as the last cycle found
                  it.
                properties:
                  candidates:
                    description: |-
                      Candidates are the queue's items: monitored, wanted for the queue's
                      reason, searched before, nothing in flight.
                    format: int32
                    type: integer
                  due:
                    description: Due are the candidates past the queue's cooldown.
                    format: int32
                    type: integer
                  oldestLiveSearchAt:
                    description: |-
                      OldestLiveSearchAt is the oldest last live search among the due
                      candidates that have one.
                    format: date-time
                    type: string
                required:
                - candidates
                - due
                type: object
              nextCycleAt:
                description: NextCycleAt is when the next cycle runs.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              recent:
                description: Recent are the latest backlog searches, newest first.
                items:
                  description: |-
                    BacklogSearchUnit is one backlog search a cycle started: an item, or a
                    season of a series.
                  properties:
                    at:
                      description: At is when the cycle started it.
                      format: date-time
                      type: string
                    items:
                      description: |-
                        Items is how many items the unit searches for: 1, or a season's due
                        episodes.
                      format: int32
                      type: integer
                    kind:
                      description: Kind is the item's kind, series for a season.
                      enum:
                      - movie
                      - series
                      - episode
                      - artist
                      - album
                      - author
                      - book
                      - audiobook
                      - comic
                      - issue
                      type: string
                    name:
                      description: Name is the item's, or the series'.
                      type: string
                    reason:
                      description: 'Reason is the queue: missing or cutoffUnmet.'
                      enum:
                      - missing
                      - cutoffUnmet
                      type: string
                    season:
                      description: Season is a season unit's season.
                      format: int32
                      type: integer
                  required:
                  - at
                  - items
                  - kind
                  - name
                  - reason
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              searchesLastHour:
                description: |-
                  SearchesLastHour counts the backlog searches started in the hour
                  before the last cycle, its own included.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
