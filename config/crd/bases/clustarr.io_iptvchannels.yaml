---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: iptvchannels.clustarr.io
spec:
  group: clustarr.io
  names:
    categories:
    - clustarr
    kind: IPTVChannel
    listKind: IPTVChannelList
    plural: iptvchannels
    shortNames:
    - iptvch
    singular: iptvchannel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef
      name: Provider
      type: string
    - jsonPath: .spec.number
      name: Number
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.active
      name: Active
      type: boolean
    - jsonPath: .status.guide
      name: Guide
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPTVChannel is one mapped channel of an IPTVProvider (Live TV
          spec §3).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IPTVChannelSpec is one mapped channel: a playlist candidate the owner
              activated or customised (Live TV spec §3, §3.0).
            properties:
              active:
                description: |-
                  Active puts the channel in the lineup. An inactive IPTVChannel keeps
                  its mapping for later.
                type: boolean
              category:
                description: |-
                  Category is the lineup category the channel's block follows. Nil is
                  automatic; the empty string puts the channel on no DVR (§5.1).
                maxLength: 64
                type: string
              epg:
                description: EPG is the guide mapping; unset means by tvg-id, else
                  a dummy guide.
                properties:
                  channelID:
                    description: ChannelID is an XMLTV channel id in the provider's
                      guide.
                    maxLength: 256
                    type: string
                  dummy:
                    description: Dummy draws a placeholder guide.
                    type: boolean
                  dummyMinutes:
                    description: DummyMinutes is the dummy guide's block length. Default
                      60.
                    enum:
                    - 30
                    - 60
                    - 120
                    - 180
                    format: int32
                    type: integer
                  plex:
                    description: |-
                      Plex overrides the automatic pairing with the provider's Plex lineup
                      (spec.plexGuide): a station, or off. Unset, the channel is paired by
                      its guide id's call sign and its name (the Plex native guide design
                      §5.3).
                    properties:
                      "off":
                        description: Off keeps the channel off Plex.
                        type: boolean
                      station:
                        description: |-
                          Station is a station's gridKey, the same in every Plex lineup: the
                          part of a lineup channel's id after its dash.
                        pattern: ^[0-9a-f]{24}$
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of station and off
                      rule: (has(self.station) && size(self.station) > 0) != (has(self.off)
                        && self.off)
                type: object
                x-kubernetes-validations:
                - message: set at most one of channelID and dummy
                  rule: '!((has(self.channelID) && size(self.channelID) > 0) && (has(self.dummy)
                    && self.dummy))'
              group:
                description: Group overrides the playlist's group-title.
                maxLength: 256
                type: string
              key:
                description: |-
                  Key is the playlist entry's identity (pkg/iptv/m3u: "t:<tvg-id>" or
                  "n:<hash of group and name>"). Immutable.
                maxLength: 64
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: key is immutable
                  rule: self == oldSelf
              language:
                description: |-
                  Language is the language the relay declares for this channel's audio
                  and subtitle tracks, as a BCP-47 or ISO 639-2 code, replacing whatever
                  the stream says; empty takes the provider's stream.language, which
                  only fills a missing or undetermined one.
                maxLength: 16
                type: string
              logo:
                description: Logo overrides the playlist's tvg-logo.
                maxLength: 4096
                type: string
              name:
                description: Name overrides the playlist's channel name.
                maxLength: 256
                type: string
              number:
                description: 'Number is the GuideNumber Plex shows: "1001" or "5.1".'
                pattern: ^[0-9]{1,5}(\.[0-9]{1,3})?$
                type: string
              providerRef:
                description: ProviderRef names the IPTVProvider in the same namespace.
                  Immutable.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self == oldSelf
              timeshiftMinutes:
                description: TimeshiftMinutes moves this channel's programmes.
                format: int32
                maximum: 720
                minimum: -720
                type: integer
            required:
            - key
            - number
            - providerRef
            type: object
          status:
            description: |-
              IPTVChannelStatus is written by the IPTVChannel controller alone, under
              k8s.ManagerLiveTVChannel (Live TV spec §3.0).
            properties:
              conditions:
                description: |-
                  Conditions: Ready, whose reason is Active, Inactive, Missing,
                  DuplicateNumber, GuideNotFound or ProviderNotFound.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              guide:
                description: |-
                  Guide is the mapping actually used: "<guide>/<channelID>" or
                  "dummy/<minutes>".
                maxLength: 512
                type: string
              lineup:
                description: Lineup is what the lineup planner decided for the channel
                  (§5.1).
                properties:
                  category:
                    maxLength: 64
                    type: string
                  duplicateOf:
                    description: |-
                      DuplicateOf is what this channel duplicates. For a playlist entry
                      the planner left out as a duplicate of another by its trimmed name,
                      it is the winning entry's playlist key; for a second IPTVChannel of
                      one playlist key (a copy made by hand, a timeshift copy), which the
                      lineup controller deactivates, it is the object name of the channel
                      that carries the key, cut to 64 characters.
                    maxLength: 64
                    type: string
                  missingSince:
                    format: date-time
                    type: string
                  name:
                    maxLength: 256
                    type: string
                  number:
                    maxLength: 16
                    type: string
                  rule:
                    description: Rule is the rule that took the entry.
                    maxLength: 64
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              plex:
                description: |-
                  Plex is the channel's pairing with its provider's Plex lineup; unset
                  when the provider names none.
                properties:
                  callSign:
                    description: CallSign is the station's call sign.
                    maxLength: 64
                    type: string
                  candidates:
                    description: |-
                      Candidates are the stations an Ambiguous match named, each
                      "<callSign> <vcn> <title>".
                    items:
                      maxLength: 320
                      type: string
                    maxItems: 5
                    type: array
                  id:
                    description: ID is the lineup channel's id, <lineup id>-<gridKey>.
                    maxLength: 128
                    type: string
                  lineup:
                    description: Lineup is the Plex lineup the station was taken from.
                    maxLength: 64
                    type: string
                  match:
                    description: Match is how the channel was paired, or why it is
                      off Plex.
                    enum:
                    - Manual
                    - Automatic
                    - Ambiguous
                    - Taken
                    - Timeshifted
                    - NotInLineup
                    - "Off"
                    - NoLineup
                    type: string
                  missingSince:
                    description: |-
                      MissingSince is when the paired station was first absent from the
                      lineup; the pairing stands for 7 days of absence.
                    format: date-time
                    type: string
                  station:
                    description: Station is the paired station's gridKey.
                    maxLength: 64
                    type: string
                  takenBy:
                    description: TakenBy names the channel holding the station, for
                      Taken.
                    maxLength: 253
                    type: string
                  title:
                    description: Title is the station's title.
                    maxLength: 256
                    type: string
                  vcn:
                    description: VCN is the station's channel number in the lineup,
                      which Plex shows.
                    maxLength: 16
                    type: string
                required:
                - match
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
