---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: episodes.catalog.clustarr.io
spec:
  group: catalog.clustarr.io
  names:
    categories:
    - clustarr
    - catalog
    - media
    kind: Episode
    listKind: EpisodeList
    plural: episodes
    shortNames:
    - ep
    singular: episode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.seriesRef
      name: Series
      type: string
    - jsonPath: .spec.seasonNumber
      name: Season
      type: integer
    - jsonPath: .spec.episodeNumber
      name: Episode
      type: integer
    - jsonPath: .status.title
      name: Title
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.hasFile
      name: File
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Aired")].status
      name: Aired
      type: string
    - jsonPath: .status.downloadPhase
      name: Download
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Episode is one episode of a Series. Episodes are created and owned by the
          Series controller and named <series>-s<NN>e<NN>, or <series>-<yyyy-mm-dd>
          for daily series.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EpisodeSpec defines the desired state of Episode. Episodes are created and
              owned by their Series; only Monitored is meant to be edited by users.
            properties:
              episodeNumber:
                description: EpisodeNumber is the episode number within the season.
                format: int32
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: episodeNumber is immutable
                  rule: self == oldSelf
              monitored:
                default: true
                description: |-
                  Monitored enables automatic searching for this episode, which also
                  needs its Series monitored. The Series controller sets it at creation
                  (per addOptions.monitor, a season override or monitorNewItems) and
                  when a season override changes; otherwise it belongs to the user.
                type: boolean
              seasonNumber:
                description: SeasonNumber is the season the episode belongs to; 0
                  is the specials season.
                format: int32
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: seasonNumber is immutable
                  rule: self == oldSelf
              seriesRef:
                description: SeriesRef is the name of the owning Series in the same
                  namespace.
                type: string
                x-kubernetes-validations:
                - message: seriesRef is immutable
                  rule: self == oldSelf
            required:
            - episodeNumber
            - seasonNumber
            - seriesRef
            type: object
          status:
            description: EpisodeStatus describes the observed state of Episode.
            properties:
              absoluteNumber:
                description: AbsoluteNumber is the absolute episode number, used for
                  anime.
                format: int32
                type: integer
              activeDownloadRef:
                description: ActiveDownloadRef is the Download currently working on
                  this episode.
                type: string
              airDate:
                description: AirDate is when the episode first aired.
                format: date-time
                type: string
              audio:
                description: |-
                  Audio is what the file's audio carries against the profile's audio
                  policy; unset when the profile has none (anime dual-audio spec §5.3).
                properties:
                  donor:
                    description: |-
                      Donor is the newest audio donor imported for this item: from the
                      item's Download with spec.purpose audioDonor whose import finished
                      (status.import.imported[].destPath, spec.release.title,
                      status.import.importedAt), carried forward from this status once
                      seen, so deleting the Download loses nothing (loop spec §2.6). A
                      MediaFile is named per file path, so an upgrade under a new filename
                      would lose it if it lived on the file.
                    properties:
                      downloadRef:
                        description: DownloadRef names the donor Download.
                        maxLength: 253
                        type: string
                      importedAt:
                        description: ImportedAt is when the donor's import finished.
                        format: date-time
                        type: string
                      path:
                        description: |-
                          Path is the reduced donor audio (<stem>.mka), which fileimport writes
                          at import.
                        maxLength: 4096
                        type: string
                      release:
                        description: Release is the donor Download's release title.
                        maxLength: 512
                        type: string
                    required:
                    - importedAt
                    - path
                    - release
                    type: object
                  graft:
                    description: Graft is the graft's state.
                    enum:
                    - none
                    - searching
                    - grabbed
                    - pending
                    - aligned
                    - failed
                    - done
                    type: string
                  missing:
                    description: Missing are Wanted less Present; empty when Present
                      is unknown.
                    items:
                      type: string
                    maxItems: 4
                    type: array
                  present:
                    description: |-
                      Present are the file's probed audio languages; empty when unknown.
                      Capped as MediaInfo.Audio is: a MULTi release carries 15-20 dubs.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  reason:
                    description: Reason says why, when Graft is failed.
                    maxLength: 1024
                    type: string
                  rejectedReleases:
                    description: |-
                      RejectedReleases are donor releases a graft of this item failed with
                      (status.graft.donorFault on its file); the donor search never takes
                      them again. Oldest dropped past MaxRejectedReleases.
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  wanted:
                    description: Wanted are the profile's languages, resolved to tags.
                    items:
                      type: string
                    maxItems: 4
                    type: array
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the episode's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 12
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cutoffMet:
                description: CutoffMet is true when the imported file meets the profile
                  cutoff.
                type: boolean
              donorSearchAttempts:
                description: |-
                  DonorSearchAttempts counts the audio donor searches made for this
                  episode (anime dual-audio spec §6.1): their own backoff, beside the
                  video's. Written by the grab worker with searchAttempts.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
              downloadPhase:
                description: |-
                  DownloadPhase is the phase of the entry on the Series covering this
                  episode, "" when none: a print column and a selectable field (ADR-0019
                  §6.2).
                enum:
                - Pending
                - Assigned
                - Queued
                - Downloading
                - Paused
                - Completed
                - Seeding
                - Imported
                - Failed
                - Blocklisted
                - Removing
                type: string
              fileFormatScore:
                description: FileFormatScore is the custom-format score of the imported
                  file.
                format: int32
                type: integer
              fileQuality:
                description: FileQuality is the quality of the imported file.
                properties:
                  modifier:
                    description: Modifier refines the quality (remux, screener, ...).
                    enum:
                    - none
                    - regional
                    - screener
                    - rawhd
                    - brdisk
                    - remux
                    type: string
                  name:
                    description: Name is the canonical quality definition name.
                    maxLength: 64
                    type: string
                  resolution:
                    description: Resolution is the vertical resolution in lines. Video
                      only.
                    enum:
                    - 0
                    - 360
                    - 480
                    - 540
                    - 576
                    - 720
                    - 1080
                    - 2160
                    format: int32
                    type: integer
                  source:
                    description: Source is the release source. Video only.
                    enum:
                    - unknown
                    - cam
                    - telesync
                    - telecine
                    - workprint
                    - dvd
                    - tv
                    - webdl
                    - webrip
                    - bluray
                    type: string
                required:
                - name
                type: object
              fileRef:
                description: FileRef is the name of the MediaFile backing the episode.
                type: string
              finaleType:
                description: FinaleType marks a season or series finale, e.g. "season"
                  or "series".
                type: string
              hasFile:
                description: HasFile is true while a MediaFile backs the episode.
                type: boolean
              images:
                description: Images are the episode's stills (type screenshot), from
                  TVDB.
                items:
                  description: Image is one artwork URL published by a metadata provider.
                  properties:
                    language:
                      description: |-
                        Language is the ISO 639-1 language of any text in the image, empty for
                        an image with none. The metadata gateway keeps the configured
                        language's images and the original language's side by side, so the
                        Plex provider can answer OriginalImage (spec 2026-09-30
                        plex-full-metadata-response §3.2).
                      type: string
                    type:
                      description: Type classifies the image.
                      enum:
                      - poster
                      - fanart
                      - banner
                      - logo
                      - clearart
                      - thumb
                      - screenshot
                      - disc
                      - headshot
                      type: string
                    url:
                      description: URL is where the image can be fetched.
                      type: string
                  required:
                  - type
                  - url
                  type: object
                maxItems: 4
                type: array
              lastSearchedAt:
                description: LastSearchedAt is when the episode was last searched
                  for.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              overview:
                description: Overview is the episode synopsis.
                type: string
              pendingGrab:
                description: PendingGrab is a chosen release waiting out a DelayProfile
                  delay.
                properties:
                  candidate:
                    description: |-
                      Candidate is the release this pending grab will be made from
                      (ADR-0019 §6.2), so the grab needs nothing but status.
                    properties:
                      grabbedBy:
                        description: GrabSource records what caused a release to be
                          grabbed.
                        enum:
                        - rss
                        - search
                        - interactive
                        - push
                        - redownload
                        type: string
                      manual:
                        type: boolean
                      purpose:
                        description: DownloadPurpose is what a Download is for.
                        enum:
                        - audioDonor
                        type: string
                      release:
                        description: |-
                          DownloadRelease is the capped subset of ReleaseInfo a grab keeps.
                          ReleaseInfo itself has no string caps, so it cannot go into status.
                        properties:
                          edition:
                            maxLength: 256
                            type: string
                          formatScore:
                            format: int32
                            type: integer
                          guid:
                            description: 'GUID is identity: a longer one is refused
                              at admission, never clamped.'
                            maxLength: 1024
                            type: string
                          indexerName:
                            maxLength: 253
                            type: string
                          indexerRef:
                            maxLength: 253
                            type: string
                          infoHash:
                            pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
                            type: string
                          languages:
                            items:
                              maxLength: 35
                              type: string
                            maxItems: 16
                            type: array
                            x-kubernetes-list-type: atomic
                          protocol:
                            description: Protocol is the transfer protocol of an indexer,
                              download client or release.
                            enum:
                            - torrent
                            - usenet
                            type: string
                          quality:
                            description: |-
                              Quality identifies a quality definition. For video the name is derived from
                              the (source, resolution, modifier) tuple; for music, books, audiobooks and
                              comics it is a table name such as FLAC, MP3-320, EPUB, M4B or CBZ.
                            properties:
                              modifier:
                                description: Modifier refines the quality (remux,
                                  screener, ...).
                                enum:
                                - none
                                - regional
                                - screener
                                - rawhd
                                - brdisk
                                - remux
                                type: string
                              name:
                                description: Name is the canonical quality definition
                                  name.
                                maxLength: 64
                                type: string
                              resolution:
                                description: Resolution is the vertical resolution
                                  in lines. Video only.
                                enum:
                                - 0
                                - 360
                                - 480
                                - 540
                                - 576
                                - 720
                                - 1080
                                - 2160
                                format: int32
                                type: integer
                              source:
                                description: Source is the release source. Video only.
                                enum:
                                - unknown
                                - cam
                                - telesync
                                - telecine
                                - workprint
                                - dvd
                                - tv
                                - webdl
                                - webrip
                                - bluray
                                type: string
                            required:
                            - name
                            type: object
                          releaseGroup:
                            maxLength: 256
                            type: string
                          revision:
                            description: Revision records the proper/repack revision
                              of a release.
                            properties:
                              real:
                                default: 0
                                description: Real counts REAL re-releases that fix
                                  a broken proper.
                                format: int32
                                type: integer
                              repack:
                                default: false
                                description: Repack is true when the release is flagged
                                  as a repack.
                                type: boolean
                              version:
                                default: 1
                                description: |-
                                  Version is the release version; 1 is the original, 2+ are propers.
                                  It has no omitempty, so a Go client always sends it and the default
                                  never applies; 0 has no meaning, and every comparison (pkg/quality,
                                  pkg/decision) floors it to 1, so an unparsed revision reads as the
                                  original rather than as older than one.
                                format: int32
                                type: integer
                            type: object
                          sizeBytes:
                            format: int64
                            type: integer
                          title:
                            description: |-
                              Title is clamped on a rune boundary; it is for display and the
                              blocklist's title match.
                            maxLength: 512
                            type: string
                        required:
                        - protocol
                        - title
                        type: object
                      score:
                        format: int32
                        type: integer
                      source:
                        description: |-
                          DownloadSource says where the transfer payload comes from. Exactly one of
                          the four members is set. There is intentionally no inline bytes field: a
                          .torrent or .nzb body is never embedded in the object. Either the payload is
                          addressable by URL, or indexerDownload names the release and grabarr
                          resolves it through indexarr.
                        properties:
                          expectedInfoHash:
                            description: |-
                              ExpectedInfoHash is the info hash the resolved torrent must have. The
                              engine refuses a mismatch, which stops an indexer from swapping content
                              out from under a grab decision. Torrent only.
                            pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
                            type: string
                          indexerDownload:
                            description: |-
                              IndexerDownload names a release to resolve through indexarr. This is the
                              normal path: the indexer applies auth, rate limits and proxying, and
                              returns the payload to the engine.
                            properties:
                              guid:
                                description: |-
                                  GUID is the indexer-scoped unique identifier of the release. It is the
                                  input to the Download's deterministic name.
                                minLength: 1
                                type: string
                              indexerRef:
                                description: |-
                                  IndexerRef is the name of the Indexer that published the release, in the
                                  same namespace as the Download.
                                minLength: 1
                                type: string
                              url:
                                description: |-
                                  URL is the indexer's download link for the release. grabarr fetches it
                                  through indexarr, which applies the indexer's auth and proxy settings.
                                maxLength: 2048
                                type: string
                            required:
                            - guid
                            - indexerRef
                            type: object
                          magnetURL:
                            description: MagnetURL is a magnet link the torrent engine
                              can add directly.
                            maxLength: 4096
                            pattern: ^magnet:\?.+$
                            type: string
                          nzbURL:
                            description: NZBURL is a directly fetchable .nzb URL that
                              needs no indexer credentials.
                            maxLength: 2048
                            type: string
                          torrentURL:
                            description: |-
                              TorrentURL is a directly fetchable .torrent URL that needs no indexer
                              credentials.
                            maxLength: 2048
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of magnetURL, torrentURL, nzbURL or
                            indexerDownload must be set
                          rule: '(has(self.magnetURL) ? 1 : 0) + (has(self.torrentURL)
                            ? 1 : 0) + (has(self.nzbURL) ? 1 : 0) + (has(self.indexerDownload)
                            ? 1 : 0) == 1'
                    required:
                    - grabbedBy
                    - release
                    - source
                    type: object
                  episodes:
                    description: Episodes and Issues name what a Series' or Comic's
                      pending grab covers.
                    items:
                      description: |-
                        EpisodeNumber is one episode a Series entry or pending grab covers, in
                        the Series' stored order.
                      properties:
                        number:
                          format: int32
                          minimum: 0
                          type: integer
                        season:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - number
                      - season
                      type: object
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: atomic
                  grabAt:
                    description: GrabAt is when the delay expires and the grab will
                      be issued.
                    format: date-time
                    type: string
                  issues:
                    items:
                      maxLength: 16
                      type: string
                    maxItems: 200
                    type: array
                    x-kubernetes-list-type: atomic
                  protocol:
                    description: Protocol is the transfer protocol of the pending
                      release.
                    enum:
                    - torrent
                    - usenet
                    type: string
                  releaseTitle:
                    description: |-
                      ReleaseTitle is the raw title of the release that will be grabbed,
                      clamped on a rune boundary (a stored longer value stays valid under
                      validation ratcheting).
                    maxLength: 512
                    type: string
                required:
                - grabAt
                - releaseTitle
                type: object
              phase:
                description: Phase is the coarse lifecycle state of the episode.
                enum:
                - Unaired
                - Wanted
                - Delayed
                - Downloading
                - Imported
                - Transcoded
                - CutoffUnmet
                - CutoffUnevaluated
                - Unmonitored
                type: string
              plexID:
                description: |-
                  PlexID is the episode's id in Plex's own metadata service, without
                  the plex://episode/ prefix; the ui's Plex provider answers the
                  episode with it as plex://episode/<id>. Written beside tvdbID and
                  kept when a later episode list carries none.
                pattern: ^[0-9a-f]{24}$
                type: string
              runtimeMinutes:
                description: RuntimeMinutes is the episode runtime in minutes.
                format: int32
                type: integer
              sceneNumbering:
                description: SceneNumbering is the numbering scene releases use for
                  this episode.
                properties:
                  absolute:
                    description: Absolute is the scene absolute episode number.
                    format: int32
                    type: integer
                  episode:
                    description: Episode is the scene episode number.
                    format: int32
                    type: integer
                  season:
                    description: Season is the scene season number.
                    format: int32
                    type: integer
                  unverified:
                    description: Unverified is true when the mapping has not been
                      confirmed upstream.
                    type: boolean
                type: object
              searchAttempts:
                description: SearchAttempts counts the searches made for this episode.
                properties:
                  count:
                    description: Count is the total number of attempts so far.
                    format: int32
                    type: integer
                  initial:
                    description: Initial is when the first attempt was made.
                    format: date-time
                    type: string
                  latest:
                    description: Latest is when the most recent attempt was made.
                    format: date-time
                    type: string
                type: object
              searchDispatch:
                description: |-
                  SearchDispatch is the outstanding search task (ADR-0019 §7.3), written
                  under catalogarr-grab.
                properties:
                  answeredSeq:
                    description: |-
                      AnsweredSeq is the Seq of the last dispatch closed: by an incorporated
                      answer, a withdrawal or a timeout. A task is in flight while
                      Seq > AnsweredSeq.
                    format: int64
                    minimum: 0
                    type: integer
                  delivery:
                    description: |-
                      Delivery is what the manager knows about the task between publish
                      and answer. Written on transitions only (ADR-0019 §8.3), never per
                      nak.
                    properties:
                      attempts:
                        description: Attempts is the deliveries count of the last
                          nak the manager recorded.
                        format: int32
                        type: integer
                      deadLetteredAt:
                        format: date-time
                        type: string
                      lastNakAt:
                        format: date-time
                        type: string
                      message:
                        maxLength: 256
                        type: string
                      reason:
                        description: |-
                          Reason when waiting or retrying: Budget, Paced, NoAgent,
                          NoCapableAgent, EngineNotReady, Rebuilding, Nak.
                        maxLength: 64
                        type: string
                      state:
                        description: |-
                          DeliveryPhase is where a dispatched task is between its publish and its
                          answer (ADR-0019 §8.3).
                        enum:
                        - waiting
                        - published
                        - claimed
                        - retrying
                        - deadLettered
                        type: string
                    required:
                    - state
                    type: object
                  destination:
                    description: |-
                      Destination is the durable, pool or engine instance the task went to
                      (ADR-0019 §8.3).
                    maxLength: 253
                    type: string
                  dispatchedAt:
                    description: |-
                      DispatchedAt is when Seq was issued; the republish window and the
                      request timeout run from it.
                    format: date-time
                    type: string
                  seq:
                    description: Seq is the sequence of the last task issued for this
                      remediation.
                    format: int64
                    minimum: 1
                    type: integer
                  withdrawn:
                    description: |-
                      Withdrawn is true when the dispatch at Seq was closed by a withdrawal,
                      not by an answer. For transcode and graft a fact (a change already
                      made on disk) can still land after that: the planner keeps reading
                      the record while Withdrawn is true and now < DispatchedAt +
                      records.FactWindow, and incorporates a fact at Seq whatever the phase
                      (§4.10, §5.9). Incorporating it clears Withdrawn.
                    type: boolean
                required:
                - dispatchedAt
                - seq
                type: object
              title:
                description: Title is the episode title.
                type: string
              tvdbID:
                description: TvdbID is the TheTVDB episode ID.
                format: int64
                type: integer
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.seriesRef
    - jsonPath: .status.downloadPhase
    served: true
    storage: true
    subresources:
      status: {}
