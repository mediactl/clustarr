apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nats
        image: nats:2.15.0-alpine
        args:
        - --config
        - /etc/nats/nats.conf
        env:
        - name: SERVER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: nats
          containerPort: 4222
        - name: monitor
          containerPort: 8222
        startupProbe:
          httpGet:
            path: /healthz?js-server-only=true
            port: monitor
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: monitor
          periodSeconds: 30
        # Enter lame-duck mode so clients reconnect cleanly before the pod stops.
        lifecycle:
          preStop:
            exec:
              command: ["nats-server", "-sl=ldm=/var/run/nats/nats.pid"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/nats
          readOnly: true
        - name: data
          mountPath: /data
        - name: pid
          mountPath: /var/run/nats
      volumes:
      - name: config
        configMap:
          name: nats-config
      - name: pid
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
