apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    # Dev/kind configuration: single server, no cluster block (R1 streams).
    server_name: $SERVER_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256Mi
      # Keep below the PVC size in statefulset.yaml.
      max_file_store: 20Gi
    }

    # Homelab-friendly limits (§12 of the design spec).
    max_payload: 8Mi
    write_deadline: "10s"
    lame_duck_grace_period: "10s"
    lame_duck_duration: "30s"
