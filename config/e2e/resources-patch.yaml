# Applied to every Deployment the overlay renders (every Clustarr workload in
# config/manager plus every fixture stub Deployment this overlay adds) so
# they all fit one small kind node inside the `make e2e` timeout. Every
# Deployment has exactly one container at index 0 and declares
# resources.requests. Replicas are not patched: the autoscaled agents and
# markers have no spec.replicas (a JSON6902 replace would fail), and every
# other workload already runs one.
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: "25m"
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/memory
  value: "64Mi"
