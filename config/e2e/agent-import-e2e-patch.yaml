# Points the Trakt and Plex import-list providers at
# config/e2e/importlist-stub.yaml's fixture (test/fixtures/importliststub),
# which serves Trakt's device-code flow and watchlists and the Plex Discover
# watchlist at its root. The e2e cluster has no egress, so without this both
# providers would dial the real public APIs and every sync would time out.
#
# Applied to the manager, whose ImportList controller drives the Trakt
# device-code flow, and to agent-import, which runs the watchlist syncs and
# the token refresh -- one host for both, so the device authorization and the
# syncs it authorizes agree (the manager reads only CLUSTARR_TRAKT_BASE_URL).
# The variables are the environment of `--trakt-base-url`/`--plex-base-url`
# (internal/cli).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CLUSTARR_TRAKT_BASE_URL
    value: http://importlist-stub.clustarr-system.svc
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CLUSTARR_PLEX_BASE_URL
    value: http://importlist-stub.clustarr-system.svc
