# The nine metadata providers the e2e scenarios need, pointed at the
# in-cluster stubs this overlay deploys. tmdb and tvdb's credentials are
# placeholders: neither stub checks them, but pkg/metadata/clients/tmdb's
# golang-tmdb Init rejects an empty api key and the TVDB client posts
# apiKey+pin to /login, so both keys must be present and non-empty.
#
# musicbrainz, openlibrary, audnexus and comicvine (Phase G, G4-1), and
# since the 2026-11-10 non-video parity coverart, wikipedia and audible, all
# point at the ONE nonvideo-stub Service (nonvideo-stub.yaml), differing
# only in spec.baseURL's path prefix -- see that Service's own doc comment
# for why one process can serve every real upstream shape. Only comicvine
# needs a secretRef; the others need none (app/catalog/metadata/registry.go's
# BuildRegistry). The three keyless ones must exist before the manager
# starts: metadataprovider.SeedDefaults would otherwise seed each type at
# its live host, unreachable without egress.
apiVersion: v1
kind: Secret
metadata:
  name: tmdb-fixture-credentials
  namespace: clustarr-system
stringData:
  apiKey: e2e-fixture-key
---
apiVersion: v1
kind: Secret
metadata:
  name: tvdb-fixture-credentials
  namespace: clustarr-system
stringData:
  apiKey: e2e-fixture-key
  pin: e2e-fixture-pin
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: tmdb
  namespace: clustarr-system
spec:
  type: tmdb
  enabled: true
  secretRef:
    name: tmdb-fixture-credentials
  baseURL: http://tmdb-stub.clustarr-system.svc
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: tvdb
  namespace: clustarr-system
spec:
  type: tvdb
  enabled: true
  secretRef:
    name: tvdb-fixture-credentials
  baseURL: http://tvdb-stub.clustarr-system.svc
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: musicbrainz
  namespace: clustarr-system
spec:
  type: musicbrainz
  enabled: true
  contactUserAgent: "Clustarr-e2e/0.1 (https://github.com/mediactl/clustarr)"
  baseURL: http://nonvideo-stub.clustarr-system.svc/musicbrainz
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: openlibrary
  namespace: clustarr-system
spec:
  type: openlibrary
  enabled: true
  contactUserAgent: "Clustarr-e2e/0.1 (https://github.com/mediactl/clustarr)"
  baseURL: http://nonvideo-stub.clustarr-system.svc/openlibrary
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: audnexus
  namespace: clustarr-system
spec:
  type: audnexus
  enabled: true
  baseURL: http://nonvideo-stub.clustarr-system.svc/audnexus
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: comicvine
  namespace: clustarr-system
spec:
  type: comicvine
  enabled: true
  secretRef:
    name: comicvine-fixture-credentials
  baseURL: http://nonvideo-stub.clustarr-system.svc/comicvine
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: coverart
  namespace: clustarr-system
spec:
  type: coverart
  enabled: true
  contactUserAgent: "Clustarr-e2e/0.1 (https://github.com/mediactl/clustarr)"
  baseURL: http://nonvideo-stub.clustarr-system.svc/coverart
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: wikipedia
  namespace: clustarr-system
spec:
  type: wikipedia
  enabled: true
  contactUserAgent: "Clustarr-e2e/0.1 (https://github.com/mediactl/clustarr)"
  baseURL: http://nonvideo-stub.clustarr-system.svc/wikipedia
---
apiVersion: catalog.clustarr.io/v1alpha1
kind: MetadataProvider
metadata:
  name: audible
  namespace: clustarr-system
spec:
  type: audible
  enabled: true
  contactUserAgent: "Clustarr-e2e/0.1 (https://github.com/mediactl/clustarr)"
  baseURL: http://nonvideo-stub.clustarr-system.svc/audible
