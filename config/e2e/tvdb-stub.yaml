# The in-cluster tvdb stub: it re-serves testdata/metadata/tvdb's recorded JSON
# and nothing else, so no controller in the e2e cluster ever reaches the real
# Internet. The readiness probe is a real fixture route, which means a pod that
# was built without the recorded JSON never goes Ready instead of failing a
# scenario twenty minutes later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvdb-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: tvdb-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tvdb-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustarr
        app.kubernetes.io/part-of: clustarr
        app.kubernetes.io/component: tvdb-stub
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tvdb-stub
        image: ghcr.io/mediactl/clustarr-e2e-fixtures:dev
        imagePullPolicy: IfNotPresent
        args: ["tvdb-stub", "--addr=:8080"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /series/121361/extended
            port: http
          initialDelaySeconds: 1
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /series/121361/extended
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tvdb-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: tvdb-stub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: tvdb-stub
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
