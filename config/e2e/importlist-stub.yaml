# The in-cluster fixture for pkg/importlist's Trakt, Plex and mdblist
# providers (test/fixtures/importliststub). Trakt (device-code flow and
# watchlists) and Plex (Discover watchlist) reach it through importarr's
# --trakt-base-url/--plex-base-url, which importarr-e2e-patch.yaml sets on
# both importarr Deployments (X14). mdblist needs no override:
# MdbList.URL is a required, fully operator-supplied spec field, so
# test/e2e's scenario 9 ImportList CR points it straight at this Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: importlist-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: importlist-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: importlist-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustarr
        app.kubernetes.io/part-of: clustarr
        app.kubernetes.io/component: importlist-stub
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importlist-stub
          image: ghcr.io/mediactl/clustarr/e2e-fixtures:dev
          imagePullPolicy: IfNotPresent
          args: ["importlist-stub", "--addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /mdblist/list.json
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /mdblist/list.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: importlist-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: importlist-stub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: importlist-stub
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
