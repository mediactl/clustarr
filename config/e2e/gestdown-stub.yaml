# The in-cluster fixture Gestdown (api.gestdown.info) upstream: a real show
# lookup and subtitle search/download in the wire shapes
# pkg/subtitles/providers/gestdown's client sends and parses, and nothing
# else. No Secret: Gestdown has no credentials (providerset.Entry's gestdown
# branch reads no secret at all).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestdown-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: gestdown-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gestdown-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustarr
        app.kubernetes.io/part-of: clustarr
        app.kubernetes.io/component: gestdown-stub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gestdown-stub
          image: ghcr.io/mediactl/clustarr/e2e-fixtures:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "gestdown-stub",
              "--addr=:8080",
              "--request-log=/data/.e2e-fixtures/gestdown/requests.jsonl",
            ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /shows/external/tvdb/121361
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /shows/external/tvdb/121361
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # resources.requests must be present or config/e2e/resources-patch.yaml's
          # `replace` operations fail on this Deployment -- that patch targets
          # kind: Deployment with no name selector, so it lands here too.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
---
apiVersion: v1
kind: Service
metadata:
  name: gestdown-stub
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: gestdown-stub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gestdown-stub
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
