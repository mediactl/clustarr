# app/indexer/status.StartupGrace is 15 minutes from PROCESS START, and it
# suppresses escalation for failures inside that window (ruling R17). `make
# e2e` has a fixed budget, and how old the processes that judge indexer
# health are when scenario 17 runs depends entirely on how long the scenarios
# before it took -- so with the production grace the backoff assertions pass
# or fail for reasons unrelated to the code under test. Zero here; 15m
# everywhere else. Applied to the manager (its Indexer controller runs the
# health ladder) and to agent-index (which reports the outcomes).
#
# NOTE, and read it before deleting this as dead configuration: nothing reads
# this variable yet. StartupGrace is a const in app/indexer/status/health.go
# and no flag plumbs an override. It is declared here so the plumbing lands
# configured the day it exists.
#
# test/e2e does NOT trust its presence -- whether the deployed image honours
# it cannot be observed from outside the process, so scenario 17's
# startup-grace wait always allows for the real 15-minute grace on the
# escalation wait's DEADLINE and simply returns early when the ladder moves
# sooner. The one thing test/e2e does assert about it is that, when declared,
# the value is 0s.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CLUSTARR_INDEXER_STARTUP_GRACE
    value: "0s"
