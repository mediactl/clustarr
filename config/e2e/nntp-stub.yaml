# Two in-cluster fixture usenet servers, nntp-stub-a and nntp-stub-b --
# deliberately separate Deployments of the SAME fixture image (following
# config/e2e/torznab-stub.yaml's pattern) with different flags, so
# test/e2e/download_test.go's TestDownloadUsenetNoInfoHashWithCrossServer
# Failover can prove a real 430 cross-server failover: nntp-stub-a denies
# the fixture's first article, nntp-stub-b (identical --segment-bytes, no
# --deny) serves it, and pkg/download/usenet's connection pool must fail
# over from the former to the latter.
#
# --segment-bytes=1048576 (1MiB) is deliberately NOT nntpstub.
# DefaultSegmentBytes (16KiB): with --content-path's real ~55MiB clip
# instead of a synthetic payload, 16KiB segments would mean roughly 3500
# articles per Download -- still correct, but a lot of avoidable NNTP round
# trips for an e2e run that has to fit a 30-minute Makefile timeout. 1MiB
# matches pkg/download/usenet/conn.go's own "real posts run 512KiB-768KiB"
# comment closely enough while keeping article count (~55) small.
#
# The --deny value on nntp-stub-a is test/fixtures/nntpstub.Build's own
# deterministic ID formula (fixture.go: fmt.Sprintf("seg%d.%d@clustarr.
# fixture.test", 0, segmentBytes)) evaluated by hand for segment 0 at
# --segment-bytes=1048576 -- "seg0.1048576@clustarr.fixture.test". This is
# the SAME formula BuildFromFile uses (fixture.go's own doc comment), so it
# names the real first article of whatever nntp-stub-a actually builds from
# --content-path, not a value decoupled from it. test/e2e/download_test.go
# recomputes the identical string with nntpstub.Build(fixtureNNTPSegment
# Bytes, 0).Articles[0].ID (helpers_test.go's fixtureNNTPSegmentBytes,
# which MUST equal this file's --segment-bytes on both Deployments) rather
# than hard-coding it a second time, so the two can never silently diverge
# without a compile-time constant to keep in sync landing on the test side
# too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nntp-stub-a
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: nntp-stub-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nntp-stub-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustarr
        app.kubernetes.io/part-of: clustarr
        app.kubernetes.io/component: nntp-stub-a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nntp-stub
          image: ghcr.io/mediactl/clustarr/e2e-fixtures:dev
          imagePullPolicy: IfNotPresent
          args:
            [
              "nntp-stub",
              "--addr=:1119",
              "--http-addr=:8080",
              "--segment-bytes=1048576",
              "--content-path=/fixtures/media/tiny.mkv",
              "--deny=seg0.1048576@clustarr.fixture.test",
              "--request-log=/data/.e2e-fixtures/nntp-a/requests.jsonl",
            ]
          ports:
            - name: nntp
              containerPort: 1119
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /fixture.nzb
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /fixture.nzb
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
---
apiVersion: v1
kind: Service
metadata:
  name: nntp-stub-a
  namespace: clustarr-system
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: nntp-stub-a
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: nntp-stub-a
  ports:
    - name: nntp
      port: 1119
      targetPort: nntp
      protocol: TCP
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
