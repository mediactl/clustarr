# OPTIONAL and EXAMPLE ONLY -- not part of any supported install.
#
# The supported transcode path (§6.4) is: squasharr's TranscodeJob controller
# creates each batch/v1 Job *suspended* and unsuspends it when a slot frees up
# against `--slots cpu=2,nvidia=1,intel=1`. That scheduler exists because GPU
# slots are a fixed physical resource and because each Job must be tied back
# to the TranscodeJob CR that owns it.
#
# A KEDA ScaledJob is the alternative for a cluster with elastic CPU capacity
# and no GPU contention: drop the slot budget, let queue depth create pods.
# The two are mutually exclusive -- running both double-schedules transcodes.
# Adapt the podTemplate to your profile before using this.
#
# What a worker pod needs, and why each line below is there (the same
# contract app/squash/controller/transcodejob/job.go renders for its own
# Jobs; test/e2e's TestKEDATranscodeScaledJobRenders holds the first two):
#
#   * serviceAccountName squasharr-worker. The worker's RBAC is its own
#     ClusterRole (config/rbac/squasharr_worker_role.yaml, generated from
#     app/squash/worker's markers) bound to that account only; the controller's
#     `squasharr` account holds none of it.
#   * --job <TranscodeJob name>. `squasharr --role worker` refuses to start
#     without it (squasharr.Options.Validate): a worker transcodes exactly the
#     one TranscodeJob it is named for, and POD_NAMESPACE names that job's
#     namespace. KEDA starts identical pods and cannot hand each one a
#     different TranscodeJob, so CLUSTARR_TRANSCODE_JOB below is where YOUR
#     adaptation supplies the name -- this is the part that makes this file a
#     template rather than a working autoscaler, and why ruling R7 keeps it
#     an example.
#   * The trigger's query is also yours to supply: squasharr exports no
#     queue-depth metric (pkg/obs/metrics has clustarr_transcode_jobs_active
#     and the duration/speed/size series only; the clustarr_transcode_slots
#     series this file used to query never existed), so
#     your_transcode_queue_depth below is a placeholder for a metric you
#     provide, for example kube-state-metrics' custom-resource state over
#     TranscodeProfile.status.pendingJobs.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: squasharr-transcode
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: squasharr-worker
spec:
  pollingInterval: 30
  maxReplicaCount: 4
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Never interrupt a running transcode to scale down.
  scalingStrategy:
    strategy: default
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 2
    # 1080p sizing from §12; 2160p wants 8 CPU / 8Gi.
    activeDeadlineSeconds: 21600
    ttlSecondsAfterFinished: 3600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: clustarr
          app.kubernetes.io/part-of: clustarr
          app.kubernetes.io/component: squasharr-worker
      spec:
        restartPolicy: Never
        serviceAccountName: squasharr-worker
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: ghcr.io/mediactl/clustarr/media:dev
            args:
              - squasharr
              - --role
              - worker
              - --job
              - $(CLUSTARR_TRANSCODE_JOB)
              - --data-dir
              - /data
            env:
              # The worker never uses the bus (Phase E ruling R6), so no
              # NATS_URL.
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: CLUSTARR_TRANSCODE_JOB
                value: "set-by-your-adaptation"
              - name: UMASK
                value: "002"
              # §6.4: ffmpeg gets `pools=<cpu limit>` from the Downward API.
              - name: CLUSTARR_CPU_LIMIT
                valueFrom:
                  resourceFieldRef:
                    containerName: worker
                    resource: limits.cpu
            resources:
              requests:
                cpu: "4"
                memory: 4Gi
              limits:
                cpu: "8"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              - name: data
                mountPath: /data
              - name: scratch
                mountPath: /scratch
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: clustarr-data
          - name: scratch
            emptyDir: {}
          - name: tmp
            emptyDir: {}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        query: |-
          sum(your_transcode_queue_depth)
        threshold: "1"
