# agent-trailers -- trailers for the Movies and Series Plex's metadata service
# has none for (agent --domain=trailers, ADR-0023). Optional, and not part of
# config/default: it fetches each trailer from the page TMDB or TheTVDB names
# with yt-dlp, the one outside program clustarr runs, in the trailers image
# (native plus that program). One replica. Mounts /data read-write and keeps
# each trailer under its item's root folder at .clustarr/trailers/; records
# them in clustarr-trailers. The ui's --plex-path-map tells Plex where the
# files are.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-trailers
---
apiVersion: v1
kind: Service
metadata:
  name: agent-trailers
  labels:
    app.kubernetes.io/component: agent-trailers
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-trailers
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-trailers
  labels:
    app.kubernetes.io/component: agent-trailers
spec:
  # Exactly one, Recreate: the sweeper is the clustarr-trailers bucket's only
  # writer (ADR-0023).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-trailers
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-trailers
    spec:
      serviceAccountName: agent-trailers
      # It drains no durable; a fetch in flight is abandoned and made again.
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-trailers
          image: ghcr.io/mediactl/clustarr/trailers:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=trailers"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: UMASK
              value: "002"
            # AUTOMEMLIMIT: the binary takes 60% of its memory limit, read from
            # its cgroup, as its Go memory limit (automemlimit; 90% where
            # unset): FFmpeg allocates outside the Go heap (OD42).
            - name: AUTOMEMLIMIT
              value: "0.60"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: logging
              mountPath: /etc/clustarr
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
        - name: logging
          configMap:
            name: clustarr-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-agent-trailers-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-agent-trailers-role
subjects:
- kind: ServiceAccount
  name: agent-trailers
  namespace: clustarr-system
