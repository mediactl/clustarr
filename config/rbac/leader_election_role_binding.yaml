# Leader-election RoleBinding per service ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-catalogarr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: catalogarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-catalogarr-metadata-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: catalogarr-metadata
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-indexarr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: indexarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-grabarr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: grabarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-squasharr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: squasharr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-captionarr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: captionarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-captionarr-worker-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: captionarr-worker
  namespace: clustarr-system
---
# importarr and importarr-worker (amendment §A1.6). Both are listed for the
# same reason catalogarr-metadata, indexarr and captionarr-worker are, even
# though only importarr passes --leader-elect today: the binding follows the
# ServiceAccount, not the flag, so flipping --leader-elect on in a manifest
# never has to be paired with an RBAC edit. The Helm chart already does this
# -- charts/clustarr/templates/rbac.yaml drives both the ClusterRoleBinding
# and the leader-election RoleBinding from one $components list -- and
# TestChartAndKustomizeAgreePerComponent keeps the two in step.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-importarr-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: importarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-importarr-worker-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: importarr-worker
  namespace: clustarr-system
