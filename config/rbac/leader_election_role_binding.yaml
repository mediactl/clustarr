# Leader election: only the manager elects (lease manager.clustarr.io, spec
# 2026-10-06 §5.8); agents never do.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustarr-manager-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustarr-leader-election-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: clustarr-system
