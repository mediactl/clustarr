# One ClusterRoleBinding per identity (spec 2026-10-06 §10.2.4), each to its
# own ClusterRole, which `make manifests` generates from that identity's
# packages' +kubebuilder:rbac markers (RBAC_ROLES in the Makefile). Every
# agent role and the engine role are read-only; the manager's alone writes.
# grab-engine is the identity of the engine pods the manager's DownloadClient
# controller renders (--engine-service-account); it holds only the engines'
# own role. ui is bound in ui_role_binding.yaml; markers and the transcode
# pool and graft Jobs mount no ServiceAccount token and hold no role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-manager-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-agent-catalog-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
