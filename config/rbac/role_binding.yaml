# One ClusterRoleBinding per service ServiceAccount (§3: each service is its
# own Deployment with its own RBAC), each to its OWN service's ClusterRole
# (§10), which `make manifests` generates from that service's
# +kubebuilder:rbac markers alone (see RBAC_ROLES in the Makefile). A
# service's second Deployment -- catalogarr-metadata, importarr-worker,
# captionarr-worker -- runs the same packages under another role, so it
# shares its service's role.
#
# grabarr-engine is the identity of the engine pods the DownloadClient
# controller creates (grabarr --engine-service-account); it holds only the
# engines' own role, never grabarr's. The transcode Jobs' squasharr-worker
# and ui are bound in their own files.
#
# Until task X14 all of these pointed at one union clustarr-manager-role,
# so every service held every other service's grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-catalogarr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-catalogarr-role
subjects:
- kind: ServiceAccount
  name: catalogarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-catalogarr-metadata-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-catalogarr-role
subjects:
- kind: ServiceAccount
  name: catalogarr-metadata
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-importarr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-importarr-role
subjects:
- kind: ServiceAccount
  name: importarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-importarr-worker-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-importarr-role
subjects:
- kind: ServiceAccount
  name: importarr-worker
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-indexarr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-indexarr-role
subjects:
- kind: ServiceAccount
  name: indexarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-grabarr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-grabarr-role
subjects:
- kind: ServiceAccount
  name: grabarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-grabarr-engine-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-grabarr-engine-role
subjects:
- kind: ServiceAccount
  name: grabarr-engine
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-squasharr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-squasharr-role
subjects:
- kind: ServiceAccount
  name: squasharr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-captionarr-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-captionarr-role
subjects:
- kind: ServiceAccount
  name: captionarr
  namespace: clustarr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-captionarr-worker-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-captionarr-role
subjects:
- kind: ServiceAccount
  name: captionarr-worker
  namespace: clustarr-system
# ui is deliberately absent here: it has no controller-runtime manager, and
# its grants -- reads, plus exactly the creates and spec patches ui/actions
# makes (Phase G ruling R2) -- are its own hand-written role. Its binding is
# ui_role_binding.yaml.
