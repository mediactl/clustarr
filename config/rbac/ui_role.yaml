# ui's ClusterRole is hand-written and stays hand-written (design plan
# ruling R3, docs/superpowers/plans/2026-09-22-phase-d3-ui.md).
#
# Two reasons, and the second is the real one. A +kubebuilder:rbac marker in
# ui/ would have merged into the old shared clustarr-manager-role and handed
# every controller the UI's grants (roles are per service since task X14,
# but the next point stands) -- and a marker can only ADD verbs; there is no marker that
# expresses "and never write status". The UI's write limits (CLAUDE.md: "The
# UI never writes status and owns no CRD") are therefore a property of THIS
# document, not of controller-gen's output, and cmd/clustarr/ui_rbac_test.go
# parses it to assert they hold.
#
# Reads: get/list/watch over the catalog, download, transcode and subtitle
# groups -- every resource in each, not only the ones today's pages read,
# because re-deriving this file's scope every time a later page needs one
# more kind is exactly the kind of drift a hand-written, rarely-touched file
# invites. index.clustarr.io is the one exception: only "indexers" is
# granted at first (the Settings page's own kind, Task G3-4);
# indexerdefinitions and indexerproxies followed with the settings CRUD
# design (2026-09-24), which lists them in the Indexer form's pickers.
#
# Writes (Phase G ruling R2, docs/superpowers/plans/2026-09-23-phase-g-parity.md;
# amendment §A3.2 and, for the Settings-page patches, the G3-4 note under
# ruling R2): exactly what ui/actions' actions need and nothing else --
# create on searches ("search now") and libraryscans ("rescan"), patch on
# the ten catalog kinds that have a spec.monitored ("monitor this"), and
# patch on each of the eight Settings-page kinds (RootFolder, QualityProfile,
# MetadataProvider, Indexer, DownloadClient, SubtitleProvider,
# SubtitleProfile, TranscodeProfile), each sent as a JSON merge patch of that
# kind's own modest field set (ui/actions/settings.go) under field manager
# clustarr-ui. ui/actions.Grants() declares the same set; the RBAC guard
# holds this file's write verbs to exactly it.
#
# Settings CRUD (docs/superpowers/specs/2026-09-24-settings-crud-design.md):
# create and delete on the same eight kinds, so the Settings page can add
# and remove what it edits; create and patch on secrets -- never get, list
# or watch -- so the credentials a form collects can be stored without any
# page being able to read one back; and reads on indexerdefinitions and
# indexerproxies for the Indexer form's pickers.
#
# Never: any resource ending in "/status" (not even to read it), update or
# deletecollection, a wildcard, or a write verb on any resource outside
# that set. The UI edits spec; the controllers own status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustarr-ui-role
rules:
- apiGroups:
  - catalog.clustarr.io
  resources:
  - albums
  - artists
  - audiobooks
  - authors
  - books
  - comics
  - delayprofiles
  - episodes
  - importexclusions
  - importlists
  - issues
  - libraryscans
  - mediafiles
  - metadataproviders
  - movies
  - qualityprofiles
  - rootfolders
  - searches
  - series
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - download.clustarr.io
  resources:
  - downloadclients
  - downloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - index.clustarr.io
  resources:
  - indexerdefinitions
  - indexerproxies
  - indexers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - subtitle.clustarr.io
  resources:
  - subtitleprofiles
  - subtitleproviders
  - subtitlerequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - transcode.clustarr.io
  resources:
  - transcodejobs
  - transcodeprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - libraryscans
  - searches
  verbs:
  - create
- apiGroups:
  - catalog.clustarr.io
  resources:
  - albums
  - artists
  - audiobooks
  - authors
  - books
  - comics
  - episodes
  - issues
  - movies
  - series
  verbs:
  - patch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - metadataproviders
  - qualityprofiles
  - rootfolders
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - index.clustarr.io
  resources:
  - indexers
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - download.clustarr.io
  resources:
  - downloadclients
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - subtitle.clustarr.io
  resources:
  - subtitleprofiles
  - subtitleproviders
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - transcode.clustarr.io
  resources:
  - transcodeprofiles
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - patch
