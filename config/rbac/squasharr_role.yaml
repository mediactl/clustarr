---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustarr-squasharr-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - update
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - episodes
  - mediafiles
  - movies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - rootfolders
  verbs:
  - list
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - transcode.clustarr.io
  resources:
  - audiografts
  - transcodeprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - transcode.clustarr.io
  resources:
  - audiografts/status
  - transcodejobs/status
  - transcodeprofiles/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - transcode.clustarr.io
  resources:
  - transcodejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - transcode.clustarr.io
  resources:
  - transcodejobs/finalizers
  verbs:
  - update
