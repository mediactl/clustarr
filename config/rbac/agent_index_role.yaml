---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustarr-agent-index-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - index.clustarr.io
  resources:
  - indexerdefinitions
  - indexerproxies
  - indexers
  verbs:
  - get
  - list
  - watch
