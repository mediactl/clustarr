# Binds the `ui` ServiceAccount (config/manager/ui.yaml) to ui_role.yaml,
# never to clustarr-manager-role -- see the note at the top of that file for
# why ui gets its own ClusterRole instead of sharing the controllers' one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-ui-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-ui-role
subjects:
- kind: ServiceAccount
  name: ui
  namespace: clustarr-system
