# Leader election for the manager (lease manager.clustarr.io, spec 2026-10-06
# §5.8); agents never elect. Hand-written: controller-gen does not emit
# leader-election rules. The events grant is the leader election's own
# Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clustarr-leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
