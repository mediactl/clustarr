# Leader election for every controller-runtime manager in the namespace.
# LeaderElectionID is `<service>.clustarr.io` (§2), so one Role covers them
# all; each ServiceAccount gets its own RoleBinding in
# leader_election_role_binding.yaml.
#
# This one is hand-written and stays hand-written: controller-gen does not
# emit leader-election rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clustarr-leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
