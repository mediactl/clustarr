# RBAC for the service Deployments in config/manager that touch the cluster.
# ui is the one exception: it has no controller-runtime manager and is never
# bound to the manager role (see the note in role_binding.yaml); its own
# hand-written ClusterRole and ClusterRoleBinding are ui_role.yaml and
# ui_role_binding.yaml, listed below.
#
# role.yaml is a PLACEHOLDER. `make manifests` regenerates it with
# controller-gen from the +kubebuilder:rbac markers on the reconcilers, which
# do not exist yet; the placeholder only grants CR reads, CRD reads and Event
# writes so that `kustomize build config/default` produces something
# applicable today. Everything else in this directory is hand-written and
# stays hand-written.
#
# What the generated role will have to add (§3, §6):
#   * create/update/patch/delete + status SSA on each service's own kinds
#     (single-writer rule: exactly one service writes each kind's status);
#   * get/list/watch on the other groups' kinds for the cross-service
#     watches, plus the one cross-group status write
#     catalogarr -> download.clustarr.io/downloads/status;
#   * apps StatefulSets/Deployments for grabarr (it owns the engine
#     workloads) and batch Jobs for squasharr (it owns the transcode Jobs);
#   * Secrets for indexer sessions, provider keys and Trakt tokens.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Generated by `make manifests` -- see the note above.
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# ui's ClusterRole is hand-written and stays hand-written (see the note at
# the top of ui_role.yaml) -- controller-gen never touches these two.
- ui_role.yaml
- ui_role_binding.yaml
# The transcode worker's ClusterRole, generated by `make manifests` from
# squasharr/worker's markers alone, and its binding to the squasharr-worker
# ServiceAccount the transcode Jobs run as.
- squasharr_worker_role.yaml
- squasharr_worker_role_binding.yaml
