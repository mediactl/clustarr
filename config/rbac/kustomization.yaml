# RBAC for the service Deployments in config/manager that touch the cluster.
# ui is the one exception: it has no controller-runtime manager and is never
# bound to a generated service role (see the note in role_binding.yaml); its own
# hand-written ClusterRole and ClusterRoleBinding are ui_role.yaml and
# ui_role_binding.yaml, listed below.
#
# One ClusterRole per identity, each GENERATED by `make manifests` from the
# +kubebuilder:rbac markers in exactly that identity's packages (RBAC_ROLES
# and RBAC_PATHS_* in the Makefile; design §10): a service's role is what its
# own reconcilers and workers declare, and nothing another service needs.
# role_binding.yaml binds each ServiceAccount to its own service's role.
# Everything else in this directory is hand-written and stays hand-written.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Generated by `make manifests` -- see the note above.
- catalogarr_role.yaml
- importarr_role.yaml
- indexarr_role.yaml
- grabarr_role.yaml
- grabarr_engine_role.yaml
- squasharr_role.yaml
- captionarr_role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# ui's ClusterRole is hand-written and stays hand-written (see the note at
# the top of ui_role.yaml) -- controller-gen never touches these two.
- ui_role.yaml
- ui_role_binding.yaml
