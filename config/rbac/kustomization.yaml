# RBAC for the manager, the agents and the engine pods. ui is the one
# exception: its hand-written ClusterRole and ClusterRoleBinding are
# ui_role.yaml and ui_role_binding.yaml, listed below.
#
# One ClusterRole per identity, each GENERATED by `make manifests` from the
# +kubebuilder:rbac markers in exactly that identity's packages (RBAC_ROLES
# and RBAC_PATHS_* in the Makefile; spec 2026-10-06 §10.2.4).
# role_binding.yaml binds each ServiceAccount to its own role. Everything
# else in this directory is hand-written and stays hand-written.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Generated by `make manifests` -- see the note above.
- manager_role.yaml
- agent_catalog_role.yaml
- agent_events_role.yaml
- agent_metadata_role.yaml
- agent_import_role.yaml
- agent_index_role.yaml
- agent_caption_role.yaml
- grab_engine_role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# ui's ClusterRole is hand-written and stays hand-written (see the note at
# the top of ui_role.yaml) -- controller-gen never touches these two.
- ui_role.yaml
- ui_role_binding.yaml
