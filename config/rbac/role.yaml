---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustarr-manager-role
rules:
- apiGroups:
  - catalog.clustarr.io
  resources:
  - mediafiles
  - qualityprofiles
  - rootfolders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - movies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - catalog.clustarr.io
  resources:
  - movies/finalizers
  verbs:
  - update
- apiGroups:
  - catalog.clustarr.io
  resources:
  - movies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - download.clustarr.io
  resources:
  - downloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
