# Binds the squasharr-worker ServiceAccount (config/manager/squasharr.yaml)
# to the worker's own ClusterRole. Every transcode batch Job squasharr
# creates runs its pod as that ServiceAccount (--worker-service-account,
# default squasharr-worker), so this is the whole of what a worker can do.
#
# squasharr_worker_role.yaml is GENERATED by `make manifests` from the
# +kubebuilder:rbac markers in app/squash/worker/doc.go alone -- a second
# controller-gen run over that one package -- so the worker's code and its
# Role cannot disagree. A ClusterRoleBinding, not a RoleBinding, because
# TranscodeProfile is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustarr-squasharr-worker-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustarr-squasharr-worker-role
subjects:
- kind: ServiceAccount
  name: squasharr-worker
  namespace: clustarr-system
