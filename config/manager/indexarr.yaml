# indexarr -- Indexer/IndexerDefinition/IndexerProxy controllers, the search
# RPC service, the RSS worker, the SQLite release index and the Torznab
# facade. Design spec §3, §6.2, §11.
#
# EXACTLY ONE REPLICA with strategy Recreate: the release index is a local
# SQLite database (WAL + FTS5) on the ReadWriteOnce PVC `clustarr-index`, and
# two pods cannot hold that PVC or that database open at the same time.
# Recreate makes the rollout stop the old pod before starting the new one.
#
# Runs the distroless `clustarr` image -- indexarr never touches media files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexarr
---
apiVersion: v1
kind: Service
metadata:
  name: indexarr
  labels:
    app.kubernetes.io/component: indexarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: indexarr
  ports:
  # Torznab facade: /{indexer}/api, /{indexer}/download, /search/api.
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 8443
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexarr
  labels:
    app.kubernetes.io/component: indexarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: indexarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: indexarr
    spec:
      serviceAccountName: indexarr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: indexarr
        image: ghcr.io/mediactl/clustarr:dev
        # --nats-single-node: config/default ships the single-server dev NATS
        # in config/nats, which cannot host the R3 streams events.Default()
        # asks for (§12). charts/clustarr deploys a clustered NATS and derives
        # this from the subchart instead.
        args: ["indexarr", "--role", "all", "--nats-single-node"]
        env:
        - name: NATS_URL
          value: nats://nats.clustarr-system.svc:4222
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # §12: GOMEMLIMIT = 80% of 1Gi, in bytes (see catalogarr.yaml).
        - name: GOMEMLIMIT
          value: "858993459"
        - name: CLUSTARR_INDEX_PATH
          value: /var/lib/clustarr/index/releases.db
        # The Torznab facade on port http (8080) FAILS CLOSED: it serves only
        # requests carrying an apikey that is a value in this Secret (in the
        # pod's namespace). indexarr creates it with one random key under
        # "apikey" on first start if it does not exist, and never modifies
        # one that does -- so create it yourself first to choose the key.
        # Read the generated one with:
        #   kubectl -n clustarr-system get secret indexarr-facade \
        #     -o jsonpath='{.data.apikey}' | base64 -d
        # This is the Secret's NAME (--facade-api-key-secret); no key is ever
        # passed on argv or in an env var.
        - name: CLUSTARR_FACADE_API_KEY_SECRET
          value: indexarr-facade
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          # §13: readiness is tied to the SQLite DB being open (plus a
          # JetStream ping).
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: index
          mountPath: /var/lib/clustarr/index
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: index
        persistentVolumeClaim:
          # RWO, 5Gi -- declared in config/default/pvc.yaml.
          claimName: clustarr-index
      - name: tmp
        emptyDir: {}
