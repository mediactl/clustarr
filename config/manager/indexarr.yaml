# indexarr -- Indexer/IndexerDefinition/IndexerProxy controllers, the search
# RPC service, the RSS worker, the SQLite release index and the Torznab
# facade. Design spec §3, §6.2, §11.
#
# EXACTLY ONE REPLICA with strategy Recreate: the release index is a local
# SQLite database (WAL + FTS5) on the ReadWriteOnce PVC `clustarr-index`, and
# two pods cannot hold that PVC or that database open at the same time.
# Recreate makes the rollout stop the old pod before starting the new one.
#
# Runs the distroless `clustarr` image -- indexarr never touches media files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexarr
---
apiVersion: v1
kind: Service
metadata:
  name: indexarr
  labels:
    app.kubernetes.io/component: indexarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: indexarr
  ports:
  # Torznab facade: /{indexer}/api, /{indexer}/download, /search/api.
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 8443
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexarr
  labels:
    app.kubernetes.io/component: indexarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: indexarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: indexarr
    spec:
      serviceAccountName: indexarr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: indexarr
        image: ghcr.io/mediactl/clustarr:dev
        args: ["indexarr", "--role", "all"]
        env:
        - name: NATS_URL
          value: nats://nats.clustarr-system.svc:4222
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTARR_INDEX_PATH
          value: /var/lib/clustarr/index/releases.db
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          # §13: readiness is tied to the SQLite DB being open (plus a
          # JetStream ping).
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: index
          mountPath: /var/lib/clustarr/index
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: index
        persistentVolumeClaim:
          # RWO, 5Gi -- declared in config/default/pvc.yaml.
          claimName: clustarr-index
      - name: tmp
        emptyDir: {}
