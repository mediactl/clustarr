# agent-import -- library scans, file imports, import-list syncs, recycle
# sweeps and probes (agent --domain=import, spec 2026-10-06 §3.5). Autoscaled
# 0..N by the manager on its durables' lag; mounts /data read-write. Read-only
# against Kubernetes: scan observations and import results go to the
# manager's intake and records.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-import
---
apiVersion: v1
kind: Service
metadata:
  name: agent-import
  labels:
    app.kubernetes.io/component: agent-import
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-import
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-import
  labels:
    app.kubernetes.io/component: agent-import
    autoscale.clustarr.io/domain: import
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-import
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-import
    spec:
      serviceAccountName: agent-import
      # The longest AckWait it drains (60 s) plus 25 s (spec §3.5.6).
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Soft: a required anti-affinity would stall a RollingUpdate surge on a
      # single node (OD33).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: agent-import
      containers:
        - name: agent-import
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=import"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: UMASK
              value: "002"
            # GOMEMLIMIT = 60% of 1536Mi, in bytes: FFmpeg allocates outside the Go heap (OD42).
            - name: GOMEMLIMIT
              value: "966367642"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
