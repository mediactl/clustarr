# squasharr -- TranscodeProfile/TranscodeJob controllers and the slot
# scheduler. Design spec §3, §6.4.
#
# The transcode work itself runs as per-(profile, class) pool Jobs that this
# controller manages (X14): the pool binary, cmd/squasharr-worker, holds no
# Kubernetes credentials at all -- it reports over NATS (spec §18.1) and the
# pool pods carry no ServiceAccount -- so squasharr is the sole writer of
# TranscodeJob.status.
#
# /data is mounted so the controller can stat sources and sweep the recycle
# bin; the heavy I/O happens in the pool Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: squasharr
---
apiVersion: v1
kind: Service
metadata:
  name: squasharr
  labels:
    app.kubernetes.io/component: squasharr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: squasharr
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squasharr
  labels:
    app.kubernetes.io/component: squasharr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: squasharr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: squasharr
    spec:
      serviceAccountName: squasharr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squasharr
          image: ghcr.io/mediactl/clustarr/media:dev
          # --leader-elect: §3 and §12 run the controllers under a lease so
          # only one replica reconciles. The flag defaults to off, so a
          # controller Deployment that omits it reconciles from every replica.
          # --nats-single-node: config/default ships the single-server dev NATS
          # in config/nats, which cannot host the R3 streams events.Default()
          # asks for (§12). charts/clustarr deploys a clustered NATS and derives
          # this from the subchart instead.
          args:
            [
              "squasharr",
              "--role",
              "controller",
              "--slots",
              "cpu=2,nvidia=1,intel=1",
              "--leader-elect",
              "--nats-single-node",
            ]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: UMASK
              value: "002"
            # §12: GOMEMLIMIT = 80% of 512Mi, in bytes (see catalogarr.yaml).
            # This is squasharr's OWN controller process, not the transcode
            # Job pods it creates -- those are sized per profile (§9), not
            # this Deployment's resources.
            - name: GOMEMLIMIT
              value: "429496730"
            # Images stamped into the pool Job pods this controller manages
            # (--worker-image, --worker-image-cuda). The pods mount
            # clustarr-data and carry no ServiceAccount (X14): the pool
            # binary reports over NATS, never Kubernetes, so it needs no
            # credentials.
            - name: CLUSTARR_WORKER_IMAGE
              value: ghcr.io/mediactl/clustarr/transcoder:dev
            - name: CLUSTARR_WORKER_IMAGE_CUDA
              value: ghcr.io/mediactl/clustarr/transcoder-cuda:dev
            # Intel transcode Jobs need the host's render group
            # (--intel-render-groups, $CLUSTARR_INTEL_RENDER_GROUPS): the GID
            # owning /dev/dri/renderD* on the Intel GPU nodes, which varies
            # per host install, so nothing is set here. Add e.g.
            #   - name: CLUSTARR_INTEL_RENDER_GROUPS
            #     value: "109"
            # or run a container runtime with
            # device_ownership_from_security_context enabled instead.
            #
            # --gpu-node-label-nvidia/--gpu-node-label-intel
            # ($CLUSTARR_GPU_NODE_LABEL_NVIDIA/_INTEL) default to
            # nvidia.com/gpu.present and intel.feature.node.kubernetes.io/gpu
            # -- what the NVIDIA GPU Operator's GPU Feature Discovery and
            # Intel's Node Feature Discovery already set -- so nothing is set
            # here either. Override only for a cluster that labels its GPU
            # nodes differently:
            #   - name: CLUSTARR_GPU_NODE_LABEL_NVIDIA
            #     value: "my.org/nvidia-gpu"
            #   - name: CLUSTARR_GPU_NODE_LABEL_INTEL
            #     value: "my.org/intel-gpu"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
        - name: tmp
          emptyDir: {}
