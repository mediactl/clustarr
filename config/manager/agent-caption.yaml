# agent-caption -- subtitle fetches (agent --domain=caption, spec 2026-10-06
# §3.5). Autoscaled 0..1: fetches wait on the shared provider token bucket.
# Mounts /data read-write for sidecars; answers in clustarr-subtitles, and the
# manager's remediation loop writes MediaFile status (ADR-0016).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-caption
---
apiVersion: v1
kind: Service
metadata:
  name: agent-caption
  labels:
    app.kubernetes.io/component: agent-caption
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-caption
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-caption
  labels:
    app.kubernetes.io/component: agent-caption
    autoscale.clustarr.io/domain: caption
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-caption
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-caption
    spec:
      serviceAccountName: agent-caption
      # The longest AckWait it drains (caption-fetch-*, 90 s) plus 25 s (spec §3.5.6).
      terminationGracePeriodSeconds: 115
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Soft: a required anti-affinity would stall a RollingUpdate surge on a
      # single node (OD33).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: agent-caption
      containers:
        - name: agent-caption
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=caption"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: UMASK
              value: "002"
            # GOMEMLIMIT = 60% of 1Gi, in bytes: FFmpeg allocates outside the Go heap (OD42).
            - name: GOMEMLIMIT
              value: "644245094"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
