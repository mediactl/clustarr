# importarr-worker -- the scan, list and fileimport consumers. Amendment
# §A1.6, design spec §3, §12.
#
# Every replica needs a writable /data: a scan or import worker that cannot
# write the library must not accept work (amendment §A1.6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: importarr-worker
---
apiVersion: v1
kind: Service
metadata:
  name: importarr-worker
  labels:
    app.kubernetes.io/component: importarr-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: importarr-worker
  ports:
  - name: metrics
    port: 8443
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: importarr-worker
  labels:
    app.kubernetes.io/component: importarr-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: importarr-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: importarr-worker
    spec:
      serviceAccountName: importarr-worker
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: importarr-worker
        image: ghcr.io/mediactl/clustarr-media:dev
        # --nats-single-node: config/default ships the single-server dev NATS
        # in config/nats, which cannot host the R3 streams events.Default()
        # asks for (§12). charts/clustarr deploys a clustered NATS and derives
        # this from the subchart instead.
        args: ["importarr", "--role", "worker", "--nats-single-node"]
        env:
        - name: NATS_URL
          value: nats://nats.clustarr-system.svc:4222
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # §11: everything writing under /data uses UMASK 002 so the other
        # services (and the transcode Jobs) can rewrite what it creates.
        - name: UMASK
          value: "002"
        ports:
        - name: metrics
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          # §13: readiness is /data writability plus a JetStream ping.
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clustarr-data
      - name: tmp
        emptyDir: {}
