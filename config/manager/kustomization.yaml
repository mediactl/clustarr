# One Deployment per row of the process topology (spec 2026-10-06 §10.2.1):
# the manager, one agent per domain, markers and the ui. The download engines
# (`<downloadclient>-engine` StatefulSets and Deployments) and the transcode
# pool and graft Jobs are absent on purpose: the manager creates those at
# runtime, owned by the object that asked for them. manager.yaml also holds
# the grab-engine ServiceAccount the engines run as.
#
# Standalone `kustomize build config/manager` renders without a namespace; the
# deployable form is `kustomize build config/default`, which adds
# clustarr-system, the PVCs, the CRDs, RBAC, the External Metrics APIService
# and NATS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
- includeSelectors: false
  pairs:
    app.kubernetes.io/managed-by: kustomize

resources:
- manager.yaml
- agent-catalog.yaml
- agent-events.yaml
- agent-metadata.yaml
- agent-import.yaml
- agent-index.yaml
- agent-caption.yaml
- markers.yaml
- ui.yaml
- livetv-service.yaml
