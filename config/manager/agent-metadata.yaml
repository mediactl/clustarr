# agent-metadata -- the metadata gateway, TheIntroDB markers and artwork
# fetches (agent --domain=metadata, spec 2026-10-06 §3.5). Exactly one
# replica, Recreate: its provider rate limiters live in process memory
# (ADR-0007), so a second replica would double the outbound request rate.
# Read-only: it answers in records and the artwork object store; the manager
# writes every status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-metadata
---
apiVersion: v1
kind: Service
metadata:
  name: agent-metadata
  labels:
    app.kubernetes.io/component: agent-metadata
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-metadata
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-metadata
  labels:
    app.kubernetes.io/component: agent-metadata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-metadata
    spec:
      serviceAccountName: agent-metadata
      # The longest AckWait it drains (60 s) plus 25 s (spec §3.5.6).
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-metadata
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=metadata"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # GOMEMLIMIT = 80% of 512Mi, in bytes.
            - name: GOMEMLIMIT
              value: "429496730"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
