# catalogarr -- catalog.clustarr.io controllers (leader-elected) + the queue
# workers that run on *every* replica (search, grab, rss-matcher) + the
# history sink and DLQ projector (leader only). The import and importlist
# consumers are importarr's, not catalogarr's (amendment §A1.2, §A1.3;
# app/catalog/run.go's RoleWorker doc comment).
# Design spec §3 (process topology), §6.1.
#
# Scale-out is allowed: the controllers stay leader-only, the workers are
# JetStream queue consumers and scale horizontally with the replica count.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogarr
---
apiVersion: v1
kind: Service
metadata:
  name: catalogarr
  labels:
    app.kubernetes.io/component: catalogarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: catalogarr
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogarr
  labels:
    app.kubernetes.io/component: catalogarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: catalogarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: catalogarr
    spec:
      serviceAccountName: catalogarr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalogarr
          # clustarr-media: the importer hardlinks/moves files and reuses ffprobe
          # for MediaFile probes, so it needs the media toolchain image.
          image: ghcr.io/mediactl/clustarr/media:dev
          # --leader-elect: §3 and §12 run the controllers under a lease so
          # only one replica reconciles. The flag defaults to off, so a
          # controller Deployment that omits it reconciles from every replica.
          # artwork: the overlay renderer (spec §C.6) runs here, not in
          # catalogarr-metadata -- it is not leader-elected and scales by
          # consumer, and the gateway is pinned to one replica.
          # --nats-single-node: config/default ships the single-server dev NATS
          # in config/nats, which cannot host the R3 streams events.Default()
          # asks for (§12). charts/clustarr deploys a clustered NATS and derives
          # this from the subchart instead.
          args:
            [
              "catalogarr",
              "--role",
              "controller,worker,history,artwork",
              "--leader-elect",
              "--nats-single-node",
            ]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # §11: everything writing under /data uses UMASK 002 so the other
            # services (and the transcode Jobs) can rewrite what it creates.
            - name: UMASK
              value: "002"
            # §12: GOMEMLIMIT = 80% of the container's own memory limit below
            # (1Gi * 0.8, in bytes -- the Downward API's resourceFieldRef only
            # ever gives 100% of the limit, so this is computed by hand and
            # kept in sync with resources.limits.memory; the chart computes
            # the identical value at render time via clustarr.gomemlimit).
            - name: GOMEMLIMIT
              value: "858993459"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            # §13: readiness is a JetStream ping.
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
        - name: tmp
          emptyDir: {}
