# grabarr -- DownloadClient and Download controllers. Design spec §3, §6.3.
#
# The download *engines* are not here: the DownloadClient controller creates a
# StatefulSet (torrent) or Deployment (usenet) per DownloadClient at runtime,
# sized by DownloadClient.spec.replicas. This Deployment is the controller
# only.
#
# It mounts /data because the Download finalizer removes per-download
# directories under /data/torrents and /data/usenet, and the DiskSpaceOK
# condition is a statfs on the mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grabarr
---
apiVersion: v1
kind: Service
metadata:
  name: grabarr
  labels:
    app.kubernetes.io/component: grabarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: grabarr
  ports:
  - name: metrics
    port: 8443
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grabarr
  labels:
    app.kubernetes.io/component: grabarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grabarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grabarr
    spec:
      serviceAccountName: grabarr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grabarr
        image: ghcr.io/mediactl/clustarr-media:dev
        # --leader-elect: §3 and §12 run the controllers under a lease so
        # only one replica reconciles. The flag defaults to off, so a
        # controller Deployment that omits it reconciles from every replica.
        # --nats-single-node: config/default ships the single-server dev NATS
        # in config/nats, which cannot host the R3 streams events.Default()
        # asks for (§12). charts/clustarr deploys a clustered NATS and derives
        # this from the subchart instead.
        args: ["grabarr", "--role", "controller", "--leader-elect", "--nats-single-node"]
        env:
        - name: NATS_URL
          value: nats://nats.clustarr-system.svc:4222
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: UMASK
          value: "002"
        # Images the controller stamps into the engine workloads it owns.
        - name: CLUSTARR_ENGINE_IMAGE
          value: ghcr.io/mediactl/clustarr-media:dev
        ports:
        - name: metrics
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clustarr-data
      - name: tmp
        emptyDir: {}
