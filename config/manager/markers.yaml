# markers -- skip-segment detection (spec 2026-10-01 segment detection; spec
# 2026-10-06 §3.7): the credential-less cmd/markers binary on the native
# image. It reads /data and talks NATS, so its ServiceAccount mounts no token
# and nothing binds it. Autoscaled 0..N on markers-analyze's lag, one pod per
# node (agentdomain.Domain.PerNode): the HPA targets one task per pod, up to
# the matching nodes. A pod's slots are CLUSTARR_CONSUMER_SLOTS'
# (`markers-analyze=N`), else one per --cores-per-slot of the CPUs it can use
# (GOMAXPROCS), from 1 to 8: so no CPU limit, and a memory limit that holds 8
# slots (256 MiB a pod plus 448 MiB a slot, measured on 4K HEVC Main 10 under
# the mmap threshold GLIBC_TUNABLES sets; the chart's values.yaml has the
# figures). Grace is 60 s, the
# consumer's StopBudget (the 15 s requeue drain) plus 25 s and the tracer's
# flush: on SIGTERM it cancels its analyses at once and requeues their
# seasons, spending none of their deliveries (RequeueOnStop; ADR-0020 §1 as
# amended 2026-10-15), rather than waiting out the 30-minute AckWait.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: markers
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: markers
  labels:
    app.kubernetes.io/component: markers
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: markers
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: markers
  labels:
    app.kubernetes.io/component: markers
    autoscale.clustarr.io/domain: markers
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: markers
  template:
    metadata:
      labels:
        app.kubernetes.io/component: markers
    spec:
      serviceAccountName: markers
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # One pod per node: hard, over the nodes its pods may land on and
      # tolerate (the nodes the autoscaler counts as maxReplicas). maxSkew 1
      # still fits a RollingUpdate surge pod beside an old one, where a
      # required anti-affinity would stall it (OD33).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: markers
      containers:
        - name: markers
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/markers"]
          args: ["--cores-per-slot=2"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for its presence report (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # A fixed 128 KiB mmap threshold: FFmpeg's frame buffers are then
            # mapped and unmapped, not kept in glibc's arenas once freed.
            # Under glibc's sliding threshold eight 4K analyses held 7.3 GB,
            # with it 2.8 GB.
            - name: GLIBC_TUNABLES
              value: glibc.malloc.mmap_threshold=131072
            # GOMEMLIMIT = 50% of 4Gi, in bytes: FFmpeg and ONNX Runtime
            # allocate outside the Go heap (OD42).
            - name: GOMEMLIMIT
              value: "2147483648"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            # NATS connected and the subscription bound (§3.3).
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          # No CPU limit: GOMAXPROCS, and with it the slots and the decode
          # threads, follows the node.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
            readOnly: true
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
