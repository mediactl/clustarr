# agent-index -- the release index, the search/download/query RPC, RSS polls
# and the Torznab facade (agent --domain=index, spec 2026-10-06 §3.5).
# Exactly one replica, Recreate: the release index is SQLite on the
# ReadWriteOnce PVC clustarr-index, and the RPC responders, facade and
# per-host limiter are one process (R4 amendment). Read-only against
# Kubernetes: indexer outcomes go to records, the manager writes status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-index
---
apiVersion: v1
kind: Service
metadata:
  name: agent-index
  labels:
    app.kubernetes.io/component: agent-index
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-index
  ports:
    # Torznab facade: /{indexer}/api, /{indexer}/download, /search/api.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-index
  labels:
    app.kubernetes.io/component: agent-index
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-index
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-index
    spec:
      serviceAccountName: agent-index
      # The longest AckWait it drains (index-rss, 60 s) plus 25 s (spec §3.5.6).
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-index
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=index"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # GOMEMLIMIT = 80% of 1Gi, in bytes.
            - name: GOMEMLIMIT
              value: "858993459"
            - name: CLUSTARR_INDEX_PATH
              value: /var/lib/clustarr/index/releases.db
            # The Torznab facade on port http (8080) fails closed: it serves
            # only requests carrying an apikey that is a value in this Secret.
            # The manager creates it with one random key under "apikey" when
            # it is absent and never modifies one that does, so create it
            # yourself first to choose the key; this agent only reads it, and
            # manager.yaml names the same Secret. Read the key with
            #   kubectl -n clustarr-system get secret index-facade -o jsonpath='{.data.apikey}' | base64 -d
            - name: CLUSTARR_FACADE_API_KEY_SECRET
              value: index-facade
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: index
              mountPath: /var/lib/clustarr/index
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: clustarr-index
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
