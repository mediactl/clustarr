# agent-events -- the RSS matcher (agent --domain=events, spec 2026-10-06
# §3.5; ADR-0019 moved the history sink and the DLQ projector into the
# manager and retired the redownload consumer). Autoscaled 1..N: its stream is
# memory-backed with discard-old on single-node NATS (§3.5.4), so it never
# scales to zero. Read-only: candidates go to the manager's intake.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-events
---
apiVersion: v1
kind: Service
metadata:
  name: agent-events
  labels:
    app.kubernetes.io/component: agent-events
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-events
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-events
  labels:
    app.kubernetes.io/component: agent-events
    autoscale.clustarr.io/domain: events
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-events
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-events
    spec:
      serviceAccountName: agent-events
      # The longest AckWait it drains (catalog-rss-matcher, 30 s) plus 25 s (spec §3.5.6).
      terminationGracePeriodSeconds: 55
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Soft: a required anti-affinity would stall a RollingUpdate surge on a
      # single node (OD33).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: agent-events
      containers:
        - name: agent-events
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=events"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # GOMEMLIMIT = 80% of 1Gi, in bytes.
            - name: GOMEMLIMIT
              value: "858993459"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: true, so /tmp has to be a volume.
        - name: tmp
          emptyDir: {}
