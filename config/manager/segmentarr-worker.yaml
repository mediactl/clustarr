# segmentarr-worker -- skip-segment detection (spec 2026-10-01 segment
# detection). Not a clustarr service: the separate, credential-less
# segmentarr-worker binary on the media image. It reads /data and talks
# NATS, so its ServiceAccount mounts no token and nothing binds it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: segmentarr-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segmentarr-worker
  labels:
    app.kubernetes.io/component: segmentarr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: segmentarr-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: segmentarr-worker
    spec:
      serviceAccountName: segmentarr-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: segmentarr-worker
          image: ghcr.io/mediactl/clustarr/media:dev
          command: ["/usr/local/bin/segmentarr-worker"]
          args: ["--concurrency=1"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: UMASK
              value: "002"
            # GOMEMLIMIT = 80% of 2Gi, in bytes (see catalogarr.yaml).
            - name: GOMEMLIMIT
              value: "1717986918"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clustarr-data
            readOnly: true
        - name: tmp
          emptyDir: {}
