# agent-catalog -- searches and artwork renders (agent --domain=catalog,
# spec 2026-10-06 §3.5). No spec.replicas: the manager's autoscale reconciler
# owns this Deployment's HPA, selected by autoscale.clustarr.io/domain, and
# scales it 0..1 (its searches end in the index agent's per-host limiter).
# Read-only: it answers in records; the manager writes every status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: agent-catalog
  labels:
    app.kubernetes.io/component: agent-catalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: agent-catalog
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-catalog
  labels:
    app.kubernetes.io/component: agent-catalog
    autoscale.clustarr.io/domain: catalog
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-catalog
    spec:
      serviceAccountName: agent-catalog
      # The longest AckWait it drains (catalog-search-*, 120 s) plus 25 s
      # (spec §3.5.6).
      terminationGracePeriodSeconds: 145
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Soft: a required anti-affinity would stall a RollingUpdate surge on a
      # single node (OD33).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: agent-catalog
      containers:
        - name: agent-catalog
          image: ghcr.io/mediactl/clustarr/native:dev
          command: ["/usr/bin/agent"]
          args: ["--domain=catalog"]
          env:
            - name: NATS_URL
              value: nats://nats.clustarr-system.svc:4222
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The node the pod runs on, for the agent's presence report
            # (ADR-0019 §5.3).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # GOMEMLIMIT = 80% of 1Gi, in bytes.
            - name: GOMEMLIMIT
              value: "858993459"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
