# ServiceMonitors for the seven service Deployments. One per Service in
# config/manager, all scraping the same `metrics` port.
#
# §13: controller-runtime metrics plus metrics.RegisterRESTClientMetrics() are
# served on :8443 BEHIND THE AUTHN/AUTHZ FILTER, so the endpoint is https and
# the scrape must present a bearer token. Prometheus's ServiceAccount
# therefore needs the `clustarr-metrics-reader` ClusterRole in
# metrics_reader_role.yaml bound to it -- see README.md.
#
# The certificate is self-signed by the manager at startup, hence
# insecureSkipVerify. Swap in cert-manager and a real serverName if your
# cluster requires verified scrapes.
# catalogarr: catalog controllers, queue workers, history sink.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalogarr
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: catalogarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clustarr
      app.kubernetes.io/part-of: clustarr
      app.kubernetes.io/component: catalogarr
  endpoints:
  - port: metrics
    path: /metrics
    scheme: https
    interval: 30s
    scrapeTimeout: 10s
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      insecureSkipVerify: true
---
