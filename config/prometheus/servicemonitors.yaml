# ServiceMonitors for the manager, the six agents and markers: one per Service
# in config/manager that serves metrics. ui is the one Deployment without
# one: it runs no manager, so it serves no metrics port.
#
# This list is kept in step with charts/clustarr/templates/servicemonitor.yaml
# by TestChartAndKustomizeAgreePerComponent in test/guards.
#
# §13: the manager's and the agents' controller-runtime metrics plus
# metrics.RegisterRESTClientMetrics() are served on :8443 BEHIND THE
# AUTHN/AUTHZ FILTER, so the endpoint is https and the scrape must present a
# bearer token. Prometheus's ServiceAccount therefore needs the
# `clustarr-metrics-reader` ClusterRole in metrics_reader_role.yaml bound to
# it -- see README.md. markers serves plain http on 8080.
#
# The certificate is self-signed by each process at startup, hence
# insecureSkipVerify. Swap in cert-manager and a real serverName if your
# cluster requires verified scrapes.
# manager: every controller: reconcile, workqueue and REST-client series, the queue gauges and the External Metrics API's own.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: manager
  labels:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/part-of: clustarr
    app.kubernetes.io/component: manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clustarr
      app.kubernetes.io/part-of: clustarr
      app.kubernetes.io/component: manager
  endpoints:
  - port: metrics
    path: /metrics
    scheme: https
    interval: 30s
    scrapeTimeout: 10s
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      insecureSkipVerify: true
---
