apiVersion: v1
kind: Service
metadata:
  name: external-metrics
  labels:
    app.kubernetes.io/component: external-metrics
spec:
  type: ClusterIP
  # The aggregator must reach a manager whose caches are still syncing (§9.4).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: clustarr
    app.kubernetes.io/component: manager
  ports:
    - name: https
      port: 443
      targetPort: extmetrics
      protocol: TCP
